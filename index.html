示对应包裹订单号，并核对与面单匹配。将照片交给仓库核验 POD，核验有效后由仓库开启 \u003ccode>Allow Proof\u003c/code>，司机再完成 Proof 签收。\u003c/li>\n\u003c/ol>\n"},"plain":{"en":"Open the parcel in the driver app and select OTP, Proof or Not Sign according to the delivery outcome. OTP confirmation Contact the customer for the OTP about 30 minutes before reaching the delivery address. You can also agree on a delivery time in advance and get the OTP when handing over the parcel in person. Enter the OTP in the driver app to confirm delivery. Unsuccessful delivery In the driver app, select the reason in Not Sign that matches what happened. The driver can send the OTP once. Ask the warehouse to resend it if needed. For Proof, take one photo showing the customer's ID, driver's licence or mobile shopping order screenshot alongside the parcel waybill. A screenshot must show the matching parcel order number. Send the photo to the warehouse to check the POD. Once it is valid, warehouse staff enable Allow Proof and the driver can complete Proof confirmation.","zh":"在司机 App 打开包裹，按实际结果选择 OTP、Proof 或 Not Sign。 OTP 签收 预计到达收货地址前约 30 分钟联系顾客询问 OTP。也可以提前约定派送时间，在面对面交货时取得 OTP。 在司机 App 中填入 OTP，完成签收。 派送失败 在司机 App 的 Not Sign 中选择与实际情况相符的失败原因。 司机只能主动发送一次 OTP。需要重发时，请仓库协助。 使用 Proof 签收时，把顾客出示的身份证件（如 ID 或驾驶证）或手机购物订单截图，与包裹面单（Waybill）放在一起拍照。使用截图时须显示对应包裹订单号，并核对与面单匹配。将照片交给仓库核验 POD，核验有效后由仓库开启 Allow Proof，司机再完成 Proof 签收。"},"operation":"Driver App","review":null,"keyCheck":{"en":"","zh":""},"aliases":["resend otp","allow proof","proof sign","重发 OTP","开启 Proof"]},{"id":"2-2/failure-reasons","kind":"topic","title":{"en":"Delivery Failure Reasons and Next Actions for OFD Parcels","zh":"OFD 包裹派送失败原因与后续处理"},"ordinal":"","body":{"en":"\u003cp>When a delivery attempt fails, select the reason that matches what happened in \u003ccode>Not Sign\u003c/code>.\u003c/p>\n\u003cp>\u003cstrong>Customer Service (CS)\u003c/strong>\u003c/p>\n\u003cp>Under the current hub guidance, selecting any of the following reasons automatically starts the Customer Service workflow.\u003c/p>\n\u003cdiv class=\"table-scroll\" tabindex=\"0\" role=\"region\" aria-label=\"Table\">\u003ctable>\n\u003cthead>\n\u003ctr>\n  \u003cth>Reason in the driver app\u003c/th>\n  \u003cth>Meaning\u003c/th>\n\u003c/tr>\n\u003c/thead>\n\u003ctbody>\n\u003ctr>\n  \u003ctd>\u003ccode>02_Blocked\u003c/code>\u003c/td>\n  \u003ctd>Contact was blocked.\u003c/td>\n\u003c/tr>\n\u003ctr>\n  \u003ctd>\u003ccode>05_Cancelled\u003c/code>\u003c/td>\n  \u003ctd>The customer cancelled.\u003c/td>\n\u003c/tr>\n\u003ctr>\n  \u003ctd>\u003ccode>07_Want to open the order\u003c/code>\u003c/td>\n  \u003ctd>The customer wants to open the parcel.\u003c/td>\n\u003c/tr>\n\u003ctr>\n  \u003ctd>\u003ccode>12_Wrong Mobile\u003c/code>\u003c/td>\n  \u003ctd>The customer's mobile number is incorrect.\u003c/td>\n\u003c/tr>\n\u003ctr>\n  \u003ctd>\u003ccode>18_Can not enter address\u003c/code>\u003c/td>\n  \u003ctd>The driver cannot access the delivery address.\u003c/td>\n\u003c/tr>\n\u003ctr>\n  \u003ctd>\u003ccode>30_Cancelled-Refuse to PayVAT/tariffs\u003c/code>\u003c/td>\n  \u003ctd>The delivery was cancelled because the customer refused to pay VAT or duties.\u003c/td>\n\u003c/tr>\n\u003c/tbody>\n\u003c/table>\u003c/div>\n\u003cp>\u003cstrong>No answer or delivery deferred\u003c/strong>\u003c/p>\n\u003cul>\n\u003cli>If there is no answer, bring the parcel back to the warehouse, scan it in, sort it again and send it out for delivery.\u003cbr />\nUnder the current hub guidance, five consecutive OFD attempts ending in \u003ccode>No Answer\u003c/code> trigger the Customer Service workflow.\u003c/li>\n\u003cli>For these two reasons, scan the returned parcel into the warehouse, sort it again and arrange the next delivery attempt.\u003cbr />\nThese two reasons have no retry limit of their own, so keep arranging delivery while the parcel is still eligible, until the customer receives it.\u003cbr />\nSee section \u003ca href=\"#2-3\">2-3\u003c/a> for storing and picking scheduled parcels and section \u003ca href=\"#2-5\">2-5\u003c/a> for automatic RTO.\u003c/li>\n\u003c/ul>\n\u003cp>\u003cstrong>RTO or transfer after an address change\u003c/strong>\u003c/p>\n\u003cul>\n\u003cli>Selecting \u003ccode>Opened by receipent\u003c/code>, \u003ccode>Damaged\u003c/code> or \u003ccode>Wrong Address → Out of Serviced Area\u003c/code> starts the RTO workflow.\u003c/li>\n\u003cli>Selecting \u003ccode>Wrong Address → Wrong City\u003c/code> starts the address correction and transfer process.\u003cbr />\nAfter obtaining and updating the correct address in the system, complete Load and transfer the parcel to the correct hub so it can scan the parcel in and arrange delivery.\u003c/li>\n\u003c/ul>\n","zh":"\u003cp>司机派送失败时，在 \u003ccode>Not Sign\u003c/code> 按实际情况选择对应原因。\u003c/p>\n\u003cp>\u003cstrong>进入客服流程\u003c/strong>\u003c/p>\n\u003cp>按当前站点操作口径，选择下列任一原因时，系统会自动触发客服流程。\u003c/p>\n\u003cdiv class=\"table-scroll\" tabindex=\"0\" role=\"region\" aria-label=\"Table\">\u003ctable>\n\u003cthead>\n\u003ctr>\n  \u003cth>司机 App 原因\u003c/th>\n  \u003cth>含义\u003c/th>\n\u003c/tr>\n\u003c/thead>\n\u003ctbody>\n\u003ctr>\n  \u003ctd>\u003ccode>02_Blocked\u003c/code>\u003c/td>\n  \u003ctd>联系被屏蔽。\u003c/td>\n\u003c/tr>\n\u003ctr>\n  \u003ctd>\u003ccode>05_Cancelled\u003c/code>\u003c/td>\n  \u003ctd>顾客取消。\u003c/td>\n\u003c/tr>\n\u003ctr>\n  \u003ctd>\u003ccode>07_Want to open the order\u003c/code>\u003c/td>\n  \u003ctd>顾客要求开包验货。\u003c/td>\n\u003c/tr>\n\u003ctr>\n  \u003ctd>\u003ccode>12_Wrong Mobile\u003c/code>\u003c/td>\n  \u003ctd>顾客手机号码有误。\u003c/td>\n\u003c/tr>\n\u003ctr>\n  \u003ctd>\u003ccode>18_Can not enter address\u003c/code>\u003c/td>\n  \u003ctd>无法进入收货地址。\u003c/td>\n\u003c/tr>\n\u003ctr>\n  \u003ctd>\u003ccode>30_Cancelled-Refuse to PayVAT/tariffs\u003c/code>\u003c/td>\n  \u003ctd>顾客拒付增值税或关税，取消派送。\u003c/td>\n\u003c/tr>\n\u003c/tbody>\n\u003c/table>\u003c/div>\n\u003cp>\u003cstrong>无人接听或暂未派送\u003c/strong>\u003c/p>\n\u003cul>\n\u003cli>\u003cstrong>\u003ccode>No Answer\u003c/code>\u003c/strong> 无人接听时，将包裹带回仓库，重新 Inbound、Sort，再安排 OFD。\u003cbr />\n按当前站点操作口径，连续 5 次 OFD 均为 \u003ccode>No Answer\u003c/code> 时会触发客服流程。\u003c/li>\n\u003cli>\u003cstrong>\u003ccode>Future Delivery\u003c/code> 或 \u003ccode>No Time for Deliver/Collect\u003c/code>\u003c/strong> 包裹回仓后重新 Inbound、Sort，再安排 OFD。\u003cbr />\n这两种原因本身不设重派次数上限，包裹仍符合派送条件时，继续安排派送直至签收。\u003cbr />\n预约件的上下架参见 \u003ca href=\"#2-3\">2-3\u003c/a>，长期未签收的自动退运参见 \u003ca href=\"#2-5\">2-5\u003c/a>。\u003c/li>\n\u003c/ul>\n\u003cp>\u003cstrong>触发退运或改址转仓\u003c/strong>\u003c/p>\n\u003cul>\n\u003cli>\u003cstrong>触发 RTO\u003c/strong> 选择 \u003ccode>Opened by receipent\u003c/code>（收件人已开包）、\u003ccode>Damaged\u003c/code>（破损）或 \u003ccode>Wrong Address → Out of Serviced Area\u003c/code>（地址超出服务范围）后，进入 RTO 流程。\u003c/li>\n\u003cli>\u003cstrong>\u003ccode>Wrong Address → Wrong City\u003c/code>\u003c/strong> 进入改址转仓流程。\u003cbr />\n拿到正确地址并在系统里更新后，做 Load 并把包裹转到对应 Hub，由目的 Hub 重新 Inbound 后安排派送。\u003c/li>\n\u003c/ul>\n"},"summary":{"en":"When a delivery attempt fails, select the reason that matches what happened in Not Sign.","zh":"司机派送失败时，在 Not Sign 按实际情况选择对应原因。"},"notes":{"en":"\u003col>\n\u003cli>The system shows the reason the driver selected in \u003ccode>Not Sign\u003c/code>. Use \u003ccode>No Time for Deliver/Collect\u003c/code> sparingly and choose a more specific reason when it accurately reflects what happened.\u003c/li>\n\u003c/ol>\n","zh":"\u003col>\n\u003cli>系统可查看司机选择的 \u003ccode>Not Sign\u003c/code> 原因。通常尽量少选 \u003ccode>No Time for Deliver/Collect\u003c/code>（No Time for Delivery），选更符合实际的具体原因，便于追溯。\u003c/li>\n\u003c/ol>\n"},"plain":{"en":"When a delivery attempt fails, select the reason that matches what happened in Not Sign. Customer Service (CS) Under the current hub guidance, selecting any of the following reasons automatically starts the Customer Service workflow. Reason in the driver app Meaning 02_Blocked Contact was blocked. 05_Cancelled The customer cancelled. 07_Want to open the order The customer wants to open the parcel. 12_Wrong Mobile The customer's mobile number is incorrect. 18_Can not enter address The driver cannot access the delivery address. 30_Cancelled-Refuse to PayVAT/tariffs The delivery was cancelled because the customer refused to pay VAT or duties. No answer or delivery deferred If there is no answer, bring the parcel back to the warehouse, scan it in, sort it again and send it out for delivery. Under the current hub guidance, five consecutive OFD attempts ending in No Answer trigger the Customer Service workflow. For these two reasons, scan the returned parcel into the warehouse, sort it again and arrange the next delivery attempt. These two reasons have no retry limit of their own, so keep arranging delivery while the parcel is still eligible, until the customer receives it. See section 2-3 for storing and picking scheduled parcels and section 2-5 for automatic RTO. RTO or transfer after an address change Selecting Opened by receipent, Damaged or Wrong Address → Out of Serviced Area starts the RTO workflow. Selecting Wrong Address → Wrong City starts the address correction and transfer process. After obtaining and updating the correct address in the system, complete Load and transfer the parcel to the correct hub so it can scan the parcel in and arrange delivery. The system shows the reason the driver selected in Not Sign. Use No Time for Deliver/Collect sparingly and choose a more specific reason when it accurately reflects what happened.","zh":"司机派送失败时，在 Not Sign 按实际情况选择对应原因。 进入客服流程 按当前站点操作口径，选择下列任一原因时，系统会自动触发客服流程。 司机 App 原因 含义 02_Blocked 联系被屏蔽。 05_Cancelled 顾客取消。 07_Want to open the order 顾客要求开包验货。 12_Wrong Mobile 顾客手机号码有误。 18_Can not enter address 无法进入收货地址。 30_Cancelled-Refuse to PayVAT/tariffs 顾客拒付增值税或关税，取消派送。 无人接听或暂未派送 No Answer 无人接听时，将包裹带回仓库，重新 Inbound、Sort，再安排 OFD。 按当前站点操作口径，连续 5 次 OFD 均为 No Answer 时会触发客服流程。 Future Delivery 或 No Time for Deliver/Collect 包裹回仓后重新 Inbound、Sort，再安排 OFD。 这两种原因本身不设重派次数上限，包裹仍符合派送条件时，继续安排派送直至签收。 预约件的上下架参见 2-3，长期未签收的自动退运参见 2-5。 触发退运或改址转仓 触发 RTO 选择 Opened by receipent（收件人已开包）、Damaged（破损）或 Wrong Address → Out of Serviced Area（地址超出服务范围）后，进入 RTO 流程。 Wrong Address → Wrong City 进入改址转仓流程。 拿到正确地址并在系统里更新后，做 Load 并把包裹转到对应 Hub，由目的 Hub 重新 Inbound 后安排派送。 系统可查看司机选择的 Not Sign 原因。通常尽量少选 No Time for Deliver/Collect（No Time for Delivery），选更符合实际的具体原因，便于追溯。"},"operation":"Driver App","review":null,"keyCheck":{"en":"","zh":""},"aliases":["customer not answering","no answer","not signed","failed delivery","wrong city","拒签","无人接听","派送失败"]},{"id":"2-2/step-5","kind":"step","title":{"en":"Bring Undelivered Parcels Back","zh":"未签收包裹返仓"},"ordinal":"5","body":{"en":"\u003cp>When the delivery run ends, the driver returns undelivered parcels to the warehouse.\u003c/p>\n","zh":"\u003cp>司机完成本次任务后，将未成功签收的包裹送回仓库。\u003c/p>\n"},"summary":{"en":"When the delivery run ends, the driver returns undelivered parcels to the warehouse.","zh":"司机完成本次任务后，将未成功签收的包裹送回仓库。"},"notes":{"en":"","zh":""},"plain":{"en":"When the delivery run ends, the driver returns undelivered parcels to the warehouse.","zh":"司机完成本次任务后，将未成功签收的包裹送回仓库。"},"operation":null,"review":null,"keyCheck":{"en":"","zh":""},"aliases":["return to hub","failed parcels back to warehouse","司机退件"]},{"id":"2-2/step-6","kind":"step","title":{"en":"Scan Returned Parcels Back into Stock","zh":"返仓入库"},"ordinal":"6","body":{"en":"\u003cp>Warehouse staff scan the returned parcels using Inbound and hold them for the next Dispatch.\u003c/p>\n","zh":"\u003cp>仓库对退回的包裹重新操作 Inbound，等待后续 Dispatch。\u003c/p>\n"},"summary":{"en":"Warehouse staff scan the returned parcels using Inbound and hold them for the next Dispatch.","zh":"仓库对退回的包裹重新操作 Inbound，等待后续 Dispatch。"},"notes":{"en":"\u003col>\n\u003cli>Check for missing or damaged returns. Once damage or loss is confirmed, apply a driver deduction for the affected parcel amount. See section \u003ca href=\"#4-3\">4-3\u003c/a>.\u003c/li>\n\u003c/ol>\n","zh":"\u003col>\n\u003cli>核对返仓件是否齐全，检查是否损坏。确认有破损或遗失后，按对应包裹金额对司机扣罚，见 \u003ca href=\"#4-3\">4-3\u003c/a>。\u003c/li>\n\u003c/ol>\n"},"plain":{"en":"Warehouse staff scan the returned parcels using Inbound and hold them for the next Dispatch. Check for missing or damaged returns. Once damage or loss is confirmed, apply a driver deduction for the affected parcel amount. See section 4-3.","zh":"仓库对退回的包裹重新操作 Inbound，等待后续 Dispatch。 核对返仓件是否齐全，检查是否损坏。确认有破损或遗失后，按对应包裹金额对司机扣罚，见 4-3。"},"operation":"PDA","review":null,"keyCheck":{"en":"","zh":""},"aliases":[]},{"id":"2-2/delivery-follow-up-and-outcomes","kind":"topic","title":{"en":"Delivery Follow-up and Outcomes","zh":"派送跟进与签收注意事项"},"ordinal":"","body":{"en":"\u003cp>\u003cstrong>Delivery progress\u003c/strong>\u003c/p>\n\u003cp>Once drivers are out for delivery, the supervisor checks each driver's delivered parcel count, failed delivery count and reasons, and the number of parcels due back.\u003cbr />\nFollow up with drivers as needed, and drivers can contact the hub for help with any issues.\u003c/p>\n\u003cp>\u003cstrong>Driver app\u003c/strong>\u003c/p>\n\u003cp>Drivers need to install the driver app to view parcel details, accept tasks, record delivery outcomes, send OTPs and call customers directly from the app.\u003c/p>\n\u003cp>\u003ca href=\"https://s3.gfscdn.com/assets/inner-driver-app/apk/0.2.9/app-v29-gfs-release.apk\">Android（APK）\u003c/a> · \u003ca href=\"https://testflight.apple.com/join/fkibdDGf\">iOS（TestFlight）\u003c/a>\u003c/p>\n\u003cp>\u003cstrong>Timely returns\u003c/strong>\u003c/p>\n\u003cp>At the end of the delivery run, drivers should promptly bring back undelivered parcels, including parcels they could not deliver for reasons beyond their control, so the hub can plan the next delivery attempt.\u003c/p>\n","zh":"\u003cp>\u003cstrong>派送进度\u003c/strong>\u003c/p>\n\u003cp>司机出派后，主管在系统中按司机查看已签收件数、派送失败件数及原因，以及需要退回的件数。\u003cbr />\n根据情况主动联系司机跟进，司机遇到问题也可以联系站点寻求协助。\u003c/p>\n\u003cp>\u003cstrong>司机 App\u003c/strong>\u003c/p>\n\u003cp>司机需要安装司机 App，用于查看包裹信息、接收任务、更新派送结果、发送 OTP，以及在 App 内直接拨打顾客电话。\u003c/p>\n\u003cp>\u003ca href=\"https://s3.gfscdn.com/assets/inner-driver-app/apk/0.2.9/app-v29-gfs-release.apk\">Android（APK）\u003c/a> · \u003ca href=\"https://testflight.apple.com/join/fkibdDGf\">iOS（TestFlight）\u003c/a>\u003c/p>\n\u003cp>\u003cstrong>及时返仓\u003c/strong>\u003c/p>\n\u003cp>司机结束本次派送后，应及时将未签收或因客观原因未能完成派送的包裹带回仓库，以便站点安排下一次出派。\u003c/p>\n"},"summary":{"en":"Delivery progress","zh":"派送进度"},"notes":{"en":"","zh":""},"plain":{"en":"Delivery progress Once drivers are out for delivery, the supervisor checks each driver's delivered parcel count, failed delivery count and reasons, and the number of parcels due back. Follow up with drivers as needed, and drivers can contact the hub for help with any issues. Driver app Drivers need to install the driver app to view parcel details, accept tasks, record delivery outcomes, send OTPs and call customers directly from the app. Android（APK） · iOS（TestFlight） Timely returns At the end of the delivery run, drivers should promptly bring back undelivered parcels, including parcels they could not deliver for reasons beyond their control, so the hub can plan the next delivery attempt.","zh":"派送进度 司机出派后，主管在系统中按司机查看已签收件数、派送失败件数及原因，以及需要退回的件数。 根据情况主动联系司机跟进，司机遇到问题也可以联系站点寻求协助。 司机 App 司机需要安装司机 App，用于查看包裹信息、接收任务、更新派送结果、发送 OTP，以及在 App 内直接拨打顾客电话。 Android（APK） · iOS（TestFlight） 及时返仓 司机结束本次派送后，应及时将未签收或因客观原因未能完成派送的包裹带回仓库，以便站点安排下一次出派。"},"operation":null,"review":null,"keyCheck":{"en":"","zh":""},"aliases":[]}]},{"id":"2-3","title":{"en":"Storing and Picking Parcels (Move & Pick)","zh":"包裹上下架（Move & Pick）"},"part":"2","blocks":[{"id":"2-3","kind":"intro","title":{"en":"Storing and Picking Parcels (Move & Pick)","zh":"包裹上下架（Move & Pick）"},"ordinal":"","body":{"en":"","zh":""},"summary":{"en":"","zh":""},"notes":{"en":"","zh":""},"plain":{"en":"","zh":""},"operation":null,"review":null,"keyCheck":{"en":"","zh":""},"aliases":["put away","shelf storage","move to location","pick task","预约件"]},{"id":"2-3/when-this-applies","kind":"topic","title":{"en":"When This Applies","zh":"适用情况"},"ordinal":"","body":{"en":"\u003cp>In the following situations, follow the PDA's Move to Location prompt to place the parcel on a shelf or in a storage location.\u003c/p>\n\u003cul>\n\u003cli>The customer books a delivery date.\u003c/li>\n\u003cli>The customer books another delivery date after an unsuccessful delivery attempt.\u003c/li>\n\u003cli>The customer cannot be reached for now and further contact is needed.\u003c/li>\n\u003cli>An RTO parcel is waiting for linehaul transfer.\u003c/li>\n\u003c/ul>\n","zh":"\u003cp>通常在以下情况下，需要根据 PDA 提示将包裹 Move to Location，上架至货架或库位：\u003c/p>\n\u003cul>\n\u003cli>顾客主动预约派送日期。\u003c/li>\n\u003cli>司机派送失败后，顾客重新预约派送日期。\u003c/li>\n\u003cli>暂时联系不上顾客，需要等待进一步联系结果。\u003c/li>\n\u003cli>RTO 包裹等待干线转运。\u003c/li>\n\u003c/ul>\n"},"summary":{"en":"In the following situations, follow the PDA's Move to Location prompt to place the parcel on a shelf or in a storage location.","zh":"通常在以下情况下，需要根据 PDA 提示将包裹 Move to Location，上架至货架或库位："},"notes":{"en":"","zh":""},"plain":{"en":"In the following situations, follow the PDA's Move to Location prompt to place the parcel on a shelf or in a storage location. The customer books a delivery date. The customer books another delivery date after an unsuccessful delivery attempt. The customer cannot be reached for now and further contact is needed. An RTO parcel is waiting for linehaul transfer.","zh":"通常在以下情况下，需要根据 PDA 提示将包裹 Move to Location，上架至货架或库位： 顾客主动预约派送日期。 司机派送失败后，顾客重新预约派送日期。 暂时联系不上顾客，需要等待进一步联系结果。 RTO 包裹等待干线转运。"},"operation":null,"review":null,"keyCheck":{"en":"","zh":""},"aliases":[]},{"id":"2-3/step-1","kind":"step","title":{"en":"Store the Parcel as Directed","zh":"根据扫描提示上架"},"ordinal":"1","body":{"en":"\u003cp>Scan the parcel.\u003cbr />\nIf the PDA shows Move to Location, put the parcel on the indicated shelf or in the indicated storage location.\u003c/p>\n","zh":"\u003cp>扫描包裹。\u003cbr />\n如果 PDA 提示 Move to Location，将包裹上架至对应货架或库位。\u003c/p>\n"},"summary":{"en":"Scan the parcel.","zh":"扫描包裹。"},"notes":{"en":"\u003col>\n\u003cli>You can scan shelved parcels daily with \u003ccode>Sort Common\u003c/code> to check whether a delivery has been scheduled.\u003c/li>\n\u003c/ol>\n","zh":"\u003col>\n\u003cli>货架上的包裹可每天用 \u003ccode>Sort Common\u003c/code> 扫一遍，查看是否已有预约派送安排。\u003c/li>\n\u003c/ol>\n"},"plain":{"en":"Scan the parcel. If the PDA shows Move to Location, put the parcel on the indicated shelf or in the indicated storage location. You can scan shelved parcels daily with Sort Common to check whether a delivery has been scheduled.","zh":"扫描包裹。 如果 PDA 提示 Move to Location，将包裹上架至对应货架或库位。 货架上的包裹可每天用 Sort Common 扫一遍，查看是否已有预约派送安排。"},"operation":"PDA","review":null,"keyCheck":{"en":"","zh":""},"aliases":[]},{"id":"2-3/step-2","kind":"step","title":{"en":"Create a Pick Task When the Parcel Is Ready","zh":"根据包裹情况创建 Pick Task"},"ordinal":"2","body":{"en":"\u003cdiv class=\"table-scroll\" tabindex=\"0\" role=\"region\" aria-label=\"Table\">\u003ctable>\n\u003cthead>\n\u003ctr>\n  \u003cth>Parcel situation\u003c/th>\n  \u003cth>When to create a Pick Task\u003c/th>\n\u003c/tr>\n\u003c/thead>\n\u003ctbody>\n\u003ctr>\n  \u003ctd>Scheduled delivery\u003c/td>\n  \u003ctd>Create a Pick Task in the last-mile system on the scheduled delivery date.\u003c/td>\n\u003c/tr>\n\u003ctr>\n  \u003ctd>RTO awaiting transfer\u003c/td>\n  \u003ctd>Create a Pick Task in the last-mile system on the day the linehaul truck arrives.\u003c/td>\n\u003c/tr>\n\u003ctr>\n  \u003ctd>Customer cannot be reached for now\u003c/td>\n  \u003ctd>Keep the parcel on the shelf for now.\u003cbr>Once the customer gets in touch or Customer Service reaches them, create a Pick Task according to the confirmed arrangement.\u003c/td>\n\u003c/tr>\n\u003c/tbody>\n\u003c/table>\u003c/div>\n\u003col>\n\u003cli>Puppis → \u003ccode>Warehouse\u003c/code> → \u003ccode>Reservation Order-Hub\u003c/code>\u003c/li>\n\u003cli>Select the date and tick the tracking numbers that need a Pick Task.\u003c/li>\n\u003cli>Click \u003ccode>Pick\u003c/code>.\u003c/li>\n\u003c/ol>\n","zh":"\u003cdiv class=\"table-scroll\" tabindex=\"0\" role=\"region\" aria-label=\"Table\">\u003ctable>\n\u003cthead>\n\u003ctr>\n  \u003cth>包裹情况\u003c/th>\n  \u003cth>何时创建 Pick Task\u003c/th>\n\u003c/tr>\n\u003c/thead>\n\u003ctbody>\n\u003ctr>\n  \u003ctd>预约派送\u003c/td>\n  \u003ctd>在预约日期当天，于末派系统创建 Pick Task。\u003c/td>\n\u003c/tr>\n\u003ctr>\n  \u003ctd>RTO 等待转运\u003c/td>\n  \u003ctd>在干线到达当天，于末派系统创建 Pick Task。\u003c/td>\n\u003c/tr>\n\u003ctr>\n  \u003ctd>暂时联系不上顾客\u003c/td>\n  \u003ctd>先将包裹留在货架。\u003cbr>待顾客主动联系，或 CS 联系到顾客后，根据确认的处理安排创建 Pick Task。\u003c/td>\n\u003c/tr>\n\u003c/tbody>\n\u003c/table>\u003c/div>\n\u003col>\n\u003cli>Puppis → \u003ccode>Warehouse\u003c/code> → \u003ccode>Reservation Order-Hub\u003c/code>\u003c/li>\n\u003cli>选择日期，勾选需要创建 Pick Task 的运单号。\u003c/li>\n\u003cli>点击 \u003ccode>Pick\u003c/code>。\u003c/li>\n\u003c/ol>\n"},"summary":{"en":"| Parcel situation | When to create a Pick Task |","zh":"| 包裹情况 | 何时创建 Pick Task |"},"notes":{"en":"","zh":""},"plain":{"en":"Parcel situation When to create a Pick Task Scheduled delivery Create a Pick Task in the last-mile system on the scheduled delivery date. RTO awaiting transfer Create a Pick Task in the last-mile system on the day the linehaul truck arrives. Customer cannot be reached for now Keep the parcel on the shelf for now. Once the customer gets in touch or Customer Service reaches them, create a Pick Task according to the confirmed arrangement. Puppis → Warehouse → Reservation Order-Hub Select the date and tick the tracking numbers that need a Pick Task. Click Pick.","zh":"包裹情况 何时创建 Pick Task 预约派送 在预约日期当天，于末派系统创建 Pick Task。 RTO 等待转运 在干线到达当天，于末派系统创建 Pick Task。 暂时联系不上顾客 先将包裹留在货架。 待顾客主动联系，或 CS 联系到顾客后，根据确认的处理安排创建 Pick Task。 Puppis → Warehouse → Reservation Order-Hub 选择日期，勾选需要创建 Pick Task 的运单号。 点击 Pick。"},"operation":"Puppis","review":null,"keyCheck":{"en":"","zh":""},"aliases":[]},{"id":"2-3/step-3","kind":"step","title":{"en":"Pick the Parcel","zh":"执行下架任务"},"ordinal":"3","body":{"en":"\u003col>\n\u003cli>PDA → \u003ccode>Pick\u003c/code>\u003c/li>\n\u003cli>Select the package type. The hub usually uses \u003ccode>To Sign Package\u003c/code> or \u003ccode>RTO Package\u003c/code>.\u003c/li>\n\u003cli>Scan the parcel and take it off the shelf or out of its storage location.\u003c/li>\n\u003c/ol>\n","zh":"\u003col>\n\u003cli>PDA → \u003ccode>Pick\u003c/code>\u003c/li>\n\u003cli>选择对应类型。站点通常使用 \u003ccode>To Sign Package\u003c/code> 或 \u003ccode>RTO Package\u003c/code>。\u003c/li>\n\u003cli>扫描包裹，从对应货架或库位取下。\u003c/li>\n\u003c/ol>\n"},"summary":{"en":"PDA → Pick","zh":"PDA → Pick"},"notes":{"en":"","zh":""},"plain":{"en":"PDA → Pick Select the package type. The hub usually uses To Sign Package or RTO Package. Scan the parcel and take it off the shelf or out of its storage location.","zh":"PDA → Pick 选择对应类型。站点通常使用 To Sign Package 或 RTO Package。 扫描包裹，从对应货架或库位取下。"},"operation":"PDA","review":null,"keyCheck":{"en":"","zh":""},"aliases":[]},{"id":"2-3/step-4","kind":"step","title":{"en":"Rescan the Parcel and Follow the PDA","zh":"重新扫描并执行下一步"},"ordinal":"4","body":{"en":"\u003cp>PDA → \u003ccode>Sort Common\u003c/code>. Rescan the parcel and follow the prompt.\u003c/p>\n\u003cul>\n\u003cli>\u003cstrong>To Sign parcels.\u003c/strong> Scan with \u003ccode>Sort Delivery\u003c/code>, place in the correct zone and hold for dispatch.\u003c/li>\n\u003cli>\u003cstrong>RTO parcels.\u003c/strong> Scan with \u003ccode>Sort Load\u003c/code>, pack into boxes and hold for linehaul transfer to JHB.\u003c/li>\n\u003c/ul>\n","zh":"\u003cp>PDA → \u003ccode>Sort Common\u003c/code>，重新扫描下架包裹，按提示处理。\u003c/p>\n\u003cul>\n\u003cli>\u003cstrong>To Sign 包裹\u003c/strong>　用 \u003ccode>Sort Delivery\u003c/code> 扫描，放到对应 Zone，等待 Dispatch。\u003c/li>\n\u003cli>\u003cstrong>RTO 包裹\u003c/strong>　用 \u003ccode>Sort Load\u003c/code> 扫描，装箱打包，等待干线转运至 JHB。\u003c/li>\n\u003c/ul>\n"},"summary":{"en":"PDA → Sort Common. Rescan the parcel and follow the prompt.","zh":"PDA → Sort Common，重新扫描下架包裹，按提示处理。"},"notes":{"en":"","zh":""},"plain":{"en":"PDA → Sort Common. Rescan the parcel and follow the prompt. To Sign parcels. Scan with Sort Delivery, place in the correct zone and hold for dispatch. RTO parcels. Scan with Sort Load, pack into boxes and hold for linehaul transfer to JHB.","zh":"PDA → Sort Common，重新扫描下架包裹，按提示处理。 To Sign 包裹 用 Sort Delivery 扫描，放到对应 Zone，等待 Dispatch。 RTO 包裹 用 Sort Load 扫描，装箱打包，等待干线转运至 JHB。"},"operation":"PDA","review":null,"keyCheck":{"en":"","zh":""},"aliases":[]},{"id":"2-3/notes","kind":"topic","title":{"en":"Notes","zh":"注意事项"},"ordinal":"","body":{"en":"\u003cul>\n\u003cli>After completing Pick, follow the scan instructions and perform any required Dispatch or Load separately.\u003c/li>\n\u003cli>Schedule Pick Tasks according to the timing for each case: scheduled delivery, RTO or pending customer contact.\u003c/li>\n\u003c/ul>\n","zh":"\u003cul>\n\u003cli>Pick 完成后仍需继续按扫描指引处理；下架不等于已经完成 Dispatch 或 Load。\u003c/li>\n\u003cli>预约派送、RTO 和等待客户联系的包裹，创建 Pick Task 的时点不同，应分别安排。\u003c/li>\n\u003c/ul>\n"},"summary":{"en":"After completing Pick, follow the scan instructions and perform any required Dispatch or Load separately.","zh":"Pick 完成后仍需继续按扫描指引处理；下架不等于已经完成 Dispatch 或 Load。"},"notes":{"en":"","zh":""},"plain":{"en":"After completing Pick, follow the scan instructions and perform any required Dispatch or Load separately. Schedule Pick Tasks according to the timing for each case: scheduled delivery, RTO or pending customer contact.","zh":"Pick 完成后仍需继续按扫描指引处理；下架不等于已经完成 Dispatch 或 Load。 预约派送、RTO 和等待客户联系的包裹，创建 Pick Task 的时点不同，应分别安排。"},"operation":null,"review":null,"keyCheck":{"en":"","zh":""},"aliases":[]}]},{"id":"2-4","title":{"en":"Transfers Between Hubs (Load)","zh":"跨站转运（Load）"},"part":"2","blocks":[{"id":"2-4","kind":"intro","title":{"en":"Transfers Between Hubs (Load)","zh":"跨站转运（Load）"},"ordinal":"","body":{"en":"","zh":""},"summary":{"en":"","zh":""},"notes":{"en":"","zh":""},"plain":{"en":"","zh":""},"operation":null,"review":null,"keyCheck":{"en":"","zh":""},"aliases":["wrong hub","misroute","cross hub","interhub transfer","串线","错站"]},{"id":"2-4/when-this-applies","kind":"topic","title":{"en":"When This Applies","zh":"适用情况"},"ordinal":"","body":{"en":"\u003cp>When a parcel is transferred between hubs, complete the Load scan.\u003cbr />\nA missed scan may generate a \u003ccode>LOAD_EXCEPTION\u003c/code> entry in the tracking log.\u003c/p>\n\u003cp>Common situations include the following.\u003c/p>\n\u003cul>\n\u003cli>\u003cstrong>Wrong destination from the sorting centre.\u003c/strong> A parcel for Pretoria may be sent from the JHB sorting centre to Bloemfontein and must then be transferred to the correct hub.\u003c/li>\n\u003cli>\u003cstrong>Transfer after an address change.\u003c/strong> The actual delivery address is outside the current hub's service area.\u003cbr />\nThis may be identified before the parcel goes out for delivery or confirmed by the customer during the delivery run.\u003c/li>\n\u003cli>\u003cstrong>RTO to Johannesburg.\u003c/strong> Arrange linehaul transfer for RTO parcels that need to go back to JHB.\u003c/li>\n\u003c/ul>\n","zh":"\u003cp>包裹从一个站点转运到另一个站点时，需要完成 Load 扫描。\u003cbr />\n漏扫可能产生 \u003ccode>LOAD_EXCEPTION\u003c/code> 日志。\u003c/p>\n\u003cp>常见场景包括：\u003c/p>\n\u003cul>\n\u003cli>\u003cstrong>分拨错发：\u003c/strong>例如，约堡分拨仓将应发往 Pretoria 的包裹发到了 Bloemfontein，需要转运至正确站点。\u003c/li>\n\u003cli>\u003cstrong>地址变更后需要转仓：\u003c/strong>包裹实际配送地址不在当前站点覆盖范围。\u003cbr />\n可能在出派前发现，也可能在派送过程中经顾客确认。\u003c/li>\n\u003cli>\u003cstrong>RTO 退回约堡：\u003c/strong>将需要退回 JHB 的 RTO 包裹安排干线转运。\u003c/li>\n\u003c/ul>\n"},"summary":{"en":"When a parcel is transferred between hubs, complete the Load scan.","zh":"包裹从一个站点转运到另一个站点时，需要完成 Load 扫描。"},"notes":{"en":"","zh":""},"plain":{"en":"When a parcel is transferred between hubs, complete the Load scan. A missed scan may generate a LOAD_EXCEPTION entry in the tracking log. Common situations include the following. Wrong destination from the sorting centre. A parcel for Pretoria may be sent from the JHB sorting centre to Bloemfontein and must then be transferred to the correct hub. Transfer after an address change. The actual delivery address is outside the current hub's service area. This may be identified before the parcel goes out for delivery or confirmed by the customer during the delivery run. RTO to Johannesburg. Arrange linehaul transfer for RTO parcels that need to go back to JHB.","zh":"包裹从一个站点转运到另一个站点时，需要完成 Load 扫描。 漏扫可能产生 LOAD_EXCEPTION 日志。 常见场景包括： 分拨错发：例如，约堡分拨仓将应发往 Pretoria 的包裹发到了 Bloemfontein，需要转运至正确站点。 地址变更后需要转仓：包裹实际配送地址不在当前站点覆盖范围。 可能在出派前发现，也可能在派送过程中经顾客确认。 RTO 退回约堡：将需要退回 JHB 的 RTO 包裹安排干线转运。"},"operation":null,"review":null,"keyCheck":{"en":"","zh":""},"aliases":[]},{"id":"2-4/step-1","kind":"step","title":{"en":"Verify the Destination and Address","zh":"确认流向并处理地址"},"ordinal":"1","body":{"en":"\u003cp>Have an authorised person update the address if it is incorrect or has changed.\u003c/p>\n\u003cp>PDA → \u003ccode>Sort Common\u003c/code>. Scan the parcel and check the destination hub.\u003c/p>\n","zh":"\u003cp>地址错误或变更时，先由有权限的人员更新地址。\u003c/p>\n\u003cp>PDA → \u003ccode>Sort Common\u003c/code>，扫描包裹，确认目的 Hub。\u003c/p>\n"},"summary":{"en":"Have an authorised person update the address if it is incorrect or has changed.","zh":"地址错误或变更时，先由有权限的人员更新地址。"},"notes":{"en":"","zh":""},"plain":{"en":"Have an authorised person update the address if it is incorrect or has changed. PDA → Sort Common. Scan the parcel and check the destination hub.","zh":"地址错误或变更时，先由有权限的人员更新地址。 PDA → Sort Common，扫描包裹，确认目的 Hub。"},"operation":"Puppis / PDA","review":null,"keyCheck":{"en":"","zh":""},"aliases":[]},{"id":"2-4/step-2","kind":"step","title":{"en":"Complete the Load Scan","zh":"完成 Load 扫描"},"ordinal":"2","body":{"en":"\u003cp>PDA → \u003ccode>Sort Load\u003c/code> or \u003ccode>Quick Tpl-load\u003c/code>. Both options perform the same Load scan.\u003c/p>\n\u003cp>Pack and seal the boxes after scanning. Load them when the truck arrives and take a photo. See the next two steps.\u003c/p>\n","zh":"\u003cp>PDA → \u003ccode>Sort Load\u003c/code> 或 \u003ccode>Quick Tpl-load\u003c/code>，两个入口都可完成同样的 Load 扫描。\u003c/p>\n\u003cp>扫描后装箱打包，等干线到车后装车拍照。装箱和交接见后两步。\u003c/p>\n"},"summary":{"en":"PDA → Sort Load or Quick Tpl-load. Both options perform the same Load scan.","zh":"PDA → Sort Load 或 Quick Tpl-load，两个入口都可完成同样的 Load 扫描。"},"notes":{"en":"","zh":""},"plain":{"en":"PDA → Sort Load or Quick Tpl-load. Both options perform the same Load scan. Pack and seal the boxes after scanning. Load them when the truck arrives and take a photo. See the next two steps.","zh":"PDA → Sort Load 或 Quick Tpl-load，两个入口都可完成同样的 Load 扫描。 扫描后装箱打包，等干线到车后装车拍照。装箱和交接见后两步。"},"operation":"PDA","review":null,"keyCheck":{"en":"","zh":""},"aliases":[]},{"id":"2-4/step-3","kind":"step","title":{"en":"Pack Parcels by Destination and Type","zh":"分类装箱"},"ordinal":"3","body":{"en":"\u003cp>After scanning, pack parcels into boxes by destination hub and parcel type.\u003cbr />\nPack RTO parcels for JHB together and hold them for the linehaul truck.\u003c/p>\n","zh":"\u003cp>扫描完成后，按目的站点及包裹类型分类装箱。\u003cbr />\n退回 JHB 的 RTO 包裹集中打包，等待干线车辆。\u003c/p>\n"},"summary":{"en":"After scanning, pack parcels into boxes by destination hub and parcel type.","zh":"扫描完成后，按目的站点及包裹类型分类装箱。"},"notes":{"en":"","zh":""},"plain":{"en":"After scanning, pack parcels into boxes by destination hub and parcel type. Pack RTO parcels for JHB together and hold them for the linehaul truck.","zh":"扫描完成后，按目的站点及包裹类型分类装箱。 退回 JHB 的 RTO 包裹集中打包，等待干线车辆。"},"operation":null,"review":null,"keyCheck":{"en":"","zh":""},"aliases":[]},{"id":"2-4/step-4","kind":"step","title":{"en":"Hand Over the Boxes and Record the Transfer","zh":"干线交接与记录"},"ordinal":"4","body":{"en":"\u003cp>When the truck arrives, hand the boxes to the linehaul driver for loading, take a photo and record the handover.\u003c/p>\n","zh":"\u003cp>干线到车后，将对应箱子交给干线司机装车，拍照并记录交接。\u003c/p>\n"},"summary":{"en":"When the truck arrives, hand the boxes to the linehaul driver for loading, take a photo and record the handover.","zh":"干线到车后，将对应箱子交给干线司机装车，拍照并记录交接。"},"notes":{"en":"","zh":""},"plain":{"en":"When the truck arrives, hand the boxes to the linehaul driver for loading, take a photo and record the handover.","zh":"干线到车后，将对应箱子交给干线司机装车，拍照并记录交接。"},"operation":null,"review":null,"keyCheck":{"en":"","zh":""},"aliases":[]},{"id":"2-4/notes","kind":"topic","title":{"en":"Notes","zh":"注意事项"},"ordinal":"","body":{"en":"\u003cul>\n\u003cli>Complete both the Load scan and the physical handover to the linehaul driver.\u003c/li>\n\u003cli>For a transfer after an address change, update the address first, rescan using Sort Common, then follow the instructions for Load.\u003c/li>\n\u003c/ul>\n","zh":"\u003cul>\n\u003cli>Load 扫描与实物交给干线车是两个动作，两者都需要完成。\u003c/li>\n\u003cli>改址转仓件应先修改地址、重新 Sort Common，再按指引操作 Load。\u003c/li>\n\u003c/ul>\n"},"summary":{"en":"Complete both the Load scan and the physical handover to the linehaul driver.","zh":"Load 扫描与实物交给干线车是两个动作，两者都需要完成。"},"notes":{"en":"","zh":""},"plain":{"en":"Complete both the Load scan and the physical handover to the linehaul driver. For a transfer after an address change, update the address first, rescan using Sort Common, then follow the instructions for Load.","zh":"Load 扫描与实物交给干线车是两个动作，两者都需要完成。 改址转仓件应先修改地址、重新 Sort Common，再按指引操作 Load。"},"operation":null,"review":null,"keyCheck":{"en":"","zh":""},"aliases":[]}]},{"id":"2-5","title":{"en":"RTO and Reversing an RTO","zh":"RTO 与 RTO 回滚"},"part":"2","blocks":[{"id":"2-5","kind":"intro","title":{"en":"RTO and Reversing an RTO","zh":"RTO 与 RTO 回滚"},"ordinal":"","body":{"en":"","zh":""},"summary":{"en":"","zh":""},"notes":{"en":"","zh":""},"plain":{"en":"","zh":""},"operation":null,"review":null,"keyCheck":{"en":"","zh":""},"aliases":["return to origin","return to shipper","退回货主","自动退运"]},{"id":"2-5/starting-an-rto","kind":"topic","title":{"en":"Starting an RTO","zh":"发起 RTO"},"ordinal":"","body":{"en":"\u003cp>Under the current hub guidance, the system automatically starts RTO after 21 days without a successful delivery.\u003cbr />\nThe event that starts the 21-day count and the parcel types covered still need to be checked against actual shipments.\u003c/p>\n","zh":"\u003cp>按当前站点口径，包裹持续未派送成功达 21 天时，系统会自动发起 RTO。\u003cbr />\n21 天从哪个节点起算、适用哪些包裹，待用实际运单核对。\u003c/p>\n"},"summary":{"en":"Under the current hub guidance, the system automatically starts RTO after 21 days without a successful delivery.","zh":"按当前站点口径，包裹持续未派送成功达 21 天时，系统会自动发起 RTO。"},"notes":{"en":"","zh":""},"plain":{"en":"Under the current hub guidance, the system automatically starts RTO after 21 days without a successful delivery. The event that starts the 21-day count and the parcel types covered still need to be checked against actual shipments.","zh":"按当前站点口径，包裹持续未派送成功达 21 天时，系统会自动发起 RTO。 21 天从哪个节点起算、适用哪些包裹，待用实际运单核对。"},"operation":null,"review":null,"keyCheck":{"en":"","zh":""},"aliases":[]},{"id":"2-5/reverse-rto","kind":"topic","title":{"en":"Reversing an RTO when the customer requests delivery","zh":"顾客重新要求派送时回滚 RTO"},"ordinal":"","body":{"en":"\u003col>\n\u003cli>If the customer asks for delivery while the parcel is waiting for RTO, share the tracking number in the relevant hub's WeCom group and arrange the reversal.\u003c/li>\n\u003cli>Once the RTO reversal is confirmed, sort the parcel again within 30 minutes under the current operating guidance, then follow the system prompt to arrange delivery.\u003c/li>\n\u003cli>If the parcel is not sorted again promptly after reversal, the system may start RTO again.\u003c/li>\n\u003c/ol>\n","zh":"\u003col>\n\u003cli>包裹在等待 RTO 期间，如顾客主动联系并要求继续派送，在所属 Hub 的 WeCom 群提供运单号并沟通回滚。\u003c/li>\n\u003cli>确认 RTO 回滚完成后，按当前操作要求在 30 分钟内重新 Sorting，并按照系统提示安排后续派送。\u003c/li>\n\u003cli>回滚后若未及时重新 Sorting，系统可能重新发起 RTO。\u003c/li>\n\u003c/ol>\n"},"summary":{"en":"If the customer asks for delivery while the parcel is waiting for RTO, share the tracking number in the relevant hub's WeCom group and arrange the reversal.","zh":"包裹在等待 RTO 期间，如顾客主动联系并要求继续派送，在所属 Hub 的 WeCom 群提供运单号并沟通回滚。"},"notes":{"en":"","zh":""},"plain":{"en":"If the customer asks for delivery while the parcel is waiting for RTO, share the tracking number in the relevant hub's WeCom group and arrange the reversal. Once the RTO reversal is confirmed, sort the parcel again within 30 minutes under the current operating guidance, then follow the system prompt to arrange delivery. If the parcel is not sorted again promptly after reversal, the system may start RTO again.","zh":"包裹在等待 RTO 期间，如顾客主动联系并要求继续派送，在所属 Hub 的 WeCom 群提供运单号并沟通回滚。 确认 RTO 回滚完成后，按当前操作要求在 30 分钟内重新 Sorting，并按照系统提示安排后续派送。 回滚后若未及时重新 Sorting，系统可能重新发起 RTO。"},"operation":"WeCom / PDA","review":{"en":"Within 30 minutes is the current operating guidance. The exact system retrigger time is pending verification.","zh":"30 分钟内重新分拣是当前操作要求，系统再次触发 RTO 的实际时点待核对。"},"keyCheck":{"en":"","zh":""},"aliases":["undo rto","rto rollback","rto reversal","取消退运","撤销 RTO"]}]},{"id":"3-1","title":{"en":"Full Warehouse Stock Count","zh":"全库盘点"},"part":"3","blocks":[{"id":"3-1","kind":"intro","title":{"en":"Full Warehouse Stock Count","zh":"全库盘点"},"ordinal":"","body":{"en":"","zh":""},"summary":{"en":"","zh":""},"notes":{"en":"","zh":""},"plain":{"en":"","zh":""},"operation":null,"review":null,"keyCheck":{"en":"","zh":""},"aliases":["stocktake","stock take","inventory count","inventory audit","扫盘点"]},{"id":"3-1/preparation","kind":"topic","title":{"en":"Preparation. Create the Area and Print Its Barcode","zh":"前期准备：新增区域与条码"},"ordinal":"","body":{"en":"\u003col>\n\u003cli>Puppis → \u003ccode>Warehouse\u003c/code> → \u003ccode>Stock\u003c/code>\u003c/li>\n\u003cli>Click \u003ccode>Add\u003c/code> to create a count area, such as a zone, RTO area or shelf.\u003c/li>\n\u003cli>Click \u003ccode>Print\u003c/code> and place the barcode at the corresponding area for scanning.\u003c/li>\n\u003c/ol>\n","zh":"\u003col>\n\u003cli>Puppis → \u003ccode>Warehouse\u003c/code> → \u003ccode>Stock\u003c/code>\u003c/li>\n\u003cli>点击 \u003ccode>Add\u003c/code> 新增盘点区域，例如 Zone、RTO 区或货架。\u003c/li>\n\u003cli>点击 \u003ccode>Print\u003c/code> 打印区域条码，贴在对应位置供盘点扫描。\u003c/li>\n\u003c/ol>\n"},"summary":{"en":"Puppis → Warehouse → Stock","zh":"Puppis → Warehouse → Stock"},"notes":{"en":"","zh":""},"plain":{"en":"Puppis → Warehouse → Stock Click Add to create a count area, such as a zone, RTO area or shelf. Click Print and place the barcode at the corresponding area for scanning.","zh":"Puppis → Warehouse → Stock 点击 Add 新增盘点区域，例如 Zone、RTO 区或货架。 点击 Print 打印区域条码，贴在对应位置供盘点扫描。"},"operation":"Puppis","review":null,"keyCheck":{"en":"","zh":""},"aliases":[]},{"id":"3-1/step-1","kind":"step","title":{"en":"Create the Stock Count Plan","zh":"创建盘点计划"},"ordinal":"1","body":{"en":"\u003cp>The system automatically creates a stock count plan every Monday.\u003c/p>\n\u003cp>To create a plan manually\u003c/p>\n\u003col>\n\u003cli>Puppis → \u003ccode>Warehouse\u003c/code> → \u003ccode>Stock Count Plan\u003c/code> → \u003ccode>Create\u003c/code>\u003c/li>\n\u003cli>Choose a full or partial count. For a partial count, select the areas to include.\u003c/li>\n\u003c/ol>\n","zh":"\u003cp>系统每周一自动创建一个盘点计划。\u003c/p>\n\u003cp>如需手动创建\u003c/p>\n\u003col>\n\u003cli>Puppis → \u003ccode>Warehouse\u003c/code> → \u003ccode>Stock Count Plan\u003c/code> → \u003ccode>Create\u003c/code>\u003c/li>\n\u003cli>选择全库盘点或部分盘点。部分盘点时，指定要盘点的区域。\u003c/li>\n\u003c/ol>\n"},"summary":{"en":"The system automatically creates a stock count plan every Monday.","zh":"系统每周一自动创建一个盘点计划。"},"notes":{"en":"","zh":""},"plain":{"en":"The system automatically creates a stock count plan every Monday. To create a plan manually Puppis → Warehouse → Stock Count Plan → Create Choose a full or partial count. For a partial count, select the areas to include.","zh":"系统每周一自动创建一个盘点计划。 如需手动创建 Puppis → Warehouse → Stock Count Plan → Create 选择全库盘点或部分盘点。部分盘点时，指定要盘点的区域。"},"operation":"Puppis","review":null,"keyCheck":{"en":"","zh":""},"aliases":[]},{"id":"3-1/step-2","kind":"step","title":{"en":"Select the Plan and Scan the Area","zh":"选择计划并扫描区域"},"ordinal":"2","body":{"en":"\u003col>\n\u003cli>PDA → \u003ccode>Stock Count\u003c/code>\u003c/li>\n\u003cli>Start the count using the plan's \u003ccode>Count ID\u003c/code>.\u003c/li>\n\u003cli>Tap \u003ccode>Count\u003c/code> for the area and scan its barcode.\u003c/li>\n\u003cli>Scan each parcel in the area.\u003c/li>\n\u003c/ol>\n","zh":"\u003col>\n\u003cli>PDA → \u003ccode>Stock Count\u003c/code>\u003c/li>\n\u003cli>按本次盘点计划的 \u003ccode>Count ID\u003c/code> 点击开始盘点。\u003c/li>\n\u003cli>点击对应区域的 \u003ccode>Count\u003c/code>，扫描该区域条码。\u003c/li>\n\u003cli>逐票扫描该区域的包裹。\u003c/li>\n\u003c/ol>\n"},"summary":{"en":"PDA → Stock Count","zh":"PDA → Stock Count"},"notes":{"en":"\u003col>\n\u003cli>Everyone working on the same count uses the same \u003ccode>Count ID\u003c/code>.\u003c/li>\n\u003c/ol>\n","zh":"\u003col>\n\u003cli>同一次盘点的参与人员使用同一个 \u003ccode>Count ID\u003c/code>。\u003c/li>\n\u003c/ol>\n"},"plain":{"en":"PDA → Stock Count Start the count using the plan's Count ID. Tap Count for the area and scan its barcode. Scan each parcel in the area. Everyone working on the same count uses the same Count ID.","zh":"PDA → Stock Count 按本次盘点计划的 Count ID 点击开始盘点。 点击对应区域的 Count，扫描该区域条码。 逐票扫描该区域的包裹。 同一次盘点的参与人员使用同一个 Count ID。"},"operation":"PDA","review":null,"keyCheck":{"en":"","zh":""},"aliases":[]},{"id":"3-1/step-3","kind":"step","title":{"en":"Finish One Area Before Moving to the Next","zh":"完成一个区域后再进入下一区域"},"ordinal":"3","body":{"en":"\u003cp>Scan all parcels in the current area and confirm the area count on the PDA before moving to the next area.\u003c/p>\n","zh":"\u003cp>将当前区域的包裹全部扫描完毕，在 PDA 确认该区域盘点完成后，再进行下一个区域。\u003c/p>\n"},"summary":{"en":"Scan all parcels in the current area and confirm the area count on the PDA before moving to the next area.","zh":"将当前区域的包裹全部扫描完毕，在 PDA 确认该区域盘点完成后，再进行下一个区域。"},"notes":{"en":"\u003col>\n\u003cli>People can count different areas at the same time. Assign only one person to each area at a time.\u003c/li>\n\u003cli>If a scan shows \u003ccode>Extra\u003c/code>, take the parcel out of the area and set it aside with other extra parcels for review.\u003c/li>\n\u003c/ol>\n","zh":"\u003col>\n\u003cli>可以多人同时盘点不同区域，但每个区域同一时间只能由一人负责盘点。\u003c/li>\n\u003cli>扫描显示 \u003ccode>Extra\u003c/code> 时，将包裹取出并集中放置，等待核查和处理。\u003c/li>\n\u003c/ol>\n"},"plain":{"en":"Scan all parcels in the current area and confirm the area count on the PDA before moving to the next area. People can count different areas at the same time. Assign only one person to each area at a time. If a scan shows Extra, take the parcel out of the area and set it aside with other extra parcels for review.","zh":"将当前区域的包裹全部扫描完毕，在 PDA 确认该区域盘点完成后，再进行下一个区域。 可以多人同时盘点不同区域，但每个区域同一时间只能由一人负责盘点。 扫描显示 Extra 时，将包裹取出并集中放置，等待核查和处理。"},"operation":"PDA","review":null,"keyCheck":{"en":"","zh":""},"aliases":[]},{"id":"3-1/step-4","kind":"step","title":{"en":"Confirm the Stock Count and Handle Exception Tickets","zh":"确认盘点并处理异常工单"},"ordinal":"4","body":{"en":"\u003col>\n\u003cli>Once all areas are scanned and confirmed on the PDA, confirm the plan in Puppis and review the count details.\u003c/li>\n\u003cli>Puppis → \u003ccode>Work Order System\u003c/code> → \u003ccode>Package Exception Task (Dispatch)\u003c/code>\u003c/li>\n\u003cli>In \u003ccode>WorkOrderBizType\u003c/code>, select \u003ccode>Stock Count Missing\u003c/code> or \u003ccode>Stock Count Extra\u003c/code>. Review the \u003ccode>Processing\u003c/code> tickets, check the parcels and handle each case.\u003c/li>\n\u003c/ol>\n","zh":"\u003col>\n\u003cli>各区域完成扫描和 PDA 确认后，在 Puppis 确认本次盘点计划并查看明细。\u003c/li>\n\u003cli>Puppis → \u003ccode>Work Order System\u003c/code> → \u003ccode>Package Exception Task (Dispatch)\u003c/code>\u003c/li>\n\u003cli>在 \u003ccode>WorkOrderBizType\u003c/code> 选择 \u003ccode>Stock Count Missing\u003c/code> 或 \u003ccode>Stock Count Extra\u003c/code>，查看 \u003ccode>Processing\u003c/code> 工单，核对包裹并逐单处理。\u003c/li>\n\u003c/ol>\n"},"summary":{"en":"Once all areas are scanned and confirmed on the PDA, confirm the plan in Puppis and review the count details.","zh":"各区域完成扫描和 PDA 确认后，在 Puppis 确认本次盘点计划并查看明细。"},"notes":{"en":"","zh":""},"plain":{"en":"Once all areas are scanned and confirmed on the PDA, confirm the plan in Puppis and review the count details. Puppis → Work Order System → Package Exception Task (Dispatch) In WorkOrderBizType, select Stock Count Missing or Stock Count Extra. Review the Processing tickets, check the parcels and handle each case.","zh":"各区域完成扫描和 PDA 确认后，在 Puppis 确认本次盘点计划并查看明细。 Puppis → Work Order System → Package Exception Task (Dispatch) 在 WorkOrderBizType 选择 Stock Count Missing 或 Stock Count Extra，查看 Processing 工单，核对包裹并逐单处理。"},"operation":"Puppis","review":null,"keyCheck":{"en":"","zh":""},"aliases":["stock count missing","stock count extra","stocktake discrepancy","盘盈","盘亏"]},{"id":"3-1/notes","kind":"topic","title":{"en":"Notes","zh":"注意事项"},"ordinal":"","body":{"en":"\u003cul>\n\u003cli>After scanning, complete the confirmation steps on both the PDA and the last-mile system.\u003c/li>\n\u003cli>Investigate Missing and Extra discrepancies using physical checks and tracking history before concluding that a parcel was lost or falsely marked as delivered.\u003c/li>\n\u003cli>Detailed steps for investigating and resolving stock count exceptions will be added later.\u003c/li>\n\u003c/ul>\n","zh":"\u003cul>\n\u003cli>扫描完成后，还需要完成 PDA 和末派系统中的确认动作。\u003c/li>\n\u003cli>Missing 和 Extra 属于待核查差异，需结合实物及轨迹调查，不能直接等同于丢件或虚假签收。\u003c/li>\n\u003cli>盘点异常工单的具体调查和处理步骤，后续继续细化。\u003c/li>\n\u003c/ul>\n"},"summary":{"en":"After scanning, complete the confirmation steps on both the PDA and the last-mile system.","zh":"扫描完成后，还需要完成 PDA 和末派系统中的确认动作。"},"notes":{"en":"","zh":""},"plain":{"en":"After scanning, complete the confirmation steps on both the PDA and the last-mile system. Investigate Missing and Extra discrepancies using physical checks and tracking history before concluding that a parcel was lost or falsely marked as delivered. Detailed steps for investigating and resolving stock count exceptions will be added later.","zh":"扫描完成后，还需要完成 PDA 和末派系统中的确认动作。 Missing 和 Extra 属于待核查差异，需结合实物及轨迹调查，不能直接等同于丢件或虚假签收。 盘点异常工单的具体调查和处理步骤，后续继续细化。"},"operation":null,"review":null,"keyCheck":{"en":"","zh":""},"aliases":[]}]},{"id":"3-2","title":{"en":"Handling Customer Complaints","zh":"客诉处理"},"part":"3","blocks":[{"id":"3-2","kind":"intro","title":{"en":"Handling Customer Complaints","zh":"客诉处理"},"ordinal":"","body":{"en":"","zh":""},"summary":{"en":"","zh":""},"notes":{"en":"","zh":""},"plain":{"en":"","zh":""},"operation":null,"review":null,"keyCheck":{"en":"","zh":""},"aliases":["sbnr","sign but not receive","signed but not received","delivered not received","签收未收到"]},{"id":"3-2/priority-complaints","kind":"topic","title":{"en":"Priority Complaints","zh":"重点关注的客诉"},"ordinal":"","body":{"en":"\u003cp>The current priority is Signed but Not Received (SBNR) complaints, where the system shows the parcel as delivered but the customer says it did not arrive.\u003cbr />\nVerify whether the customer actually received the parcel, as these cases may lead to penalties from the shipper.\u003c/p>\n","zh":"\u003cp>当前重点跟进 Sign but Not Received（SBNR）客诉，即系统显示已签收，但顾客反馈未收到包裹。\u003cbr />\n这类问题需要核实真实收货情况，并涉及货主罚款风险。\u003c/p>\n"},"summary":{"en":"The current priority is Signed but Not Received (SBNR) complaints, where the system shows the parcel as delivered but the customer says it did not arrive.","zh":"当前重点跟进 Sign but Not Received（SBNR）客诉，即系统显示已签收，但顾客反馈未收到包裹。"},"notes":{"en":"","zh":""},"plain":{"en":"The current priority is Signed but Not Received (SBNR) complaints, where the system shows the parcel as delivered but the customer says it did not arrive. Verify whether the customer actually received the parcel, as these cases may lead to penalties from the shipper.","zh":"当前重点跟进 Sign but Not Received（SBNR）客诉，即系统显示已签收，但顾客反馈未收到包裹。 这类问题需要核实真实收货情况，并涉及货主罚款风险。"},"operation":null,"review":null,"keyCheck":{"en":"","zh":""},"aliases":[]},{"id":"3-2/step-1","kind":"step","title":{"en":"Verify the Tracking Number","zh":"核对客诉单号"},"ordinal":"1","body":{"en":"\u003col>\n\u003cli>Puppis → \u003ccode>Work Order System\u003c/code> → \u003ccode>Complaint Task\u003c/code>\u003c/li>\n\u003cli>Select \u003ccode>Sign but not receive (ZA)\u003c/code> in \u003ccode>Category\u003c/code>.\u003c/li>\n\u003cli>Review cases in \u003ccode>Processing\u003c/code> and use the GE tracking number to identify the parcel to investigate.\u003c/li>\n\u003c/ol>\n","zh":"\u003col>\n\u003cli>Puppis → \u003ccode>Work Order System\u003c/code> → \u003ccode>Complaint Task\u003c/code>\u003c/li>\n\u003cli>在 \u003ccode>Category\u003c/code> 选择 \u003ccode>Sign but not receive (ZA)\u003c/code>。\u003c/li>\n\u003cli>查看状态为 \u003ccode>Processing\u003c/code> 的工单，用 GE 运单号核对要调查的包裹。\u003c/li>\n\u003c/ol>\n"},"summary":{"en":"Puppis → Work Order System → Complaint Task","zh":"Puppis → Work Order System → Complaint Task"},"notes":{"en":"","zh":""},"plain":{"en":"Puppis → Work Order System → Complaint Task Select Sign but not receive (ZA) in Category. Review cases in Processing and use the GE tracking number to identify the parcel to investigate.","zh":"Puppis → Work Order System → Complaint Task 在 Category 选择 Sign but not receive (ZA)。 查看状态为 Processing 的工单，用 GE 运单号核对要调查的包裹。"},"operation":"Puppis","review":null,"keyCheck":{"en":"","zh":""},"aliases":[]},{"id":"3-2/step-2","kind":"step","title":{"en":"Contact the Customer to Verify Receipt","zh":"联系顾客核实是否收到"},"ordinal":"2","body":{"en":"\u003cp>Use the customer's contact details in the system or ask the delivery driver for them if needed.\u003cbr />\nContact the customer to verify whether they received the parcel and record the outcome.\u003c/p>\n","zh":"\u003cp>从系统获取顾客联系方式，必要时向派送司机询问。\u003cbr />\n联系顾客，核实是否实际收到该包裹，并记录结果。\u003c/p>\n"},"summary":{"en":"Use the customer's contact details in the system or ask the delivery driver for them if needed.","zh":"从系统获取顾客联系方式，必要时向派送司机询问。"},"notes":{"en":"","zh":""},"plain":{"en":"Use the customer's contact details in the system or ask the delivery driver for them if needed. Contact the customer to verify whether they received the parcel and record the outcome.","zh":"从系统获取顾客联系方式，必要时向派送司机询问。 联系顾客，核实是否实际收到该包裹，并记录结果。"},"operation":null,"review":null,"keyCheck":{"en":"","zh":""},"aliases":[]},{"id":"3-2/step-3","kind":"step","title":{"en":"Obtain Valid Proof of Delivery (POD)","zh":"取得有效 POD"},"ordinal":"3","body":{"en":"\u003cp>If the customer confirms receipt, obtain valid proof of delivery for that tracking number.\u003c/p>\n\u003cp>A WhatsApp chat screenshot should show both of the following.\u003c/p>\n\u003cul>\n\u003cli>The matching GE tracking number.\u003c/li>\n\u003cli>A reply from the customer clearly confirming they received the parcel.\u003c/li>\n\u003c/ul>\n","zh":"\u003cp>对于顾客确认已收到的包裹，取得与该运单对应的有效收货凭证。\u003c/p>\n\u003cp>例如，WhatsApp 聊天截图中应同时出现：\u003c/p>\n\u003cul>\n\u003cli>对应的 GE 运单号。\u003c/li>\n\u003cli>顾客明确确认已收到包裹的回复。\u003c/li>\n\u003c/ul>\n"},"summary":{"en":"If the customer confirms receipt, obtain valid proof of delivery for that tracking number.","zh":"对于顾客确认已收到的包裹，取得与该运单对应的有效收货凭证。"},"notes":{"en":"","zh":""},"plain":{"en":"If the customer confirms receipt, obtain valid proof of delivery for that tracking number. A WhatsApp chat screenshot should show both of the following. The matching GE tracking number. A reply from the customer clearly confirming they received the parcel.","zh":"对于顾客确认已收到的包裹，取得与该运单对应的有效收货凭证。 例如，WhatsApp 聊天截图中应同时出现： 对应的 GE 运单号。 顾客明确确认已收到包裹的回复。"},"operation":null,"review":null,"keyCheck":{"en":"","zh":""},"aliases":[]},{"id":"3-2/step-4","kind":"step","title":{"en":"Record the Outcome and Follow Up","zh":"记录结果并跟进处理"},"ordinal":"4","body":{"en":"\u003cp>Once the customer confirms receipt, retain valid POD for the matching GE tracking number and close the complaint case.\u003cbr />\nIf the customer confirms they did not receive it, continue tracing the parcel and follow up on the case.\u003c/p>\n","zh":"\u003cp>顾客确认收到包裹后，保留与 GE 运单号对应的有效 POD，并关闭客诉工单。\u003cbr />\n若顾客确认未收到，则继续核查包裹去向，并跟进后续处理。\u003c/p>\n"},"summary":{"en":"Once the customer confirms receipt, retain valid POD for the matching GE tracking number and close the complaint case.","zh":"顾客确认收到包裹后，保留与 GE 运单号对应的有效 POD，并关闭客诉工单。"},"notes":{"en":"","zh":""},"plain":{"en":"Once the customer confirms receipt, retain valid POD for the matching GE tracking number and close the complaint case. If the customer confirms they did not receive it, continue tracing the parcel and follow up on the case.","zh":"顾客确认收到包裹后，保留与 GE 运单号对应的有效 POD，并关闭客诉工单。 若顾客确认未收到，则继续核查包裹去向，并跟进后续处理。"},"operation":null,"review":null,"keyCheck":{"en":"","zh":""},"aliases":[]},{"id":"3-2/notes","kind":"topic","title":{"en":"Notes","zh":"注意事项"},"ordinal":"","body":{"en":"\u003cul>\n\u003cli>The POD must be genuine and match the GE tracking number in the complaint.\u003c/li>\n\u003cli>Fabricated POD is subject to penalties, with the specific rules to be added later.\u003c/li>\n\u003cli>Verify actual receipt before treating a parcel as received by the customer, even if the system marks it as delivered.\u003c/li>\n\u003cli>Close \u003ccode>Sign but not receive\u003c/code> cases within seven days. Closing a case after seven days without a special reason may affect the KPI assessment.\u003c/li>\n\u003c/ul>\n","zh":"\u003cul>\n\u003cli>POD 必须真实，且与本次客诉的 GE 运单号相对应。\u003c/li>\n\u003cli>伪造 POD 也会受到处罚，具体处罚规则后续补充。\u003c/li>\n\u003cli>不能只凭系统显示已签收，就认定顾客实际收到包裹。\u003c/li>\n\u003cli>\u003ccode>Sign but not receive\u003c/code> 工单须在 7 天内关闭。无特殊原因逾 7 天关单，可能影响 KPI 考核。\u003c/li>\n\u003c/ul>\n"},"summary":{"en":"The POD must be genuine and match the GE tracking number in the complaint.","zh":"POD 必须真实，且与本次客诉的 GE 运单号相对应。"},"notes":{"en":"","zh":""},"plain":{"en":"The POD must be genuine and match the GE tracking number in the complaint. Fabricated POD is subject to penalties, with the specific rules to be added later. Verify actual receipt before treating a parcel as received by the customer, even if the system marks it as delivered. Close Sign but not receive cases within seven days. Closing a case after seven days without a special reason may affect the KPI assessment.","zh":"POD 必须真实，且与本次客诉的 GE 运单号相对应。 伪造 POD 也会受到处罚，具体处罚规则后续补充。 不能只凭系统显示已签收，就认定顾客实际收到包裹。 Sign but not receive 工单须在 7 天内关闭。无特殊原因逾 7 天关单，可能影响 KPI 考核。"},"operation":null,"review":null,"keyCheck":{"en":"","zh":""},"aliases":[]}]},{"id":"4-1","title":{"en":"New Driver Onboarding","zh":"新司机加入"},"part":"4","blocks":[{"id":"4-1","kind":"intro","title":{"en":"New Driver Onboarding","zh":"新司机加入"},"ordinal":"","body":{"en":"","zh":""},"summary":{"en":"","zh":""},"notes":{"en":"","zh":""},"plain":{"en":"","zh":""},"operation":null,"review":null,"keyCheck":{"en":"","zh":""},"aliases":["driver recruiting","driver onboarding","招司机"]},{"id":"4-1/step-1","kind":"step","title":{"en":"Find and assess driver candidates","zh":"寻找及核实候选司机"},"ordinal":"1","body":{"en":"\u003cp>Find candidates through referrals from current drivers or other channels.\u003cbr />\nCheck how each candidate was referred or found, and assess their reliability, attitude towards work and suitability for the hub's delivery work.\u003c/p>\n","zh":"\u003cp>通过在岗司机推荐或其他渠道寻找候选司机。\u003cbr />\n核实候选人的来源、可靠性和工作态度，确认其适合站点的派送工作。\u003c/p>\n"},"summary":{"en":"Find candidates through referrals from current drivers or other channels.","zh":"通过在岗司机推荐或其他渠道寻找候选司机。"},"notes":{"en":"","zh":""},"plain":{"en":"Find candidates through referrals from current drivers or other channels. Check how each candidate was referred or found, and assess their reliability, attitude towards work and suitability for the hub's delivery work.","zh":"通过在岗司机推荐或其他渠道寻找候选司机。 核实候选人的来源、可靠性和工作态度，确认其适合站点的派送工作。"},"operation":null,"review":null,"keyCheck":{"en":"","zh":""},"aliases":[]},{"id":"4-1/step-2","kind":"step","title":{"en":"Sign the SLA agreement","zh":"签署 SLA 合约"},"ordinal":"2","body":{"en":"\u003cp>Sign the SLA agreement with the driver and keep the signed document on file.\u003c/p>\n","zh":"\u003cp>与司机签署 SLA 合约，并留存已签署的文件。\u003c/p>\n"},"summary":{"en":"Sign the SLA agreement with the driver and keep the signed document on file.","zh":"与司机签署 SLA 合约，并留存已签署的文件。"},"notes":{"en":"","zh":""},"plain":{"en":"Sign the SLA agreement with the driver and keep the signed document on file.","zh":"与司机签署 SLA 合约，并留存已签署的文件。"},"operation":null,"review":null,"keyCheck":{"en":"","zh":""},"aliases":[]},{"id":"4-1/step-3","kind":"step","title":{"en":"Create the driver account and enter bank details","zh":"创建司机账号并录入银行信息"},"ordinal":"3","body":{"en":"\u003col>\n\u003cli>\u003cp>Puppis → \u003ccode>Basic\u003c/code> → \u003ccode>Employee\u003c/code> → \u003ccode>Add\u003c/code>\u003c/p>\n\u003c/li>\n\u003cli>\u003cp>Enter the account details.\u003c/p>\n\u003cul>\n\u003cli>\u003ccode>Company\u003c/code> — Select \u003ccode>GFS ZA\u003c/code>.\u003c/li>\n\u003cli>\u003ccode>Account\u003c/code> — Use the driver's first name with a number suffix such as \u003ccode>01\u003c/code> or \u003ccode>02\u003c/code>.\u003c/li>\n\u003cli>\u003ccode>Password\u003c/code> — Set the driver's initial password.\u003c/li>\n\u003cli>\u003ccode>Name\u003c/code> — Enter the driver's full name.\u003c/li>\n\u003cli>\u003ccode>Role\u003c/code> — Select \u003ccode>Driver\u003c/code>.\u003c/li>\n\u003cli>\u003ccode>Hub\u003c/code> — Select the hub where the driver works.\u003c/li>\n\u003cli>\u003ccode>Position\u003c/code> — Select \u003ccode>Driver\u003c/code>.\u003c/li>\n\u003cli>\u003ccode>Status\u003c/code> — Use \u003ccode>On\u003c/code> while the driver is active and change it to \u003ccode>Off\u003c/code> when they stop working with us.\u003c/li>\n\u003c/ul>\n\u003c/li>\n\u003cli>\u003cp>Verify and enter \u003ccode>Bank Card Account\u003c/code>, \u003ccode>Bank Card Account ID\u003c/code> and \u003ccode>Branch Code\u003c/code>. Confirm all three fields, because incorrect bank details can affect payment to the driver.\u003c/p>\n\u003c/li>\n\u003c/ol>\n","zh":"\u003col>\n\u003cli>\u003cp>Puppis → \u003ccode>Basic\u003c/code> → \u003ccode>Employee\u003c/code> → \u003ccode>Add\u003c/code>\u003c/p>\n\u003c/li>\n\u003cli>\u003cp>填写账号资料。\u003c/p>\n\u003cul>\n\u003cli>\u003ccode>Company\u003c/code> 选择 \u003ccode>GFS ZA\u003c/code>。\u003c/li>\n\u003cli>\u003ccode>Account\u003c/code> 可用司机的 First Name 加 \u003ccode>01\u003c/code>、\u003ccode>02\u003c/code> 等数字后缀。\u003c/li>\n\u003cli>\u003ccode>Password\u003c/code> 设置司机的初始密码。\u003c/li>\n\u003cli>\u003ccode>Name\u003c/code> 填写司机全名。\u003c/li>\n\u003cli>\u003ccode>Role\u003c/code> 选择 \u003ccode>Driver\u003c/code>。\u003c/li>\n\u003cli>\u003ccode>Hub\u003c/code> 选择司机工作的 Hub。\u003c/li>\n\u003cli>\u003ccode>Position\u003c/code> 选择 \u003ccode>Driver\u003c/code>。\u003c/li>\n\u003cli>\u003ccode>Status\u003c/code> 在岗时选 \u003ccode>On\u003c/code>，停止合作后改为 \u003ccode>Off\u003c/code>。\u003c/li>\n\u003c/ul>\n\u003c/li>\n\u003cli>\u003cp>核对并填写 \u003ccode>Bank Card Account\u003c/code>、\u003ccode>Bank Card Account ID\u003c/code> 和 \u003ccode>Branch Code\u003c/code>。三项都要确认无误，银行信息填错会影响司机收款。\u003c/p>\n\u003c/li>\n\u003c/ol>\n"},"summary":{"en":"Puppis → Basic → Employee → Add","zh":"Puppis → Basic → Employee → Add"},"notes":{"en":"","zh":""},"plain":{"en":"Puppis → Basic → Employee → Add Enter the account details. Company — Select GFS ZA. Account — Use the driver's first name with a number suffix such as 01 or 02. Password — Set the driver's initial password. Name — Enter the driver's full name. Role — Select Driver. Hub — Select the hub where the driver works. Position — Select Driver. Status — Use On while the driver is active and change it to Off when they stop working with us. Verify and enter Bank Card Account, Bank Card Account ID and Branch Code. Confirm all three fields, because incorrect bank details can affect payment to the driver.","zh":"Puppis → Basic → Employee → Add 填写账号资料。 Company 选择 GFS ZA。 Account 可用司机的 First Name 加 01、02 等数字后缀。 Password 设置司机的初始密码。 Name 填写司机全名。 Role 选择 Driver。 Hub 选择司机工作的 Hub。 Position 选择 Driver。 Status 在岗时选 On，停止合作后改为 Off。 核对并填写 Bank Card Account、Bank Card Account ID 和 Branch Code。三项都要确认无误，银行信息填错会影响司机收款。"},"operation":"Puppis","review":null,"keyCheck":{"en":"\u003cp>Verify and enter \u003ccode>Bank Card Account\u003c/code>, \u003ccode>Bank Card Account ID\u003c/code> and \u003ccode>Branch Code\u003c/code>. Confirm all three fields, because incorrect bank details can affect payment to the driver.\u003c/p>\n","zh":"\u003cp>核对并填写 \u003ccode>Bank Card Account\u003c/code>、\u003ccode>Bank Card Account ID\u003c/code> 和 \u003ccode>Branch Code\u003c/code>。三项都要确认无误，银行信息填错会影响司机收款。\u003c/p>\n"},"aliases":["driver registration","new driver account","bank card account","司机建号","银行资料"]},{"id":"4-1/step-4","kind":"step","title":{"en":"Train the driver on delivery confirmation","zh":"培训司机签收"},"ordinal":"4","body":{"en":"\u003cp>Train the new driver on delivery confirmation and proof of delivery.\u003c/p>\n","zh":"\u003cp>对新司机进行签收培训。\u003c/p>\n"},"summary":{"en":"Train the new driver on delivery confirmation and proof of delivery.","zh":"对新司机进行签收培训。"},"notes":{"en":"","zh":""},"plain":{"en":"Train the new driver on delivery confirmation and proof of delivery.","zh":"对新司机进行签收培训。"},"operation":null,"review":null,"keyCheck":{"en":"","zh":""},"aliases":[]},{"id":"4-1/step-5","kind":"step","title":{"en":"Arrange a trial delivery run","zh":"安排试派送"},"ordinal":"5","body":{"en":"\u003cp>Arrange a trial delivery run.\u003c/p>\n","zh":"\u003cp>安排试派送。\u003c/p>\n"},"summary":{"en":"Arrange a trial delivery run.","zh":"安排试派送。"},"notes":{"en":"","zh":""},"plain":{"en":"Arrange a trial delivery run.","zh":"安排试派送。"},"operation":null,"review":null,"keyCheck":{"en":"","zh":""},"aliases":[]}]},{"id":"4-2","title":{"en":"Driver Payments","zh":"司机发薪"},"part":"4","blocks":[{"id":"4-2","kind":"intro","title":{"en":"Driver Payments","zh":"司机发薪"},"ordinal":"","body":{"en":"","zh":""},"summary":{"en":"","zh":""},"notes":{"en":"","zh":""},"plain":{"en":"","zh":""},"operation":null,"review":null,"keyCheck":{"en":"","zh":""},"aliases":["driver salary","driver payroll","driver wages","payday","司机结算"]},{"id":"4-2/pay-schedule","kind":"topic","title":{"en":"Pay schedule","zh":"发薪时间"},"ordinal":"","body":{"en":"\u003cp>Drivers are normally paid on Mondays.\u003cbr />\nSome bank transfers take longer, so some drivers may receive the money on Tuesday.\u003c/p>\n","zh":"\u003cp>司机通常每周一发薪。\u003cbr />\n部分银行转账处理较慢，司机可能在周二才收到款项。\u003c/p>\n"},"summary":{"en":"Drivers are normally paid on Mondays.","zh":"司机通常每周一发薪。"},"notes":{"en":"","zh":""},"plain":{"en":"Drivers are normally paid on Mondays. Some bank transfers take longer, so some drivers may receive the money on Tuesday.","zh":"司机通常每周一发薪。 部分银行转账处理较慢，司机可能在周二才收到款项。"},"operation":null,"review":null,"keyCheck":{"en":"","zh":""},"aliases":[]},{"id":"4-2/financial","kind":"topic","title":{"en":"Confirming Financial tasks","zh":"Financial 确认"},"ordinal":"","body":{"en":"\u003cp>The system creates a Manifest each time a driver takes a batch out for delivery.\u003c/p>\n\u003col>\n\u003cli>Puppis → \u003ccode>Task\u003c/code> → \u003ccode>Financial\u003c/code>\u003c/li>\n\u003cli>Find the relevant driver and batch. Check the number of parcels collected, delivered, still awaiting delivery and marked as failed for that cycle.\u003c/li>\n\u003cli>Check that undelivered parcels have physically returned to the warehouse. Once \u003ccode>To Sign\u003c/code> is \u003ccode>0\u003c/code> and every parcel in the batch has been delivered or physically returned, promptly confirm the Manifest in \u003ccode>Financial\u003c/code>.\u003c/li>\n\u003c/ol>\n\u003cp>Under the current hub procedure, fees for the batch cannot be settled while \u003ccode>Financial\u003c/code> is unconfirmed. The driver can collect new parcels once Financial is confirmed or the previous delivery Manifest is \u003ccode>On Hold\u003c/code>. See section \u003ca href=\"#2-2\">2-2\u003c/a>, Step 2.\u003c/p>\n\u003cp>HR normally prepares driver payroll on Sunday for payment on Monday.\u003cbr />\nAim to confirm eligible Manifests before Sunday.\u003cbr />\nIf a Manifest misses the Sunday payroll run, the delivery fees for that task may be paid one weekly cycle later.\u003c/p>\n","zh":"\u003cp>司机每次领件出派，系统会生成对应的任务单（Manifest）。\u003c/p>\n\u003col>\n\u003cli>Puppis → \u003ccode>Task\u003c/code> → \u003ccode>Financial\u003c/code>\u003c/li>\n\u003cli>找到对应司机及批次，查看该周期的领件数、已签收数、待签收数和派送失败数。\u003c/li>\n\u003cli>核对未签收件是否已实际退回仓库。确认 \u003ccode>To Sign\u003c/code> 为 \u003ccode>0\u003c/code>，且本批每票包裹都已签收或实际退回仓库后，及时在 \u003ccode>Financial\u003c/code> 确认任务单。\u003c/li>\n\u003c/ol>\n\u003cp>按当前站点口径，未确认 \u003ccode>Financial\u003c/code> 时，该批次派费无法结算。司机领新包裹前需完成 Financial 确认，或此前的派送 Manifest 处于 \u003ccode>On Hold\u003c/code>，见 \u003ca href=\"#2-2\">2-2\u003c/a> 步骤 2。\u003c/p>\n\u003cp>HR 通常在周日汇总司机薪资，周一安排付款。\u003cbr />\n建议在周日前确认符合条件的任务单。\u003cbr />\n如果错过周日汇总，对应派费可能顺延一个发薪周期。\u003c/p>\n"},"summary":{"en":"The system creates a Manifest each time a driver takes a batch out for delivery.","zh":"司机每次领件出派，系统会生成对应的任务单（Manifest）。"},"notes":{"en":"","zh":""},"plain":{"en":"The system creates a Manifest each time a driver takes a batch out for delivery. Puppis → Task → Financial Find the relevant driver and batch. Check the number of parcels collected, delivered, still awaiting delivery and marked as failed for that cycle. Check that undelivered parcels have physically returned to the warehouse. Once To Sign is 0 and every parcel in the batch has been delivered or physically returned, promptly confirm the Manifest in Financial. Under the current hub procedure, fees for the batch cannot be settled while Financial is unconfirmed. The driver can collect new parcels once Financial is confirmed or the previous delivery Manifest is On Hold. See section 2-2, Step 2. HR normally prepares driver payroll on Sunday for payment on Monday. Aim to confirm eligible Manifests before Sunday. If a Manifest misses the Sunday payroll run, the delivery fees for that task may be paid one weekly cycle later.","zh":"司机每次领件出派，系统会生成对应的任务单（Manifest）。 Puppis → Task → Financial 找到对应司机及批次，查看该周期的领件数、已签收数、待签收数和派送失败数。 核对未签收件是否已实际退回仓库。确认 To Sign 为 0，且本批每票包裹都已签收或实际退回仓库后，及时在 Financial 确认任务单。 按当前站点口径，未确认 Financial 时，该批次派费无法结算。司机领新包裹前需完成 Financial 确认，或此前的派送 Manifest 处于 On Hold，见 2-2 步骤 2。 HR 通常在周日汇总司机薪资，周一安排付款。 建议在周日前确认符合条件的任务单。 如果错过周日汇总，对应派费可能顺延一个发薪周期。"},"operation":"Puppis","review":null,"keyCheck":{"en":"\u003cp>Check that undelivered parcels have physically returned to the warehouse. Once \u003ccode>To Sign\u003c/code> is \u003ccode>0\u003c/code> and every parcel in the batch has been delivered or physically returned, promptly confirm the Manifest in \u003ccode>Financial\u003c/code>.\u003c/p>\n","zh":"\u003cp>核对未签收件是否已实际退回仓库。确认 \u003ccode>To Sign\u003c/code> 为 \u003ccode>0\u003c/code>，且本批每票包裹都已签收或实际退回仓库后，及时在 \u003ccode>Financial\u003c/code> 确认任务单。\u003c/p>\n"},"aliases":["confirm financial","financial confirmation","confirm manifest","manifest confirmation","确认派费"]},{"id":"4-2/payment-issues","kind":"topic","title":{"en":"Payment issues","zh":"薪资异常"},"ordinal":"","body":{"en":"\u003cp>Drivers can check the delivery fee for each parcel in the driver app.\u003cbr />\nIf bank details are incorrect or a driver reports being underpaid, collect the details of the issue and raise it in the relevant hub's WeCom group.\u003c/p>\n","zh":"\u003cp>司机可以在司机 App 查看每票包裹的派费。\u003cbr />\n发现银行信息有误，或司机反馈少发薪资时，收集具体情况后，在所属 Hub 的 WeCom 群反馈。\u003c/p>\n"},"summary":{"en":"Drivers can check the delivery fee for each parcel in the driver app.","zh":"司机可以在司机 App 查看每票包裹的派费。"},"notes":{"en":"","zh":""},"plain":{"en":"Drivers can check the delivery fee for each parcel in the driver app. If bank details are incorrect or a driver reports being underpaid, collect the details of the issue and raise it in the relevant hub's WeCom group.","zh":"司机可以在司机 App 查看每票包裹的派费。 发现银行信息有误，或司机反馈少发薪资时，收集具体情况后，在所属 Hub 的 WeCom 群反馈。"},"operation":null,"review":null,"keyCheck":{"en":"","zh":""},"aliases":[]}]},{"id":"4-3","title":{"en":"Driver Deductions and Top-ups","zh":"司机扣罚/津贴"},"part":"4","blocks":[{"id":"4-3","kind":"intro","title":{"en":"Driver Deductions and Top-ups","zh":"司机扣罚/津贴"},"ordinal":"","body":{"en":"","zh":""},"summary":{"en":"","zh":""},"notes":{"en":"","zh":""},"plain":{"en":"","zh":""},"operation":null,"review":null,"keyCheck":{"en":"","zh":""},"aliases":["driver fine","penalty","top up","topup","allowance","司机补贴"]},{"id":"4-3/driver-deductions","kind":"topic","title":{"en":"Driver deductions","zh":"司机扣罚"},"ordinal":"","body":{"en":"\u003col>\n\u003cli>Puppis → \u003ccode>HR Workbench\u003c/code> → \u003ccode>Salary Detail (New)\u003c/code> → \u003ccode>Add\u003c/code>\u003c/li>\n\u003cli>Select the relevant \u003ccode>Hub\u003c/code> and \u003ccode>Employee\u003c/code>, then enter the actual reason and the tracking number.\u003c/li>\n\u003cli>Select \u003ccode>Deduction\u003c/code> and enter the deduction amount. The system records it as a negative amount automatically.\u003c/li>\n\u003cli>Before submitting, share the completed deduction details in the relevant hub's WeCom group.\u003c/li>\n\u003c/ol>\n","zh":"\u003col>\n\u003cli>Puppis → \u003ccode>HR Workbench\u003c/code> → \u003ccode>Salary Detail (New)\u003c/code> → \u003ccode>Add\u003c/code>\u003c/li>\n\u003cli>选择对应的 \u003ccode>Hub\u003c/code> 和 \u003ccode>Employee\u003c/code>，填写实际扣罚原因和具体运单号。\u003c/li>\n\u003cli>选择 \u003ccode>Deduction\u003c/code> 后直接填写扣罚金额，系统会自动按负数计算。\u003c/li>\n\u003cli>提交前，将已填写的扣罚信息发到所属 Hub 的 WeCom 群，同步本次扣罚情况。\u003c/li>\n\u003c/ol>\n"},"summary":{"en":"Puppis → HR Workbench → Salary Detail (New) → Add","zh":"Puppis → HR Workbench → Salary Detail (New) → Add"},"notes":{"en":"","zh":""},"plain":{"en":"Puppis → HR Workbench → Salary Detail (New) → Add Select the relevant Hub and Employee, then enter the actual reason and the tracking number. Select Deduction and enter the deduction amount. The system records it as a negative amount automatically. Before submitting, share the completed deduction details in the relevant hub's WeCom group.","zh":"Puppis → HR Workbench → Salary Detail (New) → Add 选择对应的 Hub 和 Employee，填写实际扣罚原因和具体运单号。 选择 Deduction 后直接填写扣罚金额，系统会自动按负数计算。 提交前，将已填写的扣罚信息发到所属 Hub 的 WeCom 群，同步本次扣罚情况。"},"operation":"Puppis / WeCom","review":null,"keyCheck":{"en":"\u003cp>Before submitting, share the completed deduction details in the relevant hub's WeCom group.\u003c/p>\n","zh":"\u003cp>提交前，将已填写的扣罚信息发到所属 Hub 的 WeCom 群，同步本次扣罚情况。\u003c/p>\n"},"aliases":[]},{"id":"4-3/driver-top-ups","kind":"topic","title":{"en":"Driver top-ups","zh":"司机津贴"},"ordinal":"","body":{"en":"\u003cp>Additional payments for individual drivers are usually handled as parcel-level top-ups.\u003cbr />\nWhen a top-up is needed, discuss the reason in the relevant hub's WeCom group in advance and share the affected tracking numbers and top-up amounts.\u003c/p>\n\u003cp>The specific situations in which deductions and top-ups apply will be added later.\u003c/p>\n","zh":"\u003cp>个别司机的补贴一般按包裹做 Top up。\u003cbr />\n需要补贴时，提前在所属 Hub 的 WeCom 群沟通补贴原因，并发出涉及的运单号及补贴金额。\u003c/p>\n\u003cp>扣罚和补贴的具体适用场景后续补充。\u003c/p>\n"},"summary":{"en":"Additional payments for individual drivers are usually handled as parcel-level top-ups.","zh":"个别司机的补贴一般按包裹做 Top up。"},"notes":{"en":"","zh":""},"plain":{"en":"Additional payments for individual drivers are usually handled as parcel-level top-ups. When a top-up is needed, discuss the reason in the relevant hub's WeCom group in advance and share the affected tracking numbers and top-up amounts. The specific situations in which deductions and top-ups apply will be added later.","zh":"个别司机的补贴一般按包裹做 Top up。 需要补贴时，提前在所属 Hub 的 WeCom 群沟通补贴原因，并发出涉及的运单号及补贴金额。 扣罚和补贴的具体适用场景后续补充。"},"operation":null,"review":null,"keyCheck":{"en":"","zh":""},"aliases":[]}]},{"id":"4-4","title":{"en":"Site Management","zh":"站点管理"},"part":"4","blocks":[{"id":"4-4","kind":"intro","title":{"en":"Site Management","zh":"站点管理"},"ordinal":"","body":{"en":"","zh":""},"summary":{"en":"","zh":""},"notes":{"en":"","zh":""},"plain":{"en":"","zh":""},"operation":null,"review":null,"keyCheck":{"en":"","zh":""},"aliases":["staff schedule","shift roster","overtime","仓库排班"]},{"id":"4-4/staff-rosters","kind":"topic","title":{"en":"Staff rosters","zh":"排班"},"ordinal":"","body":{"en":"\u003cp>The hub supervisor manages the warehouse staff roster, normally scheduling each staff member for six days per week.\u003cbr />\nAvoid unnecessary overtime.\u003cbr />\nWhen overtime is needed for operations, request approval in advance through the hub's WeCom channel and schedule the overtime once it is approved.\u003c/p>\n","zh":"\u003cp>站点主管负责仓内员工排班，正常情况下按每人每周 6 天安排。\u003cbr />\n避免非必要加班。\u003cbr />\n确因运营需要加班时，提前通过所属 Hub 的 WeCom 申请，获批后再安排。\u003c/p>\n"},"summary":{"en":"The hub supervisor manages the warehouse staff roster, normally scheduling each staff member for six days per week.","zh":"站点主管负责仓内员工排班，正常情况下按每人每周 6 天安排。"},"notes":{"en":"","zh":""},"plain":{"en":"The hub supervisor manages the warehouse staff roster, normally scheduling each staff member for six days per week. Avoid unnecessary overtime. When overtime is needed for operations, request approval in advance through the hub's WeCom channel and schedule the overtime once it is approved.","zh":"站点主管负责仓内员工排班，正常情况下按每人每周 6 天安排。 避免非必要加班。 确因运营需要加班时，提前通过所属 Hub 的 WeCom 申请，获批后再安排。"},"operation":null,"review":null,"keyCheck":{"en":"","zh":""},"aliases":[]},{"id":"4-4/overtime-records-and-requests","kind":"topic","title":{"en":"Overtime records and requests","zh":"加班工时与申请"},"ordinal":"","body":{"en":"\u003cp>Calculate operators' overtime hours using their actual clock-in and clock-out records.\u003cbr />\nSupervisors and team leaders must submit overtime requests in WeCom.\u003c/p>\n","zh":"\u003cp>Operator 的加班时长按打卡机记录的实际打卡时间核算。\u003cbr />\nSupervisor 和 Team Leader 需要在 WeCom 提交加班申请。\u003c/p>\n"},"summary":{"en":"Calculate operators' overtime hours using their actual clock-in and clock-out records.","zh":"Operator 的加班时长按打卡机记录的实际打卡时间核算。"},"notes":{"en":"","zh":""},"plain":{"en":"Calculate operators' overtime hours using their actual clock-in and clock-out records. Supervisors and team leaders must submit overtime requests in WeCom.","zh":"Operator 的加班时长按打卡机记录的实际打卡时间核算。 Supervisor 和 Team Leader 需要在 WeCom 提交加班申请。"},"operation":null,"review":null,"keyCheck":{"en":"","zh":""},"aliases":[]}]},{"id":"5-1","title":{"en":"OFD Report (Daily)","zh":"OFD Report（每日）"},"part":"5","blocks":[{"id":"5-1","kind":"intro","title":{"en":"OFD Report (Daily)","zh":"OFD Report（每日）"},"ordinal":"","body":{"en":"","zh":""},"summary":{"en":"","zh":""},"notes":{"en":"","zh":""},"plain":{"en":"","zh":""},"operation":null,"review":null,"keyCheck":{"en":"","zh":""},"aliases":[]},{"id":"5-1/when-this-applies","kind":"topic","title":{"en":"When This Applies","zh":"适用情况"},"ordinal":"","body":{"en":"\u003cp>Every day, report how many OFD parcels from the last 30 days are still open and how the search for them is going.\u003cbr />\nThe data comes from \u003ccode>OFD Monitor - Hub\u003c/code> in Puppis. Send the report text with a screenshot to the relevant hub's reporting group.\u003c/p>\n","zh":"\u003cp>每天汇报近 30 天内仍未完成的 OFD 包裹数量及查找进度。\u003cbr />\n数据来自 Puppis 的 \u003ccode>OFD Monitor - Hub\u003c/code>，汇报文字连同截图发到所属 Hub 的汇报群。\u003c/p>\n"},"summary":{"en":"Every day, report how many OFD parcels from the last 30 days are still open and how the search for them is going.","zh":"每天汇报近 30 天内仍未完成的 OFD 包裹数量及查找进度。"},"notes":{"en":"","zh":""},"plain":{"en":"Every day, report how many OFD parcels from the last 30 days are still open and how the search for them is going. The data comes from OFD Monitor - Hub in Puppis. Send the report text with a screenshot to the relevant hub's reporting group.","zh":"每天汇报近 30 天内仍未完成的 OFD 包裹数量及查找进度。 数据来自 Puppis 的 OFD Monitor - Hub，汇报文字连同截图发到所属 Hub 的汇报群。"},"operation":null,"review":null,"keyCheck":{"en":"","zh":""},"aliases":[]},{"id":"5-1/step-1","kind":"step","title":{"en":"Query the Last 30 Days in OFD Monitor","zh":"查询近 30 天的 OFD Monitor"},"ordinal":"1","body":{"en":"\u003col>\n\u003cli>Puppis → \u003ccode>Daily Monitor\u003c/code> → \u003ccode>OFD Monitor - Hub\u003c/code>\u003c/li>\n\u003cli>Click the date box next to \u003ccode>Target\u003c/code> and choose \u003ccode>Last 30 days\u003c/code>.\u003c/li>\n\u003cli>Check that the date range ends today, then click \u003ccode>Query\u003c/code>.\u003c/li>\n\u003c/ol>\n\u003cp>\u003cimg src=\"images/ch5/5-1-last-30-days.webp\" alt=\"OFD Monitor - Hub: Target → Last 30 days\" width=\"1400\" height=\"657\" loading=\"lazy\" decoding=\"async\" tabindex=\"0\" data-zoom>\u003c/p>\n","zh":"\u003col>\n\u003cli>Puppis → \u003ccode>Daily Monitor\u003c/code> → \u003ccode>OFD Monitor - Hub\u003c/code>\u003c/li>\n\u003cli>点击 \u003ccode>Target\u003c/code> 旁的日期框，选择 \u003ccode>Last 30 days\u003c/code>。\u003c/li>\n\u003cli>核对日期范围的结束日期为当天，点击 \u003ccode>Query\u003c/code>。\u003c/li>\n\u003c/ol>\n\u003cp>\u003cimg src=\"images/ch5/5-1-last-30-days.webp\" alt=\"OFD Monitor - Hub: Target → Last 30 days\" width=\"1400\" height=\"657\" loading=\"lazy\" decoding=\"async\" tabindex=\"0\" data-zoom>\u003c/p>\n"},"summary":{"en":"Puppis → Daily Monitor → OFD Monitor - Hub","zh":"Puppis → Daily Monitor → OFD Monitor - Hub"},"notes":{"en":"","zh":""},"plain":{"en":"Puppis → Daily Monitor → OFD Monitor - Hub Click the date box next to Target and choose Last 30 days. Check that the date range ends today, then click Query.","zh":"Puppis → Daily Monitor → OFD Monitor - Hub 点击 Target 旁的日期框，选择 Last 30 days。 核对日期范围的结束日期为当天，点击 Query。"},"operation":null,"review":null,"keyCheck":{"en":"","zh":""},"aliases":[]},{"id":"5-1/step-2","kind":"step","title":{"en":"Count the Pending Parcels","zh":"统计待处理包裹"},"ordinal":"2","body":{"en":"\u003col>\n\u003cli>The count on the \u003ccode>Created\u003c/code> tab is the Total Pending figure.\u003c/li>\n\u003cli>Check the parcels on the list against the warehouse, then count Find Out, To Be Dispatched, Still Searching and Lost Confirmed.\u003c/li>\n\u003c/ol>\n","zh":"\u003col>\n\u003cli>\u003ccode>Created\u003c/code> 标签显示的数量即 Total Pending。\u003c/li>\n\u003cli>按列表核对实物，分别统计 Find Out、To Be Dispatched、Still Searching 和 Lost Confirmed。\u003c/li>\n\u003c/ol>\n"},"summary":{"en":"The count on the Created tab is the Total Pending figure.","zh":"Created 标签显示的数量即 Total Pending。"},"notes":{"en":"","zh":""},"plain":{"en":"The count on the Created tab is the Total Pending figure. Check the parcels on the list against the warehouse, then count Find Out, To Be Dispatched, Still Searching and Lost Confirmed.","zh":"Created 标签显示的数量即 Total Pending。 按列表核对实物，分别统计 Find Out、To Be Dispatched、Still Searching 和 Lost Confirmed。"},"operation":null,"review":null,"keyCheck":{"en":"","zh":""},"aliases":[]},{"id":"5-1/step-3","kind":"step","title":{"en":"Take a Screenshot and Send the Report","zh":"截图并发送汇报"},"ordinal":"3","body":{"en":"\u003col>\n\u003cli>Take a screenshot of the results page and circle the \u003ccode>Target\u003c/code> date range and the \u003ccode>Created\u003c/code> count.\u003c/li>\n\u003cli>Fill in the report text in the format below and send it with the screenshot to the reporting group.\u003c/li>\n\u003c/ol>\n\u003cp>\u003cimg src=\"images/ch5/5-1-finished-report.webp\" alt=\"OFD report text with the marked-up OFD Monitor - Hub screenshot\" width=\"1255\" height=\"912\" loading=\"lazy\" decoding=\"async\" tabindex=\"0\" data-zoom>\u003c/p>\n","zh":"\u003col>\n\u003cli>截取查询结果页面，圈出 \u003ccode>Target\u003c/code> 日期范围和 \u003ccode>Created\u003c/code> 数量。\u003c/li>\n\u003cli>按下方格式填写汇报文字，连同截图发到汇报群。\u003c/li>\n\u003c/ol>\n\u003cp>\u003cimg src=\"images/ch5/5-1-finished-report.webp\" alt=\"OFD report text with the marked-up OFD Monitor - Hub screenshot\" width=\"1255\" height=\"912\" loading=\"lazy\" decoding=\"async\" tabindex=\"0\" data-zoom>\u003c/p>\n"},"summary":{"en":"Take a screenshot of the resul
