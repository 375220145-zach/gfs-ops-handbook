<!doctype html>
<html lang="en" data-artifact-profile="longform" data-viewport-strategy="desktop-only">
<head>
  <meta charset="utf-8">
  <meta name="artifact:profile" content="longform">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>GFS OPS · Downstream Hub Operations</title>
  <style>:root {
  color-scheme: light;
  --ink: #1b231d;
  --muted: #536055;
  --paper: #fbfcf8;
  --white: #fff;
  --line: #dce1d7;
  --wash: #eff3e9;
  --green: #245637;
  --green-soft: #e7efdf;
  --cover: #141b16;
  --lime: #d5f267;
  --warning: #71501a;
  --warning-bg: #f9f1dc;
  --nav-height: 66px;
  --font: "Avenir Next", "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
  --display: "Arial Black", "Avenir Next", "Segoe UI Black", sans-serif;
  --mono: "SFMono-Regular", Consolas, "Liberation Mono", monospace;
}
*, *::before, *::after { box-sizing: border-box; }
[hidden] { display: none !important; }
html { scroll-padding-top: calc(var(--nav-height) + 20px); }
body {
  margin: 0;
  color: var(--ink);
  background: var(--paper);
  font: 500 15px/1.62 var(--font);
}
a { color: inherit; }
button, input { color: inherit; font: inherit; }
button { cursor: pointer; }
button:focus-visible, a:focus-visible, input:focus-visible, summary:focus-visible, [tabindex="0"]:focus-visible {
  outline: 2px solid #709640;
  outline-offset: 4px;
}
.sr-only, .skip:not(:focus) {
  position: absolute;
  width: 1px;
  height: 1px;
  padding: 0;
  margin: -1px;
  overflow: hidden;
  clip-path: inset(50%);
  white-space: nowrap;
  border: 0;
}
.skip:focus {
  position: fixed;
  z-index: 12;
  top: 12px;
  left: 12px;
  background: var(--white);
  padding: 8px 14px;
}

.top {
  height: var(--nav-height);
  position: sticky;
  z-index: 5;
  top: 0;
  background: var(--paper);
  border-bottom: 1px solid var(--line);
}
.top-inner {
  display: flex;
  align-items: center;
  justify-content: space-between;
  height: 100%;
  max-width: 1600px;
  padding-inline: clamp(22px, 3.3vw, 54px);
  margin-inline: auto;
}
.wordmark, .top-actions, .search-trigger, .languages {
  display: flex;
  align-items: center;
}
.wordmark {
  gap: 10px;
  color: inherit;
  text-decoration: none;
  font-size: 16px;
  font-weight: 750;
  white-space: nowrap;
}
.wordmark:hover { text-decoration: underline; text-underline-offset: 4px; }
.brand-mark {
  width: 19px;
  height: 19px;
  display: inline-block;
  background: currentColor;
  clip-path: polygon(0 0, 100% 0, 100% 22%, 22% 22%, 22% 40%, 82% 40%, 82% 62%, 22% 62%, 22% 100%, 0 100%);
}
.top-actions { gap: 18px; }
.search-trigger {
  width: clamp(210px, 21vw, 306px);
  text-align: left;
  gap: 10px;
  min-height: 36px;
  padding: 5px 8px 5px 12px;
  border: 1px solid var(--line);
  border-radius: 6px;
  background: var(--white);
  color: var(--muted);
  font-size: 13px;
}
.search-trigger:hover { background: var(--wash); color: var(--ink); }
.search-trigger kbd { margin-left: auto; }
.search-icon {
  flex: 0 0 auto;
  position: relative;
  display: inline-block;
  width: 12px;
  height: 12px;
  border: 1.5px solid currentColor;
  border-radius: 50%;
  margin-right: 3px;
}
.search-icon::after {
  content: "";
  position: absolute;
  width: 5px;
  height: 1.5px;
  background: currentColor;
  right: -4px;
  bottom: -2px;
  transform: rotate(45deg);
}
kbd {
  display: inline-block;
  white-space: nowrap;
  border: 1px solid var(--line);
  border-radius: 4px;
  background: var(--paper);
  color: var(--muted);
  font: 500 11px/1.4 var(--mono);
  padding: 1px 5px;
}
.languages {
  border: 1px solid var(--line);
  border-radius: 6px;
  padding: 2px;
  gap: 2px;
}
.languages button {
  white-space: nowrap;
  border: 0;
  background: transparent;
  color: var(--muted);
  border-radius: 3px;
  padding: 4px 8px;
  min-height: 27px;
  font-size: 12px;
  font-weight: 700;
}
.languages button:hover { color: var(--green); }
.languages button[aria-pressed="true"] { background: var(--green-soft); color: var(--green); }
.narrow-note { display: none; }

body[data-view="cover"] { background: var(--cover); }
body[data-view="cover"] .top {
  color: #f4f6e9;
  background: var(--cover);
  border-color: #334133;
}
body[data-view="cover"] .brand-mark { color: var(--lime); }
body[data-view="cover"] .top :is(.search-trigger, .languages) { border-color: #465343; }
body[data-view="cover"] .search-trigger { background: #202a21; color: #e2e9db; }
body[data-view="cover"] .search-trigger:hover { background: #2a392a; }
body[data-view="cover"] .top kbd { border-color: #566254; background: #283428; color: #eff3e7; }
body[data-view="cover"] .languages button { color: #e2e9db; }
body[data-view="cover"] .languages button[aria-pressed="true"] { color: #18220e; background: var(--lime); }
.cover {
  position: relative;
  overflow: clip;
  isolation: isolate;
  min-height: max(600px, calc(100dvh - var(--nav-height)));
  display: grid;
  align-items: center;
  color: var(--lime);
}
.cover-inner {
  width: min(100%, 1600px);
  margin-inline: auto;
  padding: 60px clamp(24px, 5.8vw, 100px) 66px;
}
.cover h1 {
  position: relative;
  z-index: 1;
  margin: 0 0 46px;
  font-family: var(--display);
  font-weight: 950;
  letter-spacing: -.072em;
  line-height: .92;
}
.headline-line { display: block; overflow: clip; padding: 0 .09em .12em 0; }
.headline-line > span { display: inline-block; animation: arrive 650ms cubic-bezier(.2,.82,.28,1) both; }
.headline-line:first-child { font-size: clamp(36px, 7.1vw, 115px); color: #eef4dc; }
.headline-gfs {
  font-size: clamp(70px, 13.8vw, 238px);
  text-align: right;
  margin-top: .038em;
}
.headline-gfs > span { animation-delay: 120ms; }
@keyframes arrive {
  from { transform: translateY(112%); opacity: .25; }
  to { transform: translateY(0); opacity: 1; }
}
.route-art { position: absolute; inset: 0; z-index: -1; overflow: hidden; }
.route-art i {
  --bend: 25%;
  position: absolute;
  left: 0;
  top: calc(47% + var(--track) * 19px);
  width: 100%;
  height: 61%;
  background: #314432;
  clip-path: polygon(0 73%, var(--bend) 73%, 62% 2%, 100% 2%, 100% calc(2% + 1px),
    62% calc(2% + 1px), var(--bend) calc(73% + 1px), 0 calc(73% + 1px));
}
.route-art i:nth-child(1) { --track: -2; background: #42593e; }
.route-art i:nth-child(2) { --track: -1; }
.route-art i:nth-child(3) { --track: 0; }
.route-art i:nth-child(4) { --track: 1; background: #607a4c; }
.route-art i:nth-child(5) { --track: 2; }
.route-art i:nth-child(6) { --track: 3; }
.enter {
  position: relative;
  z-index: 1;
  display: inline-flex;
  align-items: center;
  justify-content: space-between;
  gap: 36px;
  text-decoration: none;
  color: #192110;
  background: var(--lime);
  border: 1px solid var(--lime);
  padding: 10px 14px 10px 17px;
  min-height: 47px;
  font-weight: 780;
  font-size: 14px;
  transition: background-color 150ms ease, color 150ms ease;
}
.arrow { display: inline-block; transition: transform 160ms ease; }
.enter:hover { background: #eef4dc; border-color: #eef4dc; }
.enter:hover .arrow { transform: translate(2px, -2px); }

.manual {
  display: grid;
  grid-template-columns: 245px minmax(0, 790px) minmax(155px, 220px);
  column-gap: clamp(25px, 3.4vw, 64px);
  max-width: 1545px;
  padding-inline: clamp(22px, 3.3vw, 54px);
  margin-inline: auto;
  min-height: calc(100dvh - var(--nav-height));
}
.rail, .page-rail {
  min-width: 0;
  position: sticky;
  top: var(--nav-height);
  align-self: start;
  max-height: calc(100dvh - var(--nav-height));
  overflow-y: auto;
  scrollbar-width: thin;
}
.rail {
  padding: 32px 17px 32px 0;
  border-right: 1px solid var(--line);
}
.directory-title, .toc-title {
  margin: 0 0 13px;
  font-size: 12px;
  font-weight: 800;
  color: var(--muted);
}
.nav-group { border-top: 1px solid var(--line); }
.nav-group:last-child { border-bottom: 1px solid var(--line); }
.group-title {
  display: grid;
  grid-template-columns: 20px minmax(0, 1fr) 10px;
  align-items: center;
  gap: 6px;
  padding: 10px 8px;
  color: var(--ink);
  line-height: 1.45;
  font-size: 13px;
  font-weight: 700;
  cursor: pointer;
  list-style: none;
}
.group-title::-webkit-details-marker { display: none; }
.group-title::after {
  content: "";
  width: 6px;
  height: 6px;
  border-right: 1.5px solid currentColor;
  border-bottom: 1.5px solid currentColor;
  transform: rotate(-45deg);
  transition: transform 140ms ease;
  justify-self: center;
}
.nav-group[open] > .group-title::after { transform: translateY(-2px) rotate(45deg); }
.group-title:hover { background: var(--wash); }
.nav-group[data-current] > .group-title { color: var(--green); }
.group-title .number { color: var(--muted); font: 500 11px/1 var(--mono); }
.nav-group ol, .page-rail ol { list-style: none; padding: 0; margin: 0; }
.nav-group ol { padding: 0 0 7px 8px; }
.nav-link {
  display: grid;
  grid-template-columns: 34px minmax(0, 1fr);
  align-items: baseline;
  padding: 5px 8px;
  min-height: 31px;
  border-radius: 4px;
  text-decoration: none;
  color: var(--muted);
  font-size: 12.5px;
  line-height: 1.45;
  overflow-wrap: anywhere;
}
.nav-link:hover, .toc-link:hover { color: var(--ink); background: var(--wash); }
.nav-link[aria-current="page"] { background: var(--green-soft); color: var(--green); font-weight: 760; }
.nav-link .number { color: inherit; font: 500 11px/1 var(--mono); }
.page-rail { padding: 35px 0 24px 0; }
.toc-link {
  display: block;
  text-decoration: none;
  border-radius: 4px;
  margin-left: -7px;
  padding: 5px 7px;
  color: var(--muted);
  font-size: 12.5px;
  line-height: 1.45;
}
.toc-link[aria-current="location"] { color: var(--green); background: var(--green-soft); font-weight: 720; }

.document { padding: 39px 0 42px; min-width: 0; overflow-wrap: anywhere; }
.breadcrumb {
  display: flex;
  gap: 8px;
  align-items: baseline;
  color: var(--muted);
  margin: 0 0 13px;
  font-size: 13px;
}
.breadcrumb span:last-child { font-family: var(--mono); font-size: 12px; }
.document h1 { font-size: clamp(30px, 3.05vw, 53px); line-height: 1.12; letter-spacing: -.05em; font-weight: 780; margin: 0 0 32px; }
:lang(zh) .document h1 { letter-spacing: -.03em; }
.content-block { position: relative; }
.content-block + .content-block { border-top: 1px solid var(--line); }
.content-block.intro { padding-bottom: 15px; }
.content-block.intro:empty { display: none; }
.content-block.step, .content-block.topic, .content-block.subtopic { padding: 16px 0 17px; }
.content-block.step {
  display: grid;
  grid-template-columns: 34px minmax(0, 1fr);
  gap: 13px;
  scroll-margin-top: 12px;
}
.content-block[data-selected="true"]::before {
  content: "";
  position: absolute;
  inset: 2px -10px;
  border-radius: 5px;
  background: var(--green-soft);
  z-index: -1;
}
.step-number {
  display: block;
  padding-top: 4px;
  color: var(--green);
  font: 650 13px/1.4 var(--mono);
}
.block-head {
  display: flex;
  align-items: baseline;
  justify-content: space-between;
  gap: 12px;
}
.block-head :is(h2, h3) {
  margin: 0;
  font-size: 17px;
  line-height: 1.43;
  letter-spacing: -.018em;
  font-weight: 770;
}
.content-block.topic .block-head h2 { font-size: 19px; }
.content-block.subtopic { margin-inline-start: 18px; }
.toc-subtopic { padding-inline-start: 18px; }
.step-summary { margin: 5px 0 0; color: var(--muted); font-size: 14px; }
.operation {
  white-space: nowrap;
  flex: 0 0 auto;
  display: inline-flex;
  flex-wrap: wrap;
  justify-content: flex-end;
  gap: 4px 8px;
  align-items: center;
  padding: 3px 0 3px 5px;
  border: 0;
  background: transparent;
  color: var(--green);
  font-size: 12px;
  line-height: 1.45;
  font-weight: 740;
}
.operation span:first-child { font-weight: 590; color: var(--muted); }
.operation:hover span:nth-child(2) { text-decoration: underline; text-underline-offset: 3px; }
.operation:hover .arrow { transform: translate(2px, -2px); }
.prose { color: var(--ink); max-width: 75ch; line-height: 1.7; }
.prose :is(p, ul, ol) { margin: 7px 0 13px; }
.prose :is(ul, ol) { padding-left: 22px; }
.prose li + li { margin-top: 5px; }
.prose li > :is(p, ol, ul) { margin: 5px 0; }
.prose a { color: var(--green); text-underline-offset: 3px; overflow-wrap: anywhere; }
.prose a:hover { color: var(--ink); }
.prose code {
  font: 500 .88em/1.5 var(--mono);
  color: #234831;
  background: #edf2e9;
  padding: .14em .32em;
  border-radius: 3px;
  box-decoration-break: clone;
}
.prose img { max-width: 100%; height: auto; }
.table-scroll { overflow-x: auto; max-width: 100%; margin: 9px 0 18px; }
.prose table { text-align: left; width: 100%; border-collapse: collapse; font-size: 13px; }
.prose :is(td, th) { border-bottom: 1px solid var(--line); vertical-align: top; padding: 9px 10px; }
.prose th { color: var(--ink); font-weight: 760; background: var(--wash); }
.prose td:first-child code { text-wrap: pretty; }
.prose .important {
  display: block;
  margin-top: 6px;
}
.callout {
  color: var(--warning);
  background: var(--warning-bg);
  padding: 8px 10px;
  border-radius: 4px;
  margin: 8px 0 0;
  font-size: 12.5px;
}
.callout strong { margin-right: 4px; }
.pager {
  border-top: 1px solid var(--line);
  margin-top: 27px;
  padding-top: 16px;
  display: flex;
  gap: 12px;
  justify-content: space-between;
}
.pager a { color: var(--green); font-size: 13px; font-weight: 680; text-decoration: none; }
.pager a:hover { text-decoration: underline; text-underline-offset: 3px; }
.pager a:last-child { margin-left: auto; text-align: right; }
.no-script { margin: 16px; color: var(--muted); }

dialog { color: var(--ink); padding: 0; border: 1px solid var(--line); background: var(--white); }
dialog::backdrop { background: rgb(16 23 17 / 40%); }
body:has(dialog[open]) { overflow: hidden; }
.search-dialog {
  width: min(640px, calc(100vw - 38px));
  max-height: min(640px, calc(100dvh - 36px));
  margin: min(14vh, 135px) auto auto;
  border-radius: 10px;
  box-shadow: 0 16px 55px rgb(16 23 17 / 20%);
}
.search-dialog[open] {
  display: grid;
  grid-template-rows: auto minmax(90px, 1fr) auto;
  animation: pop-in 145ms ease-out both;
}
@keyframes pop-in {
  from { opacity: 0; transform: translateY(-7px) scale(.99); }
  to { opacity: 1; transform: translateY(0) scale(1); }
}
.search-field {
  display: flex;
  align-items: center;
  gap: 14px;
  padding: 12px 16px;
  border-bottom: 1px solid var(--line);
  color: var(--muted);
}
.search-field input {
  padding: 4px 2px;
  min-width: 0;
  flex: 1;
  border: 0;
  background: transparent;
  color: var(--ink);
}
.search-field input::-webkit-search-cancel-button { display: none; }
.close {
  flex: 0 0 auto;
  width: 32px;
  height: 32px;
  display: grid;
  place-content: center;
  border: 0;
  border-radius: 5px;
  color: var(--muted);
  background: transparent;
  font: normal 24px/1 var(--font);
}
.close:hover { background: var(--wash); color: var(--ink); }
.results { min-height: 90px; padding: 7px; overflow: auto; }
.result {
  display: grid;
  gap: 1px;
  border-radius: 5px;
  text-decoration: none;
  padding: 8px 10px;
}
.result:is(:hover, [data-active="true"]) { background: var(--green-soft); }
.result-title { font-weight: 760; font-size: 14px; }
.result-path, .result-excerpt { color: var(--muted); font-size: 12px; line-height: 1.4; }
.result-excerpt { overflow-wrap: anywhere; }
.result-excerpt mark { color: var(--green); background: transparent; font-weight: 790; }
.search-footer {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 10px;
  padding: 8px 12px;
  border-top: 1px solid var(--line);
  color: var(--muted);
  font-size: 12px;
}
.search-keys { white-space: nowrap; }
.empty { padding: 12px; margin: 0; color: var(--muted); }
.sheet {
  position: fixed;
  inset: 0 0 0 auto;
  width: min(550px, 100vw);
  height: 100dvh;
  max-width: 100%;
  max-height: none;
  margin: 0;
  border: 0;
  border-left: 1px solid var(--line);
}
.sheet[data-operation="1-5/real-time-query"] { width: min(790px, 100vw); }
.sheet[open] { display: grid; grid-template-rows: auto minmax(0, 1fr); animation: slide-in 205ms cubic-bezier(.22,.8,.32,1) both; }
@keyframes slide-in { from { transform: translateX(100%); } to { transform: translateX(0); } }
.sheet::backdrop { background: rgb(16 23 17 / 22%); }
.sheet-top {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 9px;
  border-bottom: 1px solid var(--line);
  padding: 13px 20px;
}
.sheet-top p { color: var(--muted); margin: 0; font-size: 12.5px; }
.sheet-content { padding: 24px 25px 42px; overflow: auto; }
.sheet-content h2 { font-size: 27px; letter-spacing: -.03em; line-height: 1.2; margin: 0 0 14px; }
.sheet-content h2:focus { outline: none; }
.sheet-content .prose { font-size: 14px; }

@media (max-width: 1180px) {
  .manual { grid-template-columns: 225px minmax(0, 1fr) 146px; gap: 25px; }
  .block-head { flex-wrap: wrap; gap: 1px 12px; }
  .operation { padding-left: 0; }
}
@media (max-width: 1023px) {
  .narrow-note {
    display: block;
    background: var(--wash);
    color: var(--green);
    border-bottom: 1px solid var(--line);
    padding: 6px 15px;
    font-size: 12px;
  }
  .manual { grid-template-columns: 200px minmax(0, 1fr); gap: 22px; }
  .page-rail { display: none; }
}
@media (max-width: 650px) {
  .top-inner { padding-inline: 13px; gap: 10px; }
  .wordmark { font-size: 13px; gap: 6px; }
  .brand-mark { width: 14px; height: 14px; }
  .top-actions { gap: 7px; }
  .search-trigger { width: auto; min-width: 34px; padding: 7px; justify-content: center; }
  .search-trigger :is(kbd, [data-label]) { position: absolute; width: 1px; height: 1px; clip-path: inset(50%); overflow: hidden; white-space: nowrap; }
  .cover { min-height: max(390px, calc(100dvh - var(--nav-height) - 34px)); }
  .cover-inner { padding-inline: 20px; }
  .cover h1 { margin-bottom: 30px; }
  .manual { display: flex; flex-direction: column; padding-inline: 14px; gap: 0; }
  .rail { position: static; padding: 13px 0; max-height: 185px; width: 100%; border-right: 0; border-bottom: 1px solid var(--line); }
  .directory-title { margin: 0 0 8px; }
  .document { padding-top: 23px; }
  .document h1 { margin-bottom: 19px; }
  .content-block.step { grid-template-columns: 25px minmax(0, 1fr); gap: 7px; }
  .block-head { display: block; }
}
@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { scroll-behavior: auto !important; animation: none !important; transition: none !important; }
}
@media print {
  .top, .rail, .page-rail, .narrow-note, .pager, .operation, .skip, dialog, .route-art, .enter { display: none !important; }
  body, body[data-view="cover"], .cover { background: white; color: black; }
  .cover h1 span { color: black; }
  .cover { min-height: auto; }
  .manual { display: block; padding: 0; }
  .document { padding: 0; }
  .block-head { break-after: avoid; }
  .prose tr, .callout { break-inside: avoid; }
}

.content-block { isolation: isolate; }
.print-detail { display: none; }
.key-check {
  margin-top: 10px;
  padding: 8px 11px;
  border: 1px solid var(--line);
  background: var(--wash);
  border-radius: 4px;
  font-size: 13px;
}
.key-check > strong { color: var(--green); }
.key-check p { margin: 2px 0 0; }
@media print {
  .print-detail { display: block; }
  .step-summary:has(+ .print-detail), .key-check { display: none; }
}

.sheet-content .prose > ol > li { padding-left: 3px; }
.sheet-content .prose ol > li::marker { color: var(--green); font-weight: 700; }
.sheet-next {
  display: grid;
  gap: 2px;
  margin-top: 22px;
  padding: 11px 0;
  border-top: 1px solid var(--line);
  text-decoration: none;
}

ration":null,"review":null,"keyCheck":{"en":"","zh":""},"aliases":[]}]},{"id":"1-4","title":{"en":"Hub Team Roles","zh":"站点人员配置"},"part":"1","blocks":[{"id":"1-4","kind":"intro","title":{"en":"Hub Team Roles","zh":"站点人员配置"},"ordinal":"","body":{"en":"\u003cp>A downstream hub typically has a supervisor, team leaders, warehouse operators and freelance delivery drivers.\u003c/p>\n","zh":"\u003cp>一般下游站点配有主管（Supervisor）、组长（Team Leader）、操作员（Operator）及派送司机（Freelancer）。\u003c/p>\n"},"summary":{"en":"A downstream hub typically has a supervisor, team leaders, warehouse operators and freelance delivery drivers.","zh":"一般下游站点配有主管（Supervisor）、组长（Team Leader）、操作员（Operator）及派送司机（Freelancer）。"},"plain":{"en":"A downstream hub typically has a supervisor, team leaders, warehouse operators and freelance delivery drivers.","zh":"一般下游站点配有主管（Supervisor）、组长（Team Leader）、操作员（Operator）及派送司机（Freelancer）。"},"operation":null,"review":null,"keyCheck":{"en":"","zh":""},"aliases":[]}]},{"id":"1-5","title":{"en":"Common Puppis Modules","zh":"Puppis 常用模块"},"part":"1","blocks":[{"id":"1-5","kind":"intro","title":{"en":"Common Puppis Modules","zh":"Puppis 常用模块"},"ordinal":"","body":{"en":"","zh":""},"summary":{"en":"","zh":""},"plain":{"en":"","zh":""},"operation":null,"review":null,"keyCheck":{"en":"","zh":""},"aliases":[]},{"id":"1-5/work-order-system","kind":"topic","title":{"en":"Work Order System","zh":"Work Order System"},"ordinal":"","body":{"en":"\u003cp>\u003ccode>Complaint Task\u003c/code> · \u003ccode>Package Exception Task (Dispatch)\u003c/code>\u003c/p>\n","zh":"\u003cp>\u003ccode>Complaint Task\u003c/code> · \u003ccode>Package Exception Task (Dispatch)\u003c/code>\u003c/p>\n"},"summary":{"en":"Complaint Task · Package Exception Task (Dispatch)","zh":"Complaint Task · Package Exception Task (Dispatch)"},"plain":{"en":"Complaint Task · Package Exception Task (Dispatch)","zh":"Complaint Task · Package Exception Task (Dispatch)"},"operation":null,"review":null,"keyCheck":{"en":"","zh":""},"aliases":[]},{"id":"1-5/package","kind":"topic","title":{"en":"Package","zh":"Package"},"ordinal":"","body":{"en":"","zh":""},"summary":{"en":"","zh":""},"plain":{"en":"","zh":""},"operation":null,"review":null,"keyCheck":{"en":"","zh":""},"aliases":[]},{"id":"1-5/real-time-query","kind":"subtopic","title":{"en":"Real Time Query","zh":"Real Time Query"},"ordinal":"","body":{"en":"\u003cp>Puppis → \u003ccode>Package\u003c/code> → \u003ccode>Real Time Query\u003c/code>\u003c/p>\n\u003cp>Check the parcel's current status and use the table below to interpret it.\u003c/p>\n\u003cdiv class=\"table-scroll\" tabindex=\"0\" role=\"region\" aria-label=\"Table\">\u003ctable>\n\u003cthead>\n\u003ctr>\n  \u003cth>Package status\u003c/th>\n  \u003cth>What it means\u003c/th>\n  \u003cth>How the status is set\u003c/th>\n\u003c/tr>\n\u003c/thead>\n\u003ctbody>\n\u003ctr>\n  \u003ctd>\u003ccode>CREATE\u003c/code>\u003c/td>\n  \u003ctd>The shipper has created the shipment.\u003c/td>\n  \u003ctd>The system sets this status when the shipper creates the waybill.\u003c/td>\n\u003c/tr>\n\u003ctr>\n  \u003ctd>\u003ccode>COLLECT\u003c/code>\u003c/td>\n  \u003ctd>The parcel has been collected from the shipper's warehouse.\u003c/td>\n  \u003ctd>Scan the parcel using \u003ccode>Arrive Sort\u003c/code>.\u003c/td>\n\u003c/tr>\n\u003ctr>\n  \u003ctd>\u003ccode>INBOUND\u003c/code>\u003c/td>\n  \u003ctd>The parcel has been scanned into the hub on arrival or on return.\u003c/td>\n  \u003ctd>1. Use \u003ccode>Arrive Sort\u003c/code> for new parcels where applicable.\u003cbr>2. For parcels loaded from another hub to this hub, scan with \u003ccode>Sort Common\u003c/code> or \u003ccode>Sort Delivery\u003c/code>.\u003cbr>3. For returned parcels in \u003ccode>DISPATCH\u003c/code> or \u003ccode>NOT_SIGNED\u003c/code>, scan with \u003ccode>Sort Common\u003c/code> or \u003ccode>Sort Delivery\u003c/code>.\u003c/td>\n\u003c/tr>\n\u003ctr>\n  \u003ctd>\u003ccode>LOAD\u003c/code>\u003c/td>\n  \u003ctd>The system has recorded the parcel for transfer to another hub.\u003c/td>\n  \u003ctd>Scan the parcel using \u003ccode>Quick Tpl - Load\u003c/code>.\u003cbr>See section \u003ca href=\"#2-4\">2-4\u003c/a> for the physical handover.\u003c/td>\n\u003c/tr>\n\u003ctr>\n  \u003ctd>\u003ccode>DISPATCH\u003c/code>\u003c/td>\n  \u003ctd>The parcel has been assigned to a driver.\u003c/td>\n  \u003ctd>Scan the parcel with \u003ccode>Dispatch\u003c/code> to assign it to the driver.\u003c/td>\n\u003c/tr>\n\u003ctr>\n  \u003ctd>\u003ccode>OFD\u003c/code>\u003c/td>\n  \u003ctd>The driver has accepted the parcel and the system has marked it as out for delivery.\u003c/td>\n  \u003ctd>The driver scans or confirms receipt of the parcel in \u003ccode>Get Task\u003c/code>.\u003c/td>\n\u003c/tr>\n\u003ctr>\n  \u003ctd>\u003ccode>NOT_SIGNED\u003c/code>\u003c/td>\n  \u003ctd>The delivery attempt was unsuccessful.\u003c/td>\n  \u003ctd>The driver selects the applicable failure reason on the \u003ccode>Not Sign\u003c/code> page.\u003c/td>\n\u003c/tr>\n\u003ctr>\n  \u003ctd>\u003ccode>SIGN\u003c/code>\u003c/td>\n  \u003ctd>The system has recorded the parcel as delivered.\u003c/td>\n  \u003ctd>The driver selects \u003ccode>Signed\u003c/code> in the driver app.\u003c/td>\n\u003c/tr>\n\u003ctr>\n  \u003ctd>\u003ccode>RTO_CONFIRM\u003c/code>\u003c/td>\n  \u003ctd>The return parcel has been received into the original hub and is ready for return to the shipper.\u003c/td>\n  \u003ctd>The return parcel is scanned into the original hub.\u003c/td>\n\u003c/tr>\n\u003ctr>\n  \u003ctd>\u003ccode>RTO_SIGN\u003c/code>\u003c/td>\n  \u003ctd>The return has been signed off in the last-mile system.\u003cbr>To verify handover back to the shipper, check the \u003ccode>Outbound\u003c/code> record in \u003ccode>RTV Package\u003c/code>.\u003c/td>\n  \u003ctd>The status is recorded after an \u003ccode>RTO_SIGN\u003c/code> scan or generated by the applicable return receiving process.\u003c/td>\n\u003c/tr>\n\u003ctr>\n  \u003ctd>\u003ccode>CANCELED\u003c/code>\u003c/td>\n  \u003ctd>The shipper has cancelled the shipment.\u003c/td>\n  \u003ctd>The shipper submits a cancellation instruction.\u003c/td>\n\u003c/tr>\n\u003ctr>\n  \u003ctd>\u003ccode>LOST\u003c/code>\u003c/td>\n  \u003ctd>The parcel has been marked as lost in the system.\u003c/td>\n  \u003ctd>Once the loss is verified, an authorised user selects \u003ccode>Mark Lost\u003c/code>.\u003c/td>\n\u003c/tr>\n\u003c/tbody>\n\u003c/table>\u003c/div>\n","zh":"\u003cp>Puppis → \u003ccode>Package\u003c/code> → \u003ccode>Real Time Query\u003c/code>\u003c/p>\n\u003cp>查看包裹当前状态，状态含义见下表。\u003c/p>\n\u003cdiv class=\"table-scroll\" tabindex=\"0\" role=\"region\" aria-label=\"Table\">\u003ctable>\n\u003cthead>\n\u003ctr>\n  \u003cth>包裹状态\u003c/th>\n  \u003cth>状态含义\u003c/th>\n  \u003cth>如何进入该状态\u003c/th>\n\u003c/tr>\n\u003c/thead>\n\u003ctbody>\n\u003ctr>\n  \u003ctd>\u003ccode>CREATE\u003c/code>\u003c/td>\n  \u003ctd>货主已建单。\u003c/td>\n  \u003ctd>货主侧创建运单后生成。\u003c/td>\n\u003c/tr>\n\u003ctr>\n  \u003ctd>\u003ccode>COLLECT\u003c/code>\u003c/td>\n  \u003ctd>已从货主仓揽收包裹。\u003c/td>\n  \u003ctd>用 \u003ccode>Arrive Sort\u003c/code> 扫描包裹。\u003c/td>\n\u003c/tr>\n\u003ctr>\n  \u003ctd>\u003ccode>INBOUND\u003c/code>\u003c/td>\n  \u003ctd>包裹已在站点完成到站或返仓入库。\u003c/td>\n  \u003ctd>1. 适用 \u003ccode>Arrive Sort\u003c/code> 的新件用该功能扫描。\u003cbr>2. 从其他站点已 Load 到本站的包裹，用 \u003ccode>Sort Common\u003c/code> 或 \u003ccode>Sort Delivery\u003c/code> 扫描。\u003cbr>3. 对处于 \u003ccode>DISPATCH\u003c/code> 或 \u003ccode>NOT_SIGNED\u003c/code> 状态的返仓包裹，用 \u003ccode>Sort Common\u003c/code> 或 \u003ccode>Sort Delivery\u003c/code> 扫描。\u003c/td>\n\u003c/tr>\n\u003ctr>\n  \u003ctd>\u003ccode>LOAD\u003c/code>\u003c/td>\n  \u003ctd>系统已记录包裹转往另一站点。\u003c/td>\n  \u003ctd>用 \u003ccode>Quick Tpl - Load\u003c/code> 扫描包裹。\u003cbr>跨站转运的实物交接参见 \u003ca href=\"#2-4\">2-4\u003c/a>。\u003c/td>\n\u003c/tr>\n\u003ctr>\n  \u003ctd>\u003ccode>DISPATCH\u003c/code>\u003c/td>\n  \u003ctd>包裹已分配给司机。\u003c/td>\n  \u003ctd>用 \u003ccode>Dispatch\u003c/code> 扫描分配给对应司机。\u003c/td>\n\u003c/tr>\n\u003ctr>\n  \u003ctd>\u003ccode>OFD\u003c/code>\u003c/td>\n  \u003ctd>司机已领取包裹，系统将其标为出派。\u003c/td>\n  \u003ctd>司机在 \u003ccode>Get Task\u003c/code> 扫描或确认接收包裹。\u003c/td>\n\u003c/tr>\n\u003ctr>\n  \u003ctd>\u003ccode>NOT_SIGNED\u003c/code>\u003c/td>\n  \u003ctd>本次派送未成功。\u003c/td>\n  \u003ctd>司机在 \u003ccode>Not Sign\u003c/code> 页面选择对应的派送失败原因。\u003c/td>\n\u003c/tr>\n\u003ctr>\n  \u003ctd>\u003ccode>SIGN\u003c/code>\u003c/td>\n  \u003ctd>系统已记录包裹签收。\u003c/td>\n  \u003ctd>司机在司机 App 选 \u003ccode>Signed\u003c/code>。\u003c/td>\n\u003c/tr>\n\u003ctr>\n  \u003ctd>\u003ccode>RTO_CONFIRM\u003c/code>\u003c/td>\n  \u003ctd>退运包裹已在原始 Hub 入库，准备退回货主。\u003c/td>\n  \u003ctd>退运包裹在原始 Hub 完成入库。\u003c/td>\n\u003c/tr>\n\u003ctr>\n  \u003ctd>\u003ccode>RTO_SIGN\u003c/code>\u003c/td>\n  \u003ctd>末派侧退运已签收。\u003cbr>核实是否已退给货主时，查 \u003ccode>RTV Package\u003c/code> 的 \u003ccode>Outbound\u003c/code> 记录。\u003c/td>\n  \u003ctd>退运包裹完成 \u003ccode>RTO_SIGN\u003c/code> 扫描，或由对应退运入库流程生成该状态。\u003c/td>\n\u003c/tr>\n\u003ctr>\n  \u003ctd>\u003ccode>CANCELED\u003c/code>\u003c/td>\n  \u003ctd>货主已取消运单。\u003c/td>\n  \u003ctd>货主侧发出取消指令。\u003c/td>\n\u003c/tr>\n\u003ctr>\n  \u003ctd>\u003ccode>LOST\u003c/code>\u003c/td>\n  \u003ctd>包裹已在系统中标记为丢失。\u003c/td>\n  \u003ctd>核实丢失后，由有权限的人员用 \u003ccode>Mark Lost\u003c/code> 标记。\u003c/td>\n\u003c/tr>\n\u003c/tbody>\n\u003c/table>\u003c/div>\n"},"summary":{"en":"Puppis → Package → Real Time Query","zh":"Puppis → Package → Real Time Query"},"plain":{"en":"Puppis → Package → Real Time Query Check the parcel's current status and use the table below to interpret it. Package status What it means How the status is set CREATE The shipper has created the shipment. The system sets this status when the shipper creates the waybill. COLLECT The parcel has been collected from the shipper's warehouse. Scan the parcel using Arrive Sort. INBOUND The parcel has been scanned into the hub on arrival or on return. 1. Use Arrive Sort for new parcels where applicable. 2. For parcels loaded from another hub to this hub, scan with Sort Common or Sort Delivery. 3. For returned parcels in DISPATCH or NOT_SIGNED, scan with Sort Common or Sort Delivery. LOAD The system has recorded the parcel for transfer to another hub. Scan the parcel using Quick Tpl - Load. See section 2-4 for the physical handover. DISPATCH The parcel has been assigned to a driver. Scan the parcel with Dispatch to assign it to the driver. OFD The driver has accepted the parcel and the system has marked it as out for delivery. The driver scans or confirms receipt of the parcel in Get Task. NOT_SIGNED The delivery attempt was unsuccessful. The driver selects the applicable failure reason on the Not Sign page. SIGN The system has recorded the parcel as delivered. The driver selects Signed in the driver app. RTO_CONFIRM The return parcel has been received into the original hub and is ready for return to the shipper. The return parcel is scanned into the original hub. RTO_SIGN The return has been signed off in the last-mile system. To verify handover back to the shipper, check the Outbound record in RTV Package. The status is recorded after an RTO_SIGN scan or generated by the applicable return receiving process. CANCELED The shipper has cancelled the shipment. The shipper submits a cancellation instruction. LOST The parcel has been marked as lost in the system. Once the loss is verified, an authorised user selects Mark Lost.","zh":"Puppis → Package → Real Time Query 查看包裹当前状态，状态含义见下表。 包裹状态 状态含义 如何进入该状态 CREATE 货主已建单。 货主侧创建运单后生成。 COLLECT 已从货主仓揽收包裹。 用 Arrive Sort 扫描包裹。 INBOUND 包裹已在站点完成到站或返仓入库。 1. 适用 Arrive Sort 的新件用该功能扫描。 2. 从其他站点已 Load 到本站的包裹，用 Sort Common 或 Sort Delivery 扫描。 3. 对处于 DISPATCH 或 NOT_SIGNED 状态的返仓包裹，用 Sort Common 或 Sort Delivery 扫描。 LOAD 系统已记录包裹转往另一站点。 用 Quick Tpl - Load 扫描包裹。 跨站转运的实物交接参见 2-4。 DISPATCH 包裹已分配给司机。 用 Dispatch 扫描分配给对应司机。 OFD 司机已领取包裹，系统将其标为出派。 司机在 Get Task 扫描或确认接收包裹。 NOT_SIGNED 本次派送未成功。 司机在 Not Sign 页面选择对应的派送失败原因。 SIGN 系统已记录包裹签收。 司机在司机 App 选 Signed。 RTO_CONFIRM 退运包裹已在原始 Hub 入库，准备退回货主。 退运包裹在原始 Hub 完成入库。 RTO_SIGN 末派侧退运已签收。 核实是否已退给货主时，查 RTV Package 的 Outbound 记录。 退运包裹完成 RTO_SIGN 扫描，或由对应退运入库流程生成该状态。 CANCELED 货主已取消运单。 货主侧发出取消指令。 LOST 包裹已在系统中标记为丢失。 核实丢失后，由有权限的人员用 Mark Lost 标记。"},"operation":"Puppis","review":null,"keyCheck":{"en":"","zh":""},"aliases":["shipment status","tracking status","package status","状态码","物流状态","包裹状态说明"]},{"id":"1-5/daily-monitor","kind":"topic","title":{"en":"Daily Monitor","zh":"Daily Monitor"},"ordinal":"","body":{"en":"\u003cp>\u003ccode>OFD Monitor-Hub\u003c/code>\u003c/p>\n","zh":"\u003cp>\u003ccode>OFD Monitor-Hub\u003c/code>\u003c/p>\n"},"summary":{"en":"OFD Monitor-Hub","zh":"OFD Monitor-Hub"},"plain":{"en":"OFD Monitor-Hub","zh":"OFD Monitor-Hub"},"operation":null,"review":null,"keyCheck":{"en":"","zh":""},"aliases":[]},{"id":"1-5/warehouse","kind":"topic","title":{"en":"Warehouse","zh":"Warehouse"},"ordinal":"","body":{"en":"\u003cp>\u003ccode>Reservation Order-Hub\u003c/code> · \u003ccode>Stock\u003c/code> · \u003ccode>Stock Count Plan\u003c/code>\u003c/p>\n","zh":"\u003cp>\u003ccode>Reservation Order-Hub\u003c/code> · \u003ccode>Stock\u003c/code> · \u003ccode>Stock Count Plan\u003c/code>\u003c/p>\n"},"summary":{"en":"Reservation Order-Hub · Stock · Stock Count Plan","zh":"Reservation Order-Hub · Stock · Stock Count Plan"},"plain":{"en":"Reservation Order-Hub · Stock · Stock Count Plan","zh":"Reservation Order-Hub · Stock · Stock Count Plan"},"operation":null,"review":null,"keyCheck":{"en":"","zh":""},"aliases":[]},{"id":"1-5/task","kind":"topic","title":{"en":"Task","zh":"Task"},"ordinal":"","body":{"en":"\u003cp>\u003ccode>OFD list-hub\u003c/code> · \u003ccode>Financial\u003c/code>\u003c/p>\n","zh":"\u003cp>\u003ccode>OFD list-hub\u003c/code> · \u003ccode>Financial\u003c/code>\u003c/p>\n"},"summary":{"en":"OFD list-hub · Financial","zh":"OFD list-hub · Financial"},"plain":{"en":"OFD list-hub · Financial","zh":"OFD list-hub · Financial"},"operation":null,"review":null,"keyCheck":{"en":"","zh":""},"aliases":[]},{"id":"1-5/transport","kind":"topic","title":{"en":"Transport","zh":"Transport"},"ordinal":"","body":{"en":"\u003cp>\u003ccode>Arrival Inbound-Hub\u003c/code> · \u003ccode>Container\u003c/code>\u003c/p>\n","zh":"\u003cp>\u003ccode>Arrival Inbound-Hub\u003c/code> · \u003ccode>Container\u003c/code>\u003c/p>\n"},"summary":{"en":"Arrival Inbound-Hub · Container","zh":"Arrival Inbound-Hub · Container"},"plain":{"en":"Arrival Inbound-Hub · Container","zh":"Arrival Inbound-Hub · Container"},"operation":null,"review":null,"keyCheck":{"en":"","zh":""},"aliases":[]},{"id":"1-5/basic","kind":"topic","title":{"en":"Basic","zh":"Basic"},"ordinal":"","body":{"en":"\u003cp>\u003ccode>Download Center\u003c/code> · \u003ccode>Employee\u003c/code>\u003c/p>\n","zh":"\u003cp>\u003ccode>Download Center\u003c/code> · \u003ccode>Employee\u003c/code>\u003c/p>\n"},"summary":{"en":"Download Center · Employee","zh":"Download Center · Employee"},"plain":{"en":"Download Center · Employee","zh":"Download Center · Employee"},"operation":null,"review":null,"keyCheck":{"en":"","zh":""},"aliases":[]}]},{"id":"2-1","title":{"en":"Receiving a Linehaul Shipment","zh":"干线到仓"},"part":"2","blocks":[{"id":"2-1","kind":"intro","title":{"en":"Receiving a Linehaul Shipment","zh":"干线到仓"},"ordinal":"","body":{"en":"","zh":""},"summary":{"en":"","zh":""},"plain":{"en":"","zh":""},"operation":null,"review":null,"keyCheck":{"en":"","zh":""},"aliases":["truck at depot","line haul arrival","linehaul receiving","干线到站"]},{"id":"2-1/step-1","kind":"step","title":{"en":"Check and Record the Truck Arrival on the PDA","zh":"到车核对与PDA到车操作"},"ordinal":"1","body":{"en":"\u003cp>When the linehaul truck arrives, verify the transport order, vehicle registration and actual box count.\u003c/p>\n\u003col>\n\u003cli>PDA → \u003ccode>Transport\u003c/code> → \u003ccode>To Arrival\u003c/code>\u003c/li>\n\u003cli>Enter the actual number of boxes received, then take and upload a photo.\u003c/li>\n\u003cli>Tap \u003ccode>Confirm Arrival\u003c/code> to complete the truck arrival record on the PDA.\u003c/li>\n\u003c/ol>\n","zh":"\u003cp>干线车辆到达后，核对运输单、车牌及实际箱数。\u003c/p>\n\u003col>\n\u003cli>PDA → \u003ccode>Transport\u003c/code> → \u003ccode>To Arrival\u003c/code>\u003c/li>\n\u003cli>填写实际到达的箱数（Box），拍照并上传。\u003c/li>\n\u003cli>点击 \u003ccode>Confirm Arrival\u003c/code>，完成 PDA 到车登记。\u003c/li>\n\u003c/ol>\n"},"summary":{"en":"When the linehaul truck arrives, verify the transport order, vehicle registration and actual box count.","zh":"干线车辆到达后，核对运输单、车牌及实际箱数。"},"plain":{"en":"When the linehaul truck arrives, verify the transport order, vehicle registration and actual box count. PDA → Transport → To Arrival Enter the actual number of boxes received, then take and upload a photo. Tap Confirm Arrival to complete the truck arrival record on the PDA.","zh":"干线车辆到达后，核对运输单、车牌及实际箱数。 PDA → Transport → To Arrival 填写实际到达的箱数（Box），拍照并上传。 点击 Confirm Arrival，完成 PDA 到车登记。"},"operation":"PDA","review":null,"keyCheck":{"en":"","zh":""},"aliases":["arrival inbound","to arrival","truck check in","到车登记"]},{"id":"2-1/step-2","kind":"step","title":{"en":"Unload and Open the Boxes","zh":"卸货与拆箱"},"ordinal":"2","body":{"en":"\u003cp>Unload the shipment into the warehouse, open the outer boxes and place the parcels in the shared staging area.\u003c/p>\n","zh":"\u003cp>将货物卸至仓内，拆开外包装箱，将包裹放到集中处理区。\u003c/p>\n"},"summary":{"en":"Unload the shipment into the warehouse, open the outer boxes and place the parcels in the shared staging area.","zh":"将货物卸至仓内，拆开外包装箱，将包裹放到集中处理区。"},"plain":{"en":"Unload the shipment into the warehouse, open the outer boxes and place the parcels in the shared staging area.","zh":"将货物卸至仓内，拆开外包装箱，将包裹放到集中处理区。"},"operation":null,"review":null,"keyCheck":{"en":"","zh":""},"aliases":[]},{"id":"2-1/step-3","kind":"step","title":{"en":"Scan and Sort the Parcels","zh":"扫描与分拣"},"ordinal":"3","body":{"en":"\u003col>\n\u003cli>PDA → \u003ccode>Sort Common\u003c/code>. Scan the parcel.\u003c/li>\n\u003cli>In this workflow, scanning records the parcel as \u003ccode>INBOUND\u003c/code> and the PDA shows what to do next.\u003c/li>\n\u003cli>For zone sorting, use \u003ccode>Sort Delivery\u003c/code> to check the parcel's Zone.\u003c/li>\n\u003cli>Place the parcel in the indicated zone.\u003c/li>\n\u003c/ol>\n","zh":"\u003col>\n\u003cli>PDA → \u003ccode>Sort Common\u003c/code>，扫描包裹。\u003c/li>\n\u003cli>在本流程中，扫描会自动记录包裹入库（\u003ccode>INBOUND\u003c/code>），PDA 会提示下一步该怎么操作。\u003c/li>\n\u003cli>如需按分区分拣，使用 \u003ccode>Sort Delivery\u003c/code> 查看包裹的 Zone。\u003c/li>\n\u003cli>将包裹放到对应区域。\u003c/li>\n\u003c/ol>\n"},"summary":{"en":"PDA → Sort Common. Scan the parcel.","zh":"PDA → Sort Common，扫描包裹。"},"plain":{"en":"PDA → Sort Common. Scan the parcel. In this workflow, scanning records the parcel as INBOUND and the PDA shows what to do next. For zone sorting, use Sort Delivery to check the parcel's Zone. Place the parcel in the indicated zone.","zh":"PDA → Sort Common，扫描包裹。 在本流程中，扫描会自动记录包裹入库（INBOUND），PDA 会提示下一步该怎么操作。 如需按分区分拣，使用 Sort Delivery 查看包裹的 Zone。 将包裹放到对应区域。"},"operation":"PDA","review":null,"keyCheck":{"en":"","zh":""},"aliases":[]},{"id":"2-1/step-4","kind":"step","title":{"en":"Confirm Inbound in the System","zh":"完成系统入库确认"},"ordinal":"4","body":{"en":"\u003col>\n\u003cli>Finish scanning and sorting the parcels physically received in this shipment.\u003c/li>\n\u003cli>Puppis → \u003ccode>Transport\u003c/code> → \u003ccode>Arrival Inbound-Hub\u003c/code>\u003c/li>\n\u003cli>Check the shipment. Once all parcels physically received have been scanned in, click \u003ccode>Inbound Confirm\u003c/code>.\u003c/li>\n\u003c/ol>\n\u003cp>\u003cstrong>Important\u003c/strong>\u003c/p>\n\u003cp>The system may show \u003ccode>Misrouted Inbound Count\u003c/code> or \u003ccode>Missing Package Count\u003c/code>. Confirm once all parcels physically received have been scanned in, then follow Step 5 for inbound discrepancies.\u003c/p>\n","zh":"\u003col>\n\u003cli>完成本批现场包裹的扫描入库和分拣。\u003c/li>\n\u003cli>Puppis → \u003ccode>Transport\u003c/code> → \u003ccode>Arrival Inbound-Hub\u003c/code>\u003c/li>\n\u003cli>核对本批到货，确认现场收到的包裹均已入库后，点击 \u003ccode>Inbound Confirm\u003c/code>。\u003c/li>\n\u003c/ol>\n\u003cp>\u003cstrong>本步注意\u003c/strong>\u003c/p>\n\u003cp>系统可能显示 \u003ccode>Misrouted Inbound Count\u003c/code>（错发入库件数）或 \u003ccode>Missing Package Count\u003c/code>（缺件数）。现场收到的包裹全部入库后即可确认，入库差异见步骤 5。\u003c/p>\n"},"summary":{"en":"Finish scanning and sorting the parcels physically received in this shipment.","zh":"完成本批现场包裹的扫描入库和分拣。"},"plain":{"en":"Finish scanning and sorting the parcels physically received in this shipment. Puppis → Transport → Arrival Inbound-Hub Check the shipment. Once all parcels physically received have been scanned in, click Inbound Confirm. Important The system may show Misrouted Inbound Count or Missing Package Count. Confirm once all parcels physically received have been scanned in, then follow Step 5 for inbound discrepancies.","zh":"完成本批现场包裹的扫描入库和分拣。 Puppis → Transport → Arrival Inbound-Hub 核对本批到货，确认现场收到的包裹均已入库后，点击 Inbound Confirm。 本步注意 系统可能显示 Misrouted Inbound Count（错发入库件数）或 Missing Package Count（缺件数）。现场收到的包裹全部入库后即可确认，入库差异见步骤 5。"},"operation":"Puppis","review":null,"keyCheck":{"en":"\u003cp>The system may show \u003ccode>Misrouted Inbound Count\u003c/code> or \u003ccode>Missing Package Count\u003c/code>. Confirm once all parcels physically received have been scanned in, then follow Step 5 for inbound discrepancies.\u003c/p>\n","zh":"\u003cp>系统可能显示 \u003ccode>Misrouted Inbound Count\u003c/code>（错发入库件数）或 \u003ccode>Missing Package Count\u003c/code>（缺件数）。现场收到的包裹全部入库后即可确认，入库差异见步骤 5。\u003c/p>\n"},"aliases":["inbound confirm","arrival inbound confirm","到货确认"]},{"id":"2-1/step-5","kind":"step","title":{"en":"Check for Inbound Discrepancies","zh":"检查入库差异"},"ordinal":"5","body":{"en":"\u003col>\n\u003cli>Puppis → \u003ccode>Work Order System\u003c/code> → \u003ccode>Package Exception Task (Dispatch)\u003c/code>\u003c/li>\n\u003cli>Select the relevant exception type in \u003ccode>WorkOrderBizType\u003c/code> and set \u003ccode>Create Date\u003c/code>.\u003c/li>\n\u003cli>Click \u003ccode>Query\u003c/code> to find work orders in \u003ccode>Processing\u003c/code> and follow up on each one.\u003c/li>\n\u003c/ol>\n\u003cp>Check for parcels flagged as \u003ccode>Load Miss Inbound\u003c/code>. Report any that remain flagged for a long time in the group chat and keep following them up.\u003c/p>\n","zh":"\u003col>\n\u003cli>Puppis → \u003ccode>Work Order System\u003c/code> → \u003ccode>Package Exception Task (Dispatch)\u003c/code>\u003c/li>\n\u003cli>在 \u003ccode>WorkOrderBizType\u003c/code> 选择要处理的异常类型，并设置 \u003ccode>Create Date\u003c/code>。\u003c/li>\n\u003cli>点击 \u003ccode>Query\u003c/code>，查看状态为 \u003ccode>Processing\u003c/code> 的工单，并逐单处理。\u003c/li>\n\u003c/ol>\n\u003cp>留意 \u003ccode>Load Miss Inbound\u003c/code> 包裹。长时间仍未入库的包裹，需要在群内汇报并继续跟进。\u003c/p>\n"},"summary":{"en":"Puppis → Work Order System → Package Exception Task (Dispatch)","zh":"Puppis → Work Order System → Package Exception Task (Dispatch)"},"plain":{"en":"Puppis → Work Order System → Package Exception Task (Dispatch) Select the relevant exception type in WorkOrderBizType and set Create Date. Click Query to find work orders in Processing and follow up on each one. Check for parcels flagged as Load Miss Inbound. Report any that remain flagged for a long time in the group chat and keep following them up.","zh":"Puppis → Work Order System → Package Exception Task (Dispatch) 在 WorkOrderBizType 选择要处理的异常类型，并设置 Create Date。 点击 Query，查看状态为 Processing 的工单，并逐单处理。 留意 Load Miss Inbound 包裹。长时间仍未入库的包裹，需要在群内汇报并继续跟进。"},"operation":"Puppis","review":{"en":"The draft does not specify how long a parcel must remain flagged before escalation.","zh":"长期仍未入库的具体上报时限待确认。"},"keyCheck":{"en":"\u003cp>Check for parcels flagged as \u003ccode>Load Miss Inbound\u003c/code>. Report any that remain flagged for a long time in the group chat and keep following them up.\u003c/p>\n","zh":"\u003cp>留意 \u003ccode>Load Miss Inbound\u003c/code> 包裹。长时间仍未入库的包裹，需要在群内汇报并继续跟进。\u003c/p>\n"},"aliases":["load miss inbound","missing from truck","truck missing parcel","linehaul discrepancy","干线漏件","到货少件"]}]},{"id":"2-2","title":{"en":"Parcel Delivery (Sorting and Dispatch)","zh":"包裹派送（分拣与dispatch）"},"part":"2","blocks":[{"id":"2-2","kind":"intro","title":{"en":"Parcel Delivery (Sorting and Dispatch)","zh":"包裹派送（分拣与dispatch）"},"ordinal":"","body":{"en":"","zh":""},"summary":{"en":"","zh":""},"plain":{"en":"","zh":""},"operation":null,"review":null,"keyCheck":{"en":"","zh":""},"aliases":[]},{"id":"2-2/step-1","kind":"step","title":{"en":"Assign Parcels to the Driver","zh":"仓库分配包裹"},"ordinal":"1","body":{"en":"\u003cp>The warehouse can assign parcels from one or more zones to the same driver using either method below.\u003c/p>\n\u003cp>\u003cstrong>Method 1. Find the driver and scan the parcels\u003c/strong>\u003c/p>\n\u003col>\n\u003cli>PDA → \u003ccode>Dispatch\u003c/code>\u003c/li>\n\u003cli>Search for and select the driver assigned to this batch.\u003c/li>\n\u003cli>Scan each parcel on the PDA and check that every parcel in the batch has been scanned.\u003c/li>\n\u003c/ol>\n\u003cp>\u003cstrong>Method 2. Scan the driver's QR code\u003c/strong>\u003c/p>\n\u003col>\n\u003cli>PDA → \u003ccode>Help Get Task\u003c/code>\u003c/li>\n\u003cli>Scan the driver's QR code, then scan and dispatch the parcels in the batch.\u003c/li>\n\u003c/ol>\n","zh":"\u003cp>仓库可将一个或多个 Zone 的包裹分配给同一名司机。有以下两种方式。\u003c/p>\n\u003cp>\u003cstrong>方式一　搜索司机后扫描包裹\u003c/strong>\u003c/p>\n\u003col>\n\u003cli>PDA → \u003ccode>Dispatch\u003c/code>\u003c/li>\n\u003cli>搜索并选中负责派送这批包裹的司机。\u003c/li>\n\u003cli>用 PDA 逐票扫描包裹，核对本批包裹是否全部扫到。\u003c/li>\n\u003c/ol>\n\u003cp>\u003cstrong>方式二　扫描司机二维码\u003c/strong>\u003c/p>\n\u003col>\n\u003cli>PDA → \u003ccode>Help Get Task\u003c/code>\u003c/li>\n\u003cli>扫描司机出示的二维码，再扫描并分配本批包裹。\u003c/li>\n\u003c/ol>\n"},"summary":{"en":"The warehouse can assign parcels from one or more zones to the same driver using either method below.","zh":"仓库可将一个或多个 Zone 的包裹分配给同一名司机。有以下两种方式。"},"plain":{"en":"The warehouse can assign parcels from one or more zones to the same driver using either method below. Method 1. Find the driver and scan the parcels PDA → Dispatch Search for and select the driver assigned to this batch. Scan each parcel on the PDA and check that every parcel in the batch has been scanned. Method 2. Scan the driver's QR code PDA → Help Get Task Scan the driver's QR code, then scan and dispatch the parcels in the batch.","zh":"仓库可将一个或多个 Zone 的包裹分配给同一名司机。有以下两种方式。 方式一 搜索司机后扫描包裹 PDA → Dispatch 搜索并选中负责派送这批包裹的司机。 用 PDA 逐票扫描包裹，核对本批包裹是否全部扫到。 方式二 扫描司机二维码 PDA → Help Get Task 扫描司机出示的二维码，再扫描并分配本批包裹。"},"operation":"PDA","review":null,"keyCheck":{"en":"","zh":""},"aliases":["dispatch","assign driver","give parcels to driver","分配司机"]},{"id":"2-2/step-2","kind":"step","title":{"en":"Accept the Task in the Driver App","zh":"司机接收任务"},"ordinal":"2","body":{"en":"\u003cp>\u003cstrong>Method 1. Accept a batch through Get Task\u003c/strong>\u003c/p>\n\u003col>\n\u003cli>Driver App → \u003ccode>Get Task\u003c/code>. \u003ccode>To Get\u003c/code> shows the parcel count after dispatch.\u003cbr />\nDrivers can also open \u003ccode>Get Task\u003c/code> directly from the notification.\u003c/li>\n\u003cli>Tap \u003ccode>Batch Get\u003c/code> to accept the batch.\u003c/li>\n\u003cli>Open \u003ccode>Got\u003c/code> and check that all parcels in the batch have been accepted.\u003c/li>\n\u003c/ol>\n\u003cp>\u003cstrong>Method 2. Accept parcels using Auth Code\u003c/strong>\u003c/p>\n\u003cp>Driver App → \u003ccode>Auth Code\u003c/code>. Show the QR code for the warehouse to scan in \u003ccode>Help Get Task\u003c/code>, then collect the parcels.\u003c/p>\n","zh":"\u003cp>\u003cstrong>方式一　通过 Get Task 批量领取\u003c/strong>\u003c/p>\n\u003col>\n\u003cli>司机 App → \u003ccode>Get Task\u003c/code>。Dispatch 后，\u003ccode>To Get\u003c/code> 显示待领取件数。\u003cbr />\n收到 \u003ccode>Get Task\u003c/code> 通知时，也可从通知直接进入。\u003c/li>\n\u003cli>点击 \u003ccode>Batch Get\u003c/code> 领取。\u003c/li>\n\u003cli>进入 \u003ccode>Got\u003c/code>，核对已领取的包裹是否齐全。\u003c/li>\n\u003c/ol>\n\u003cp>\u003cstrong>方式二　通过 Auth Code 领取\u003c/strong>\u003c/p>\n\u003cp>司机 App → \u003ccode>Auth Code\u003c/code>，出示二维码，仓库用 \u003ccode>Help Get Task\u003c/code> 扫描后领件。\u003c/p>\n"},"summary":{"en":"Method 1. Accept a batch through Get Task","zh":"方式一 通过 Get Task 批量领取"},"plain":{"en":"Method 1. Accept a batch through Get Task Driver App → Get Task. To Get shows the parcel count after dispatch. Drivers can also open Get Task directly from the notification. Tap Batch Get to accept the batch. Open Got and check that all parcels in the batch have been accepted. Method 2. Accept parcels using Auth Code Driver App → Auth Code. Show the QR code for the warehouse to scan in Help Get Task, then collect the parcels.","zh":"方式一 通过 Get Task 批量领取 司机 App → Get Task。Dispatch 后，To Get 显示待领取件数。 收到 Get Task 通知时，也可从通知直接进入。 点击 Batch Get 领取。 进入 Got，核对已领取的包裹是否齐全。 方式二 通过 Auth Code 领取 司机 App → Auth Code，出示二维码，仓库用 Help Get Task 扫描后领件。"},"operation":"Driver App","review":null,"keyCheck":{"en":"","zh":""},"aliases":["get task","driver accept load","driver pickup task","接任务"]},{"id":"2-2/step-3","kind":"step","title":{"en":"Start Delivering Parcels","zh":"司机开展派送"},"ordinal":"3","body":{"en":"\u003col>\n\u003cli>Driver App → \u003ccode>To Sign\u003c/code>. View parcels awaiting delivery.\u003c/li>\n\u003cli>Use \u003ccode>Same District\u003c/code> to filter parcels in the same district.\u003c/li>\n\u003cli>Open the parcel entry to send an OTP, call the customer or send a message using a template as needed.\u003c/li>\n\u003c/ol>\n","zh":"\u003col>\n\u003cli>司机 App → \u003ccode>To Sign\u003c/code>，查看待派送包裹。\u003c/li>\n\u003cli>需要查看同一区域的包裹时，使用 \u003ccode>Same District\u003c/code> 筛选。\u003c/li>\n\u003cli>进入对应包裹，按需要发送 OTP、一键拨打顾客电话，或发送模板消息。\u003c/li>\n\u003c/ol>\n"},"summary":{"en":"Driver App → To Sign. View parcels awaiting delivery.","zh":"司机 App → To Sign，查看待派送包裹。"},"plain":{"en":"Driver App → To Sign. View parcels awaiting delivery. Use Same District to filter parcels in the same district. Open the parcel entry to send an OTP, call the customer or send a message using a template as needed.","zh":"司机 App → To Sign，查看待派送包裹。 需要查看同一区域的包裹时，使用 Same District 筛选。 进入对应包裹，按需要发送 OTP、一键拨打顾客电话，或发送模板消息。"},"operation":"Driver App","review":null,"keyCheck":{"en":"","zh":""},"aliases":[]},{"id":"2-2/step-4","kind":"step","title":{"en":"Record Each Delivery Outcome","zh":"更新派送结果"},"ordinal":"4","body":{"en":"\u003cp>Open the parcel in the driver app and choose the confirmation method or record the failure reason based on what happened.\u003c/p>\n\u003cp>\u003cstrong>OTP confirmation\u003c/strong>\u003c/p>\n\u003col>\n\u003cli>Contact the customer for the OTP about 30 minutes before reaching the delivery address. You can also agree on a delivery time in advance and get the OTP when handing over the parcel in person.\u003c/li>\n\u003cli>Enter the OTP in the driver app to confirm delivery.\u003c/li>\n\u003c/ol>\n\u003cp>\u003cstrong>Proof of delivery confirmation\u003c/strong>\u003c/p>\n\u003col>\n\u003cli>Ask the customer to show an ID, driver's licence or the Temu order page. If they show the Temu page, check that its GE tracking number matches the parcel label.\u003c/li>\n\u003cli>Take one photo showing both the evidence presented by the customer and the parcel label.\u003c/li>\n\u003cli>Ask the warehouse to enable \u003ccode>Allow Proof\u003c/code>. Once enabled, use Proof in the driver app to confirm delivery.\u003c/li>\n\u003c/ol>\n\u003cp>\u003cstrong>Unsuccessful delivery\u003c/strong>\u003c/p>\n\u003cp>In the driver app, select the reason in \u003ccode>Not Sign\u003c/code> that matches what happened.\u003c/p>\n","zh":"\u003cp>在司机 App 中打开对应包裹，根据实际派送结果选择签收方式或记录失败原因。\u003c/p>\n\u003cp>\u003cstrong>OTP 签收\u003c/strong>\u003c/p>\n\u003col>\n\u003cli>预计到达收货地址前约 30 分钟联系顾客询问 OTP。也可以提前约定派送时间，在面对面交货时取得 OTP。\u003c/li>\n\u003cli>在司机 App 中填入 OTP，完成签收。\u003c/li>\n\u003c/ol>\n\u003cp>\u003cstrong>Proof 签收\u003c/strong>\u003c/p>\n\u003col>\n\u003cli>请顾客出示 ID、驾驶证或 Temu 下单页面。使用 Temu 页面时，核对其 GE 运单号与包裹面单一致。\u003c/li>\n\u003cli>将顾客出示的凭证与包裹面单拍进同一张照片。\u003c/li>\n\u003cli>向仓库申请 \u003ccode>Allow Proof\u003c/code>。仓库开启后，司机才可在 App 中使用 Proof 完成签收。\u003c/li>\n\u003c/ol>\n\u003cp>\u003cstrong>派送失败\u003c/strong>\u003c/p>\n\u003cp>在司机 App 的 \u003ccode>Not Sign\u003c/code> 中选择与实际情况相符的失败原因。\u003c/p>\n"},"summary":{"en":"Open the parcel in the driver app and choose the confirmation method or record the failure reason based on what happened.","zh":"在司机 App 中打开对应包裹，根据实际派送结果选择签收方式或记录失败原因。"},"plain":{"en":"Open the parcel in the driver app and choose the confirmation method or record the failure reason based on what happened. OTP confirmation Contact the customer for the OTP about 30 minutes before reaching the delivery address. You can also agree on a delivery time in advance and get the OTP when handing over the parcel in person. Enter the OTP in the driver app to confirm delivery. Proof of delivery confirmation Ask the customer to show an ID, driver's licence or the Temu order page. If they show the Temu page, check that its GE tracking number matches the parcel label. Take one photo showing both the evidence presented by the customer and the parcel label. Ask the warehouse to enable Allow Proof. Once enabled, use Proof in the driver app to confirm delivery. Unsuccessful delivery In the driver app, select the reason in Not Sign that matches what happened.","zh":"在司机 App 中打开对应包裹，根据实际派送结果选择签收方式或记录失败原因。 OTP 签收 预计到达收货地址前约 30 分钟联系顾客询问 OTP。也可以提前约定派送时间，在面对面交货时取得 OTP。 在司机 App 中填入 OTP，完成签收。 Proof 签收 请顾客出示 ID、驾驶证或 Temu 下单页面。使用 Temu 页面时，核对其 GE 运单号与包裹面单一致。 将顾客出示的凭证与包裹面单拍进同一张照片。 向仓库申请 Allow Proof。仓库开启后，司机才可在 App 中使用 Proof 完成签收。 派送失败 在司机 App 的 Not Sign 中选择与实际情况相符的失败原因。"},"operation":"Driver App","review":null,"keyCheck":{"en":"","zh":""},"aliases":[]},{"id":"2-2/failure-reasons","kind":"topic","title":{"en":"Delivery Failure Reasons and Next Actions for OFD Parcels","zh":"OFD 包裹派送失败原因与后续处理"},"ordinal":"","body":{"en":"\u003cp>When a delivery attempt fails, select the reason that matches what happened in \u003ccode>Not Sign\u003c/code>.\u003c/p>\n\u003cp>\u003cstrong>Customer Service (CS)\u003c/strong>\u003c/p>\n\u003cp>Under the current hub guidance, selecting any of the following reasons automatically starts the Customer Service workflow.\u003c/p>\n\u003cdiv class=\"table-scroll\" tabindex=\"0\" role=\"region\" aria-label=\"Table\">\u003ctable>\n\u003cthead>\n\u003ctr>\n  \u003cth>Reason in the driver app\u003c/th>\n  \u003cth>Meaning\u003c/th>\n\u003c/tr>\n\u003c/thead>\n\u003ctbody>\n\u003ctr>\n  \u003ctd>\u003ccode>02_Blocked\u003c/code>\u003c/td>\n  \u003ctd>Contact was blocked.\u003c/td>\n\u003c/tr>\n\u003ctr>\n  \u003ctd>\u003ccode>05_Cancelled\u003c/code>\u003c/td>\n  \u003ctd>The customer cancelled.\u003c/td>\n\u003c/tr>\n\u003ctr>\n  \u003ctd>\u003ccode>07_Want to open the order\u003c/code>\u003c/td>\n  \u003ctd>The customer wants to open the parcel.\u003c/td>\n\u003c/tr>\n\u003ctr>\n  \u003ctd>\u003ccode>12_Wrong Mobile\u003c/code>\u003c/td>\n  \u003ctd>The customer's mobile number is incorrect.\u003c/td>\n\u003c/tr>\n\u003ctr>\n  \u003ctd>\u003ccode>18_Can not enter address\u003c/code>\u003c/td>\n  \u003ctd>The driver cannot access the delivery address.\u003c/td>\n\u003c/tr>\n\u003ctr>\n  \u003ctd>\u003ccode>30_Cancelled-Refuse to PayVAT/tariffs\u003c/code>\u003c/td>\n  \u003ctd>The delivery was cancelled because the customer refused to pay VAT or duties.\u003c/td>\n\u003c/tr>\n\u003c/tbody>\n\u003c/table>\u003c/div>\n\u003cp>\u003cstrong>No answer or delivery deferred\u003c/strong>\u003c/p>\n\u003cul>\n\u003cli>If there is no answer, bring the parcel back to the warehouse, scan it in, sort it again and send it out for delivery.\u003cbr />\nUnder the current hub guidance, five consecutive OFD attempts ending in \u003ccode>No Answer\u003c/code> trigger the Customer Service workflow.\u003c/li>\n\u003cli>For these two reasons, scan the returned parcel into the warehouse, sort it again and arrange the next delivery attempt.\u003cbr />\nThese two reasons have no retry limit of their own, so keep arranging delivery while the parcel is still eligible, until the customer receives it.\u003cbr />\nSee section \u003ca href=\"#2-3\">2-3\u003c/a> for storing and picking scheduled parcels and section \u003ca href=\"#2-5\">2-5\u003c/a> for automatic RTO.\u003c/li>\n\u003c/ul>\n\u003cp>\u003cstrong>RTO or transfer after an address change\u003c/strong>\u003c/p>\n\u003cul>\n\u003cli>Selecting \u003ccode>Opened by receipent\u003c/code>, \u003ccode>Damaged\u003c/code> or \u003ccode>Wrong Address → Out of Serviced Area\u003c/code> starts the RTO workflow.\u003c/li>\n\u003cli>Selecting \u003ccode>Wrong Address → Wrong City\u003c/code> starts the address correction and transfer process.\u003cbr />\nAfter obtaining and updating the correct address in the system, complete Load and transfer the parcel to the correct hub so it can scan the parcel in and arrange delivery.\u003c/li>\n\u003c/ul>\n","zh":"\u003cp>司机派送失败时，在 \u003ccode>Not Sign\u003c/code> 按实际情况选择对应原因。\u003c/p>\n\u003cp>\u003cstrong>进入客服流程\u003c/strong>\u003c/p>\n\u003cp>按当前站点操作口径，选择下列任一原因时，系统会自动触发客服流程。\u003c/p>\n\u003cdiv class=\"table-scroll\" tabindex=\"0\" role=\"region\" aria-label=\"Table\">\u003ctable>\n\u003cthead>\n\u003ctr>\n  \u003cth>司机 App 原因\u003c/th>\n  \u003cth>含义\u003c/th>\n\u003c/tr>\n\u003c/thead>\n\u003ctbody>\n\u003ctr>\n  \u003ctd>\u003ccode>02_Blocked\u003c/code>\u003c/td>\n  \u003ctd>联系被屏蔽。\u003c/td>\n\u003c/tr>\n\u003ctr>\n  \u003ctd>\u003ccode>05_Cancelled\u003c/code>\u003c/td>\n  \u003ctd>顾客取消。\u003c/td>\n\u003c/tr>\n\u003ctr>\n  \u003ctd>\u003ccode>07_Want to open the order\u003c/code>\u003c/td>\n  \u003ctd>顾客要求开包验货。\u003c/td>\n\u003c/tr>\n\u003ctr>\n  \u003ctd>\u003ccode>12_Wrong Mobile\u003c/code>\u003c/td>\n  \u003ctd>顾客手机号码有误。\u003c/td>\n\u003c/tr>\n\u003ctr>\n  \u003ctd>\u003ccode>18_Can not enter address\u003c/code>\u003c/td>\n  \u003ctd>无法进入收货地址。\u003c/td>\n\u003c/tr>\n\u003ctr>\n  \u003ctd>\u003ccode>30_Cancelled-Refuse to PayVAT/tariffs\u003c/code>\u003c/td>\n  \u003ctd>顾客拒付增值税或关税，取消派送。\u003c/td>\n\u003c/tr>\n\u003c/tbody>\n\u003c/table>\u003c/div>\n\u003cp>\u003cstrong>无人接听或暂未派送\u003c/strong>\u003c/p>\n\u003cul>\n\u003cli>\u003cstrong>\u003ccode>No Answer\u003c/code>\u003c/strong> 无人接听时，将包裹带回仓库，重新 Inbound、Sort，再安排 OFD。\u003cbr />\n按当前站点操作口径，连续 5 次 OFD 均为 \u003ccode>No Answer\u003c/code> 时会触发客服流程。\u003c/li>\n\u003cli>\u003cstrong>\u003ccode>Future Delivery\u003c/code> 或 \u003ccode>No Time for Deliver/Collect\u003c/code>\u003c/strong> 包裹回仓后重新 Inbound、Sort，再安排 OFD。\u003cbr />\n这两种原因本身不设重派次数上限，包裹仍符合派送条件时，继续安排派送直至签收。\u003cbr />\n预约件的上下架参见 \u003ca href=\"#2-3\">2-3\u003c/a>，长期未签收的自动退运参见 \u003ca href=\"#2-5\">2-5\u003c/a>。\u003c/li>\n\u003c/ul>\n\u003cp>\u003cstrong>触发退运或改址转仓\u003c/strong>\u003c/p>\n\u003cul>\n\u003cli>\u003cstrong>触发 RTO\u003c/strong> 选择 \u003ccode>Opened by receipent\u003c/code>（收件人已开包）、\u003ccode>Damaged\u003c/code>（破损）或 \u003ccode>Wrong Address → Out of Serviced Area\u003c/code>（地址超出服务范围）后，进入 RTO 流程。\u003c/li>\n\u003cli>\u003cstrong>\u003ccode>Wrong Address → Wrong City\u003c/code>\u003c/strong> 进入改址转仓流程。\u003cbr />\n拿到正确地址并在系统里更新后，做 Load 并把包裹转到对应 Hub，由目的 Hub 重新 Inbound 后安排派送。\u003c/li>\n\u003c/ul>\n"},"summary":{"en":"When a delivery attempt fails, select the reason that matches what happened in Not Sign.","zh":"司机派送失败时，在 Not Sign 按实际情况选择对应原因。"},"plain":{"en":"When a delivery attempt fails, select the reason that matches what happened in Not Sign. Customer Service (CS) Under the current hub guidance, selecting any of the following reasons automatically starts the Customer Service workflow. Reason in the driver app Meaning 02_Blocked Contact was blocked. 05_Cancelled The customer cancelled. 07_Want to open the order The customer wants to open the parcel. 12_Wrong Mobile The customer's mobile number is incorrect. 18_Can not enter address The driver cannot access the delivery address. 30_Cancelled-Refuse to PayVAT/tariffs The delivery was cancelled because the customer refused to pay VAT or duties. No answer or delivery deferred If there is no answer, bring the parcel back to the warehouse, scan it in, sort it again and send it out for delivery. Under the current hub guidance, five consecutive OFD attempts ending in No Answer trigger the Customer Service workflow. For these two reasons, scan the returned parcel into the warehouse, sort it again and arrange the next delivery attempt. These two reasons have no retry limit of their own, so keep arranging delivery while the parcel is still eligible, until the customer receives it. See section 2-3 for storing and picking scheduled parcels and section 2-5 for automatic RTO. RTO or transfer after an address change Selecting Opened by receipent, Damaged or Wrong Address → Out of Serviced Area starts the RTO workflow. Selecting Wrong Address → Wrong City starts the address correction and transfer process. After obtaining and updating the correct address in the system, complete Load and transfer the parcel to the correct hub so it can scan the parcel in and arrange delivery.","zh":"司机派送失败时，在 Not Sign 按实际情况选择对应原因。 进入客服流程 按当前站点操作口径，选择下列任一原因时，系统会自动触发客服流程。 司机 App 原因 含义 02_Blocked 联系被屏蔽。 05_Cancelled 顾客取消。 07_Want to open the order 顾客要求开包验货。 12_Wrong Mobile 顾客手机号码有误。 18_Can not enter address 无法进入收货地址。 30_Cancelled-Refuse to PayVAT/tariffs 顾客拒付增值税或关税，取消派送。 无人接听或暂未派送 No Answer 无人接听时，将包裹带回仓库，重新 Inbound、Sort，再安排 OFD。 按当前站点操作口径，连续 5 次 OFD 均为 No Answer 时会触发客服流程。 Future Delivery 或 No Time for Deliver/Collect 包裹回仓后重新 Inbound、Sort，再安排 OFD。 这两种原因本身不设重派次数上限，包裹仍符合派送条件时，继续安排派送直至签收。 预约件的上下架参见 2-3，长期未签收的自动退运参见 2-5。 触发退运或改址转仓 触发 RTO 选择 Opened by receipent（收件人已开包）、Damaged（破损）或 Wrong Address → Out of Serviced Area（地址超出服务范围）后，进入 RTO 流程。 Wrong Address → Wrong City 进入改址转仓流程。 拿到正确地址并在系统里更新后，做 Load 并把包裹转到对应 Hub，由目的 Hub 重新 Inbound 后安排派送。"},"operation":"Driver App","review":{"en":"Check the current app labels, the consecutive No Answer count and the VAT/duties trigger against an actual case.","zh":"当前 App 原因名称、No Answer 连续次数和拒付 VAT／关税触发规则待用实际运单核对。"},"keyCheck":{"en":"","zh":""},"aliases":["customer not answering","no answer","not signed","failed delivery","wrong city","拒签","无人接听","派送失败"]},{"id":"2-2/step-5","kind":"step","title":{"en":"Bring Undelivered Parcels Back","zh":"未签收包裹返仓"},"ordinal":"5","body":{"en":"\u003cp>When the delivery run ends, the driver returns undelivered parcels to the warehouse.\u003c/p>\n","zh":"\u003cp>司机完成本次任务后，将未成功签收的包裹送回仓库。\u003c/p>\n"},"summary":{"en":"When the delivery run ends, the driver returns undelivered parcels to the warehouse.","zh":"司机完成本次任务后，将未成功签收的包裹送回仓库。"},"plain":{"en":"When the delivery run ends, the driver returns undelivered parcels to the warehouse.","zh":"司机完成本次任务后，将未成功签收的包裹送回仓库。"},"operation":null,"review":null,"keyCheck":{"en":"","zh":""},"aliases":["return to hub","failed parcels back to warehouse","司机退件"]},{"id":"2-2/step-6","kind":"step","title":{"en":"Scan Returned Parcels Back into Stock","zh":"返仓入库"},"ordinal":"6","body":{"en":"\u003cp>Warehouse staff scan the returned parcels using Inbound and hold them for the next Dispatch.\u003c/p>\n","zh":"\u003cp>仓库对退回的包裹重新操作 Inbound，等待后续 Dispatch。\u003c/p>\n"},"summary":{"en":"Warehouse staff scan the returned parcels using Inbound and hold them for the next Dispatch.","zh":"仓库对退回的包裹重新操作 Inbound，等待后续 Dispatch。"},"plain":{"en":"Warehouse staff scan the returned parcels using Inbound and hold them for the next Dispatch.","zh":"仓库对退回的包裹重新操作 Inbound，等待后续 Dispatch。"},"operation":"PDA","review":null,"keyCheck":{"en":"","zh":""},"aliases":[]},{"id":"2-2/delivery-follow-up-and-outcomes","kind":"topic","title":{"en":"Delivery Follow-up and Outcomes","zh":"派送跟进与签收注意事项"},"ordinal":"","body":{"en":"\u003cp>\u003cstrong>Delivery progress\u003c/strong>\u003c/p>\n\u003cp>Once drivers are out for delivery, the supervisor checks each driver's delivered parcel count, failed delivery count and reasons, and the number of parcels due back.\u003cbr />\nFollow up with drivers as needed, and drivers can contact the hub for help with any issues.\u003c/p>\n\u003cp>\u003cstrong>Driver app\u003c/strong>\u003c/p>\n\u003cp>Drivers need to install the driver app to view parcel details, accept tasks, record delivery outcomes, send OTPs and call customers directly from the app.\u003c/p>\n\u003cp>\u003ca href=\"https://s3.gfscdn.com/assets/inner-driver-app/apk/0.2.9/app-v29-gfs-release.apk\">Android（APK）\u003c/a> · \u003ca href=\"https://testflight.apple.com/join/fkibdDGf\">iOS（TestFlight）\u003c/a>\u003c/p>\n\u003cp>\u003cstrong>Timely returns\u003c/strong>\u003c/p>\n\u003cp>At the end of the delivery run, drivers should promptly bring back undelivered parcels, including parcels they could not deliver for reasons beyond their control, so the hub can plan the next delivery attempt.\u003c/p>\n","zh":"\u003cp>\u003cstrong>派送进度\u003c/strong>\u003c/p>\n\u003cp>司机出派后，主管在系统中按司机查看已签收件数、派送失败件数及原因，以及需要退回的件数。\u003cbr />\n根据情况主动联系司机跟进，司机遇到问题也可以联系站点寻求协助。\u003c/p>\n\u003cp>\u003cstrong>司机 App\u003c/strong>\u003c/p>\n\u003cp>司机需要安装司机 App，用于查看包裹信息、接收任务、更新派送结果、发送 OTP，以及在 App 内直接拨打顾客电话。\u003c/p>\n\u003cp>\u003ca href=\"https://s3.gfscdn.com/assets/inner-driver-app/apk/0.2.9/app-v29-gfs-release.apk\">Android（APK）\u003c/a> · \u003ca href=\"https://testflight.apple.com/join/fkibdDGf\">iOS（TestFlight）\u003c/a>\u003c/p>\n\u003cp>\u003cstrong>及时返仓\u003c/strong>\u003c/p>\n\u003cp>司机结束本次派送后，应及时将未签收或因客观原因未能完成派送的包裹带回仓库，以便站点安排下一次出派。\u003c/p>\n"},"summary":{"en":"Delivery progress","zh":"派送进度"},"plain":{"en":"Delivery progress Once drivers are out for delivery, the supervisor checks each driver's delivered parcel count, failed delivery count and reasons, and the number of parcels due back. Follow up with drivers as needed, and drivers can contact the hub for help with any issues. Driver app Drivers need to install the driver app to view parcel details, accept tasks, record delivery outcomes, send OTPs and call customers directly from the app. Android（APK） · iOS（TestFlight） Timely returns At the end of the delivery run, drivers should promptly bring back undelivered parcels, including parcels they could not deliver for reasons beyond their control, so the hub can plan the next delivery attempt.","zh":"派送进度 司机出派后，主管在系统中按司机查看已签收件数、派送失败件数及原因，以及需要退回的件数。 根据情况主动联系司机跟进，司机遇到问题也可以联系站点寻求协助。 司机 App 司机需要安装司机 App，用于查看包裹信息、接收任务、更新派送结果、发送 OTP，以及在 App 内直接拨打顾客电话。 Android（APK） · iOS（TestFlight） 及时返仓 司机结束本次派送后，应及时将未签收或因客观原因未能完成派送的包裹带回仓库，以便站点安排下一次出派。"},"operation":null,"review":null,"keyCheck":{"en":"","zh":""},"aliases":[]}]},{"id":"2-3","title":{"en":"Storing and Picking Parcels (Move & Pick)","zh":"包裹上下架（Move & Pick）"},"part":"2","blocks":[{"id":"2-3","kind":"intro","title":{"en":"Storing and Picking Parcels (Move & Pick)","zh":"包裹上下架（Move & Pick）"},"ordinal":"","body":{"en":"","zh":""},"summary":{"en":"","zh":""},"plain":{"en":"","zh":""},"operation":null,"review":null,"keyCheck":{"en":"","zh":""},"aliases":["put away","shelf storage","move to location","pick task","预约件"]},{"id":"2-3/when-this-applies","kind":"topic","title":{"en":"When This Applies","zh":"适用情况"},"ordinal":"","body":{"en":"\u003cp>In the following situations, follow the PDA's Move to Location prompt to place the parcel on a shelf or in a storage location.\u003c/p>\n\u003cul>\n\u003cli>The customer books a delivery date.\u003c/li>\n\u003cli>The customer books another delivery date after an unsuccessful delivery attempt.\u003c/li>\n\u003cli>The customer cannot be reached for now and further contact is needed.\u003c/li>\n\u003cli>An RTO parcel is waiting for linehaul transfer.\u003c/li>\n\u003c/ul>\n","zh":"\u003cp>通常在以下情况下，需要根据 PDA 提示将包裹 Move to Location，上架至货架或库位：\u003c/p>\n\u003cul>\n\u003cli>顾客主动预约派送日期。\u003c/li>\n\u003cli>司机派送失败后，顾客重新预约派送日期。\u003c/li>\n\u003cli>暂时联系不上顾客，需要等待进一步联系结果。\u003c/li>\n\u003cli>RTO 包裹等待干线转运。\u003c/li>\n\u003c/ul>\n"},"summary":{"en":"In the following situations, follow the PDA's Move to Location prompt to place the parcel on a shelf or in a storage location.","zh":"通常在以下情况下，需要根据 PDA 提示将包裹 Move to Location，上架至货架或库位："},"plain":{"en":"In the following situations, follow the PDA's Move to Location prompt to place the parcel on a shelf or in a storage location. The customer books a delivery date. The customer books another delivery date after an unsuccessful delivery attempt. The customer cannot be reached for now and further contact is needed. An RTO parcel is waiting for linehaul transfer.","zh":"通常在以下情况下，需要根据 PDA 提示将包裹 Move to Location，上架至货架或库位： 顾客主动预约派送日期。 司机派送失败后，顾客重新预约派送日期。 暂时联系不上顾客，需要等待进一步联系结果。 RTO 包裹等待干线转运。"},"operation":null,"review":null,"keyCheck":{"en":"","zh":""},"aliases":[]},{"id":"2-3/step-1","kind":"step","title":{"en":"Store the Parcel as Directed","zh":"根据扫描提示上架"},"ordinal":"1","body":{"en":"\u003cp>Scan the parcel.\u003cbr />\nIf the PDA shows Move to Location, put the parcel on the indicated shelf or in the indicated storage location.\u003c/p>\n","zh":"\u003cp>扫描包裹。\u003cbr />\n如果 PDA 提示 Move to Location，将包裹上架至对应货架或库位。\u003c/p>\n"},"summary":{"en":"Scan the parcel.","zh":"扫描包裹。"},"plain":{"en":"Scan the parcel. If the PDA shows Move to Location, put the parcel on the indicated shelf or in the indicated storage location.","zh":"扫描包裹。 如果 PDA 提示 Move to Location，将包裹上架至对应货架或库位。"},"operation":"PDA","review":null,"keyCheck":{"en":"","zh":""},"aliases":[]},{"id":"2-3/step-2","kind":"step","title":{"en":"Create a Pick Task When the Parcel Is Ready","zh":"根据包裹情况创建 Pick Task"},"ordinal":"2","body":{"en":"\u003cdiv class=\"table-scroll\" tabindex=\"0\" role=\"region\" aria-label=\"Table\">\u003ctable>\n\u003cthead>\n\u003ctr>\n  \u003cth>Parcel situation\u003c/th>\n  \u003cth>When to create a Pick Task\u003c/th>\n\u003c/tr>\n\u003c/thead>\n\u003ctbody>\n\u003ctr>\n  \u003ctd>Scheduled delivery\u003c/td>\n  \u003ctd>Create a Pick Task in the last-mile system on the scheduled delivery date.\u003c/td>\n\u003c/tr>\n\u003ctr>\n  \u003ctd>RTO awaiting transfer\u003c/td>\n  \u003ctd>Create a Pick Task in the last-mile system on the day the linehaul truck arrives.\u003c/td>\n\u003c/tr>\n\u003ctr>\n  \u003ctd>Customer cannot be reached for now\u003c/td>\n  \u003ctd>Keep the parcel on the shelf for now.\u003cbr>Once the customer gets in touch or Customer Service reaches them, create a Pick Task according to the confirmed arrangement.\u003c/td>\n\u003c/tr>\n\u003c/tbody>\n\u003c/table>\u003c/div>\n\u003col>\n\u003cli>Puppis → \u003ccode>Warehouse\u003c/code> → \u003ccode>Reservation Order-Hub\u003c/code>\u003c/li>\n\u003cli>Select the date and tick the tracking numbers that need a Pick Task.\u003c/li>\n\u003cli>Click \u003ccode>Pick\u003c/code>.\u003c/li>\n\u003c/ol>\n","zh":"\u003cdiv class=\"table-scroll\" tabindex=\"0\" role=\"region\" aria-label=\"Table\">\u003ctable>\n\u003cthead>\n\u003ctr>\n  \u003cth>包裹情况\u003c/th>\n  \u003cth>何时创建 Pick Task\u003c/th>\n\u003c/tr>\n\u003c/thead>\n\u003ctbody>\n\u003ctr>\n  \u003ctd>预约派送\u003c/td>\n  \u003ctd>在预约日期当天，于末派系统创建 Pick Task。\u003c/td>\n\u003c/tr>\n\u003ctr>\n  \u003ctd>RTO 等待转运\u003c/td>\n  \u003ctd>在干线到达当天，于末派系统创建 Pick Task。\u003c/td>\n\u003c/tr>\n\u003ctr>\n  \u003ctd>暂时联系不上顾客\u003c/td>\n  \u003ctd>先将包裹留在货架。\u003cbr>待顾客主动联系，或 CS 联系到顾客后，根据确认的处理安排创建 Pick Task。\u003c/td>\n\u003c/tr>\n\u003c/tbody>\n\u003c/table>\u003c/div>\n\u003col>\n\u003cli>Puppis → \u003ccode>Warehouse\u003c/code> → \u003ccode>Reservation Order-Hub\u003c/code>\u003c/li>\n\u003cli>选择日期，勾选需要创建 Pick Task 的运单号。\u003c/li>\n\u003cli>点击 \u003ccode>Pick\u003c/code>。\u003c/li>\n\u003c/ol>\n"},"summary":{"en":"| Parcel situation | When to create a Pick Task |","zh":"| 包裹情况 | 何时创建 Pick Task |"},"plain":{"en":"Parcel situation When to create a Pick Task Scheduled delivery Create a Pick Task in the last-mile system on the scheduled delivery date. RTO awaiting transfer Create a Pick Task in the last-mile system on the day the linehaul truck arrives. Customer cannot be reached for now Keep the parcel on the shelf for now. Once the customer gets in touch or Customer Service reaches them, create a Pick Task according to the confirmed arrangement. Puppis → Warehouse → Reservation Order-Hub Select the date and tick the tracking numbers that need a Pick Task. Click Pick.","zh":"包裹情况 何时创建 Pick Task 预约派送 在预约日期当天，于末派系统创建 Pick Task。 RTO 等待转运 在干线到达当天，于末派系统创建 Pick Task。 暂时联系不上顾客 先将包裹留在货架。 待顾客主动联系，或 CS 联系到顾客后，根据确认的处理安排创建 Pick Task。 Puppis → Warehouse → Reservation Order-Hub 选择日期，勾选需要创建 Pick Task 的运单号。 点击 Pick。"},"operation":"Puppis","review":null,"keyCheck":{"en":"","zh":""},"aliases":[]},{"id":"2-3/step-3","kind":"step","title":{"en":"Pick the Parcel","zh":"执行下架任务"},"ordinal":"3","body":{"en":"\u003col>\n\u003cli>PDA → \u003ccode>Pick\u003c/code>\u003c/li>\n\u003cli>Select the package type. The hub usually uses \u003ccode>To Sign Package\u003c/code> or \u003ccode>RTO Package\u003c/code>.\u003c/li>\n\u003cli>Scan the parcel and take it off the shelf or out of its storage location.\u003c/li>\n\u003c/ol>\n","zh":"\u003col>\n\u003cli>PDA → \u003ccode>Pick\u003c/code>\u003c/li>\n\u003cli>选择对应类型。站点通常使用 \u003ccode>To Sign Package\u003c/code> 或 \u003ccode>RTO Package\u003c/code>。\u003c/li>\n\u003cli>扫描包裹，从对应货架或库位取下。\u003c/li>\n\u003c/ol>\n"},"summary":{"en":"PDA → Pick","zh":"PDA → Pick"},"plain":{"en":"PDA → Pick Select the package type. The hub usually uses To Sign Package or RTO Package. Scan the parcel and take it off the shelf or out of its storage location.","zh":"PDA → Pick 选择对应类型。站点通常使用 To Sign Package 或 RTO Package。 扫描包裹，从对应货架或库位取下。"},"operation":"PDA","review":null,"keyCheck":{"en":"","zh":""},"aliases":[]},{"id":"2-3/step-4","kind":"step","title":{"en":"Rescan the Parcel and Follow the PDA","zh":"重新扫描并执行下一步"},"ordinal":"4","body":{"en":"\u003cp>PDA → \u003ccode>Sort Common\u003c/code>. Rescan the parcel and follow the prompt.\u003c/p>\n\u003cul>\n\u003cli>\u003cstrong>To Sign parcels.\u003c/strong> Scan with \u003ccode>Sort Delivery\u003c/code>, place in the correct zone and hold for dispatch.\u003c/li>\n\u003cli>\u003cstrong>RTO parcels.\u003c/strong> Scan with \u003ccode>Sort Load\u003c/code>, pack into boxes and hold for linehaul transfer to JHB.\u003c/li>\n\u003c/ul>\n","zh":"\u003cp>PDA → \u003ccode>Sort Common\u003c/code>，重新扫描下架包裹，按提示处理。\u003c/p>\n\u003cul>\n\u003cli>\u003cstrong>To Sign 包裹\u003c/strong>　用 \u003ccode>Sort Delivery\u003c/code> 扫描，放到对应 Zone，等待 Dispatch。\u003c/li>\n\u003cli>\u003cstrong>RTO 包裹\u003c/strong>　用 \u003ccode>Sort Load\u003c/code> 扫描，装箱打包，等待干线转运至 JHB。\u003c/li>\n\u003c/ul>\n"},"summary":{"en":"PDA → Sort Common. Rescan the parcel and follow the prompt.","zh":"PDA → Sort Common，重新扫描下架包裹，按提示处理。"},"plain":{"en":"PDA → Sort Common. Rescan the parcel and follow the prompt. To Sign parcels. Scan with Sort Delivery, place in the correct zone and hold for dispatch. RTO parcels. Scan with Sort Load, pack into boxes and hold for linehaul transfer to JHB.","zh":"PDA → Sort Common，重新扫描下架包裹，按提示处理。 To Sign 包裹 用 Sort Delivery 扫描，放到对应 Zone，等待 Dispatch。 RTO 包裹 用 Sort Load 扫描，装箱打包，等待干线转运至 JHB。"},"operation":"PDA","review":null,"keyCheck":{"en":"","zh":""},"aliases":[]},{"id":"2-3/notes","kind":"topic","title":{"en":"Notes","zh":"注意事项"},"ordinal":"","body":{"en":"\u003cul>\n\u003cli>After completing Pick, follow the scan instructions and perform any required Dispatch or Load separately.\u003c/li>\n\u003cli>Schedule Pick Tasks according to the timing for each case: scheduled delivery, RTO or pending customer contact.\u003c/li>\n\u003c/ul>\n","zh":"\u003cul>\n\u003cli>Pick 完成后仍需继续按扫描指引处理；下架不等于已经完成 Dispatch 或 Load。\u003c/li>\n\u003cli>预约派送、RTO 和等待客户联系的包裹，创建 Pick Task 的时点不同，应分别安排。\u003c/li>\n\u003c/ul>\n"},"summary":{"en":"After completing Pick, follow the scan instructions and perform any required Dispatch or Load separately.","zh":"Pick 完成后仍需继续按扫描指引处理；下架不等于已经完成 Dispatch 或 Load。"},"plain":{"en":"After completing Pick, follow the scan instructions and perform any required Dispatch or Load separately. Schedule Pick Tasks according to the timing for each case: scheduled delivery, RTO or pending customer contact.","zh":"Pick 完成后仍需继续按扫描指引处理；下架不等于已经完成 Dispatch 或 Load。 预约派送、RTO 和等待客户联系的包裹，创建 Pick Task 的时点不同，应分别安排。"},"operation":null,"review":null,"keyCheck":{"en":"","zh":""},"aliases":[]}]},{"id":"2-4","title":{"en":"Transfers Between Hubs (Load)","zh":"跨站转运（Load）"},"part":"2","blocks":[{"id":"2-4","kind":"intro","title":{"en":"Transfers Between Hubs (Load)","zh":"跨站转运（Load）"},"ordinal":"","body":{"en":"","zh":""},"summary":{"en":"","zh":""},"plain":{"en":"","zh":""},"operation":null,"review":null,"keyCheck":{"en":"","zh":""},"aliases":["wrong hub","misroute","cross hub","interhub transfer","串线","错站"]},{"id":"2-4/when-this-applies","kind":"topic","title":{"en":"When This Applies","zh":"适用情况"},"ordinal":"","body":{"en":"\u003cp>When a parcel is transferred between hubs, complete the Load scan.\u003cbr />\nA missed scan may generate a \u003ccode>LOAD_EXCEPTION\u003c/code> entry in the tracking log.\u003c/p>\n\u003cp>Common situations include the following.\u003c/p>\n\u003cul>\n\u003cli>\u003cstrong>Wrong destination from the sorting centre.\u003c/strong> A parcel for Pretoria may be sent from the JHB sorting centre to Bloemfontein and must then be transferred to the correct hub.\u003c/li>\n\u003cli>\u003cstrong>Transfer after an address change.\u003c/strong> The actual delivery address is outside the current hub's service area.\u003cbr />\nThis may be identified before the parcel goes out for delivery or confirmed by the customer during the delivery run.\u003c/li>\n\u003cli>\u003cstrong>RTO to Johannesburg.\u003c/strong> Arrange linehaul transfer for RTO parcels that need to go back to JHB.\u003c/li>\n\u003c/ul>\n","zh":"\u003cp>包裹从一个站点转运到另一个站点时，需要完成 Load 扫描。\u003cbr />\n漏扫可能产生 \u003ccode>LOAD_EXCEPTION\u003c/code> 日志。\u003c/p>\n\u003cp>常见场景包括：\u003c/p>\n\u003cul>\n\u003cli>\u003cstrong>分拨错发：\u003c/strong>例如，约堡分拨仓将应发往 Pretoria 的包裹发到了 Bloemfontein，需要转运至正确站点。\u003c/li>\n\u003cli>\u003cstrong>地址变更后需要转仓：\u003c/strong>包裹实际配送地址不在当前站点覆盖范围。\u003cbr />\n可能在出派前发现，也可能在派送过程中经顾客确认。\u003c/li>\n\u003cli>\u003cstrong>RTO 退回约堡：\u003c/strong>将需要退回 JHB 的 RTO 包裹安排干线转运。\u003c/li>\n\u003c/ul>\n"},"summary":{"en":"When a parcel is transferred between hubs, complete the Load scan.","zh":"包裹从一个站点转运到另一个站点时，需要完成 Load 扫描。"},"plain":{"en":"When a parcel is transferred between hubs, complete the Load scan. A missed scan may generate a LOAD_EXCEPTION entry in the tracking log. Common situations include the following. Wrong destination from the sorting centre. A parcel for Pretoria may be sent from the JHB sorting centre to Bloemfontein and must then be transferred to the correct hub. Transfer after an address change. The actual delivery address is outside the current hub's service area. This may be identified before the parcel goes out for delivery or confirmed by the customer during the delivery run. RTO to Johannesburg. Arrange linehaul transfer for RTO parcels that need to go back to JHB.","zh":"包裹从一个站点转运到另一个站点时，需要完成 Load 扫描。 漏扫可能产生 LOAD_EXCEPTION 日志。 常见场景包括： 分拨错发：例如，约堡分拨仓将应发往 Pretoria 的包裹发到了 Bloemfontein，需要转运至正确站点。 地址变更后需要转仓：包裹实际配送地址不在当前站点覆盖范围。 可能在出派前发现，也可能在派送过程中经顾客确认。 RTO 退回约堡：将需要退回 JHB 的 RTO 包裹安排干线转运。"},"operation":null,"review":null,"keyCheck":{"en":"","zh":""},"aliases":[]},{"id":"2-4/step-1","kind":"step","title":{"en":"Verify the Destination and Address","zh":"确认流向并处理地址"},"ordinal":"1","body":{"en":"\u003cp>Have an authorised person update the address if it is incorrect or has changed.\u003c/p>\n\u003cp>PDA → \u003ccode>Sort Common\u003c/code>. Scan the parcel and check the destination hub.\u003c/p>\n","zh":"\u003cp>地址错误或变更时，先由有权限的人员更新地址。\u003c/p>\n\u003cp>PDA → \u003ccode>Sort Common\u003c/code>，扫描包裹，确认目的 Hub。\u003c/p>\n"},"summary":{"en":"Have an authorised person update the address if it is incorrect or has changed.","zh":"地址错误或变更时，先由有权限的人员更新地址。"},"plain":{"en":"Have an autho
