rised person update the address if it is incorrect or has changed. PDA → Sort Common. Scan the parcel and check the destination hub.","zh":"地址错误或变更时，先由有权限的人员更新地址。 PDA → Sort Common，扫描包裹，确认目的 Hub。"},"operation":"Puppis / PDA","review":null,"keyCheck":{"en":"","zh":""},"aliases":[]},{"id":"2-4/step-2","kind":"step","title":{"en":"Complete the Load Scan","zh":"完成 Load 扫描"},"ordinal":"2","body":{"en":"\u003cp>PDA → \u003ccode>Sort Load\u003c/code> or \u003ccode>Quick Tpl-load\u003c/code>. Scan the parcels for transfer.\u003c/p>\n\u003cp>Pack and seal the boxes after scanning. Load them when the truck arrives and take a photo. See the next two steps.\u003c/p>\n","zh":"\u003cp>PDA → \u003ccode>Sort Load\u003c/code> 或 \u003ccode>Quick Tpl-load\u003c/code>，扫描待转运包裹。\u003c/p>\n\u003cp>扫描后装箱打包，等干线到车后装车拍照。装箱和交接见后两步。\u003c/p>\n"},"summary":{"en":"PDA → Sort Load or Quick Tpl-load. Scan the parcels for transfer.","zh":"PDA → Sort Load 或 Quick Tpl-load，扫描待转运包裹。"},"plain":{"en":"PDA → Sort Load or Quick Tpl-load. Scan the parcels for transfer. Pack and seal the boxes after scanning. Load them when the truck arrives and take a photo. See the next two steps.","zh":"PDA → Sort Load 或 Quick Tpl-load，扫描待转运包裹。 扫描后装箱打包，等干线到车后装车拍照。装箱和交接见后两步。"},"operation":"PDA","review":{"en":"The applicable Sort Load or Quick Tpl - Load entry is pending a live screen check.","zh":"各场景应使用 Sort Load 还是 Quick Tpl - Load，待结合系统界面确认。"},"keyCheck":{"en":"","zh":""},"aliases":[]},{"id":"2-4/step-3","kind":"step","title":{"en":"Pack Parcels by Destination and Type","zh":"分类装箱"},"ordinal":"3","body":{"en":"\u003cp>After scanning, pack parcels into boxes by destination hub and parcel type.\u003cbr />\nPack RTO parcels for JHB together and hold them for the linehaul truck.\u003c/p>\n","zh":"\u003cp>扫描完成后，按目的站点及包裹类型分类装箱。\u003cbr />\n退回 JHB 的 RTO 包裹集中打包，等待干线车辆。\u003c/p>\n"},"summary":{"en":"After scanning, pack parcels into boxes by destination hub and parcel type.","zh":"扫描完成后，按目的站点及包裹类型分类装箱。"},"plain":{"en":"After scanning, pack parcels into boxes by destination hub and parcel type. Pack RTO parcels for JHB together and hold them for the linehaul truck.","zh":"扫描完成后，按目的站点及包裹类型分类装箱。 退回 JHB 的 RTO 包裹集中打包，等待干线车辆。"},"operation":null,"review":null,"keyCheck":{"en":"","zh":""},"aliases":[]},{"id":"2-4/step-4","kind":"step","title":{"en":"Hand Over the Boxes and Record the Transfer","zh":"干线交接与记录"},"ordinal":"4","body":{"en":"\u003cp>When the truck arrives, hand the boxes to the linehaul driver for loading, take a photo and record the handover.\u003c/p>\n","zh":"\u003cp>干线到车后，将对应箱子交给干线司机装车，拍照并记录交接。\u003c/p>\n"},"summary":{"en":"When the truck arrives, hand the boxes to the linehaul driver for loading, take a photo and record the handover.","zh":"干线到车后，将对应箱子交给干线司机装车，拍照并记录交接。"},"plain":{"en":"When the truck arrives, hand the boxes to the linehaul driver for loading, take a photo and record the handover.","zh":"干线到车后，将对应箱子交给干线司机装车，拍照并记录交接。"},"operation":null,"review":null,"keyCheck":{"en":"","zh":""},"aliases":[]},{"id":"2-4/notes","kind":"topic","title":{"en":"Notes","zh":"注意事项"},"ordinal":"","body":{"en":"\u003cul>\n\u003cli>Complete both the Load scan and the physical handover to the linehaul driver.\u003c/li>\n\u003cli>For a transfer after an address change, update the address first, rescan using Sort Common, then follow the instructions for Load.\u003c/li>\n\u003c/ul>\n","zh":"\u003cul>\n\u003cli>Load 扫描与实物交给干线车是两个动作，两者都需要完成。\u003c/li>\n\u003cli>改址转仓件应先修改地址、重新 Sort Common，再按指引操作 Load。\u003c/li>\n\u003c/ul>\n"},"summary":{"en":"Complete both the Load scan and the physical handover to the linehaul driver.","zh":"Load 扫描与实物交给干线车是两个动作，两者都需要完成。"},"plain":{"en":"Complete both the Load scan and the physical handover to the linehaul driver. For a transfer after an address change, update the address first, rescan using Sort Common, then follow the instructions for Load.","zh":"Load 扫描与实物交给干线车是两个动作，两者都需要完成。 改址转仓件应先修改地址、重新 Sort Common，再按指引操作 Load。"},"operation":null,"review":null,"keyCheck":{"en":"","zh":""},"aliases":[]}]},{"id":"2-5","title":{"en":"RTO and Reversing an RTO","zh":"RTO 与 RTO 回滚"},"part":"2","blocks":[{"id":"2-5","kind":"intro","title":{"en":"RTO and Reversing an RTO","zh":"RTO 与 RTO 回滚"},"ordinal":"","body":{"en":"","zh":""},"summary":{"en":"","zh":""},"plain":{"en":"","zh":""},"operation":null,"review":null,"keyCheck":{"en":"","zh":""},"aliases":["return to origin","return to shipper","退回货主","自动退运"]},{"id":"2-5/starting-an-rto","kind":"topic","title":{"en":"Starting an RTO","zh":"发起 RTO"},"ordinal":"","body":{"en":"\u003cp>An incorrect customer phone or WhatsApp number may prevent delivery, and the driver should select the reason that matches what happened.\u003cbr />\n\u003ccode>Wrong Mobile\u003c/code> goes to Customer Service, and section \u003ca href=\"#2-2\">2-2\u003c/a> lists the failure reasons that trigger RTO.\u003c/p>\n\u003cp>Under the current hub guidance, the system automatically starts RTO after 21 days without a successful delivery.\u003cbr />\nThe event that starts the 21-day count and the parcel types covered still need to be checked against actual shipments.\u003c/p>\n","zh":"\u003cp>顾客电话或 WhatsApp 号码错误时，包裹可能派送失败，司机仍应选择与现场相符的失败原因。\u003cbr />\n\u003ccode>Wrong Mobile\u003c/code> 进入客服流程，触发 RTO 的失败原因见 \u003ca href=\"#2-2\">2-2\u003c/a>。\u003c/p>\n\u003cp>按当前站点口径，包裹持续未派送成功达 21 天时，系统会自动发起 RTO。\u003cbr />\n21 天从哪个节点起算、适用哪些包裹，待用实际运单核对。\u003c/p>\n"},"summary":{"en":"An incorrect customer phone or WhatsApp number may prevent delivery, and the driver should select the reason that matches what happened.","zh":"顾客电话或 WhatsApp 号码错误时，包裹可能派送失败，司机仍应选择与现场相符的失败原因。"},"plain":{"en":"An incorrect customer phone or WhatsApp number may prevent delivery, and the driver should select the reason that matches what happened. Wrong Mobile goes to Customer Service, and section 2-2 lists the failure reasons that trigger RTO. Under the current hub guidance, the system automatically starts RTO after 21 days without a successful delivery. The event that starts the 21-day count and the parcel types covered still need to be checked against actual shipments.","zh":"顾客电话或 WhatsApp 号码错误时，包裹可能派送失败，司机仍应选择与现场相符的失败原因。 Wrong Mobile 进入客服流程，触发 RTO 的失败原因见 2-2。 按当前站点口径，包裹持续未派送成功达 21 天时，系统会自动发起 RTO。 21 天从哪个节点起算、适用哪些包裹，待用实际运单核对。"},"operation":null,"review":null,"keyCheck":{"en":"","zh":""},"aliases":[]},{"id":"2-5/reverse-rto","kind":"topic","title":{"en":"Reversing an RTO when the customer requests delivery","zh":"顾客重新要求派送时回滚 RTO"},"ordinal":"","body":{"en":"\u003col>\n\u003cli>If the customer asks for delivery while the parcel is waiting for RTO, share the tracking number in the relevant hub's WeCom group and arrange the reversal.\u003c/li>\n\u003cli>Once the RTO reversal is confirmed, sort the parcel again within 30 minutes under the current operating guidance, then follow the system prompt to arrange delivery.\u003c/li>\n\u003cli>If the parcel is not sorted again promptly after reversal, the system may start RTO again.\u003c/li>\n\u003c/ol>\n","zh":"\u003col>\n\u003cli>包裹在等待 RTO 期间，如顾客主动联系并要求继续派送，在所属 Hub 的 WeCom 群提供运单号并沟通回滚。\u003c/li>\n\u003cli>确认 RTO 回滚完成后，按当前操作要求在 30 分钟内重新 Sorting，并按照系统提示安排后续派送。\u003c/li>\n\u003cli>回滚后若未及时重新 Sorting，系统可能重新发起 RTO。\u003c/li>\n\u003c/ol>\n"},"summary":{"en":"If the customer asks for delivery while the parcel is waiting for RTO, share the tracking number in the relevant hub's WeCom group and arrange the reversal.","zh":"包裹在等待 RTO 期间，如顾客主动联系并要求继续派送，在所属 Hub 的 WeCom 群提供运单号并沟通回滚。"},"plain":{"en":"If the customer asks for delivery while the parcel is waiting for RTO, share the tracking number in the relevant hub's WeCom group and arrange the reversal. Once the RTO reversal is confirmed, sort the parcel again within 30 minutes under the current operating guidance, then follow the system prompt to arrange delivery. If the parcel is not sorted again promptly after reversal, the system may start RTO again.","zh":"包裹在等待 RTO 期间，如顾客主动联系并要求继续派送，在所属 Hub 的 WeCom 群提供运单号并沟通回滚。 确认 RTO 回滚完成后，按当前操作要求在 30 分钟内重新 Sorting，并按照系统提示安排后续派送。 回滚后若未及时重新 Sorting，系统可能重新发起 RTO。"},"operation":"WeCom / PDA","review":{"en":"Within 30 minutes is the current operating guidance. The exact system retrigger time is pending verification.","zh":"30 分钟内重新分拣是当前操作要求，系统再次触发 RTO 的实际时点待核对。"},"keyCheck":{"en":"","zh":""},"aliases":["undo rto","rto rollback","rto reversal","取消退运","撤销 RTO"]}]},{"id":"3-1","title":{"en":"Full Warehouse Stock Count","zh":"全库盘点"},"part":"3","blocks":[{"id":"3-1","kind":"intro","title":{"en":"Full Warehouse Stock Count","zh":"全库盘点"},"ordinal":"","body":{"en":"","zh":""},"summary":{"en":"","zh":""},"plain":{"en":"","zh":""},"operation":null,"review":null,"keyCheck":{"en":"","zh":""},"aliases":["stocktake","stock take","inventory count","inventory audit","扫盘点"]},{"id":"3-1/preparation","kind":"topic","title":{"en":"Preparation. Create the Area and Print Its Barcode","zh":"前期准备：新增区域与条码"},"ordinal":"","body":{"en":"\u003col>\n\u003cli>Puppis → \u003ccode>Warehouse\u003c/code> → \u003ccode>Stock\u003c/code>\u003c/li>\n\u003cli>Click \u003ccode>Add\u003c/code> to create a count area, such as a zone, RTO area or shelf.\u003c/li>\n\u003cli>Click \u003ccode>Print\u003c/code> and place the barcode at the corresponding area for scanning.\u003c/li>\n\u003c/ol>\n","zh":"\u003col>\n\u003cli>Puppis → \u003ccode>Warehouse\u003c/code> → \u003ccode>Stock\u003c/code>\u003c/li>\n\u003cli>点击 \u003ccode>Add\u003c/code> 新增盘点区域，例如 Zone、RTO 区或货架。\u003c/li>\n\u003cli>点击 \u003ccode>Print\u003c/code> 打印区域条码，贴在对应位置供盘点扫描。\u003c/li>\n\u003c/ol>\n"},"summary":{"en":"Puppis → Warehouse → Stock","zh":"Puppis → Warehouse → Stock"},"plain":{"en":"Puppis → Warehouse → Stock Click Add to create a count area, such as a zone, RTO area or shelf. Click Print and place the barcode at the corresponding area for scanning.","zh":"Puppis → Warehouse → Stock 点击 Add 新增盘点区域，例如 Zone、RTO 区或货架。 点击 Print 打印区域条码，贴在对应位置供盘点扫描。"},"operation":"Puppis","review":null,"keyCheck":{"en":"","zh":""},"aliases":[]},{"id":"3-1/step-1","kind":"step","title":{"en":"Create the Stock Count Plan","zh":"创建盘点计划"},"ordinal":"1","body":{"en":"\u003cp>The system automatically creates a stock count plan every Monday.\u003c/p>\n\u003cp>To create a plan manually\u003c/p>\n\u003col>\n\u003cli>Puppis → \u003ccode>Warehouse\u003c/code> → \u003ccode>Stock Count Plan\u003c/code> → \u003ccode>Create\u003c/code>\u003c/li>\n\u003cli>Choose a full or partial count. For a partial count, select the areas to include.\u003c/li>\n\u003c/ol>\n","zh":"\u003cp>系统每周一自动创建一个盘点计划。\u003c/p>\n\u003cp>如需手动创建\u003c/p>\n\u003col>\n\u003cli>Puppis → \u003ccode>Warehouse\u003c/code> → \u003ccode>Stock Count Plan\u003c/code> → \u003ccode>Create\u003c/code>\u003c/li>\n\u003cli>选择全库盘点或部分盘点。部分盘点时，指定要盘点的区域。\u003c/li>\n\u003c/ol>\n"},"summary":{"en":"The system automatically creates a stock count plan every Monday.","zh":"系统每周一自动创建一个盘点计划。"},"plain":{"en":"The system automatically creates a stock count plan every Monday. To create a plan manually Puppis → Warehouse → Stock Count Plan → Create Choose a full or partial count. For a partial count, select the areas to include.","zh":"系统每周一自动创建一个盘点计划。 如需手动创建 Puppis → Warehouse → Stock Count Plan → Create 选择全库盘点或部分盘点。部分盘点时，指定要盘点的区域。"},"operation":"Puppis","review":null,"keyCheck":{"en":"","zh":""},"aliases":[]},{"id":"3-1/step-2","kind":"step","title":{"en":"Select the Plan and Scan the Area","zh":"选择计划并扫描区域"},"ordinal":"2","body":{"en":"\u003col>\n\u003cli>PDA → \u003ccode>Stock Count\u003c/code>\u003c/li>\n\u003cli>Start the count using the plan's \u003ccode>Count ID\u003c/code>.\u003c/li>\n\u003cli>Tap \u003ccode>Count\u003c/code> for the area and scan its barcode.\u003c/li>\n\u003cli>Scan each parcel in the area.\u003c/li>\n\u003c/ol>\n\u003cp>\u003cstrong>Important.\u003c/strong> Everyone working on the same count uses the same \u003ccode>Count ID\u003c/code>.\u003c/p>\n","zh":"\u003col>\n\u003cli>PDA → \u003ccode>Stock Count\u003c/code>\u003c/li>\n\u003cli>按本次盘点计划的 \u003ccode>Count ID\u003c/code> 点击开始盘点。\u003c/li>\n\u003cli>点击对应区域的 \u003ccode>Count\u003c/code>，扫描该区域条码。\u003c/li>\n\u003cli>逐票扫描该区域的包裹。\u003c/li>\n\u003c/ol>\n\u003cp>\u003cstrong>本步注意\u003c/strong>　同一次盘点的参与人员使用同一个 \u003ccode>Count ID\u003c/code>。\u003c/p>\n"},"summary":{"en":"PDA → Stock Count","zh":"PDA → Stock Count"},"plain":{"en":"PDA → Stock Count Start the count using the plan's Count ID. Tap Count for the area and scan its barcode. Scan each parcel in the area. Important. Everyone working on the same count uses the same Count ID.","zh":"PDA → Stock Count 按本次盘点计划的 Count ID 点击开始盘点。 点击对应区域的 Count，扫描该区域条码。 逐票扫描该区域的包裹。 本步注意 同一次盘点的参与人员使用同一个 Count ID。"},"operation":"PDA","review":null,"keyCheck":{"en":"","zh":""},"aliases":[]},{"id":"3-1/step-3","kind":"step","title":{"en":"Finish One Area Before Moving to the Next","zh":"完成一个区域后再进入下一区域"},"ordinal":"3","body":{"en":"\u003cp>Scan all parcels in the current area and confirm the area count on the PDA before moving to the next area.\u003c/p>\n\u003cp>\u003cstrong>Important.\u003c/strong> People can count different areas at the same time, with only one person assigned to each area at a time.\u003c/p>\n","zh":"\u003cp>将当前区域的包裹全部扫描完毕，在 PDA 确认该区域盘点完成后，再进行下一个区域。\u003c/p>\n\u003cp>\u003cstrong>本步注意：\u003c/strong>可以多人同时盘点不同区域，但每个区域同一时间只能由一人负责盘点。\u003c/p>\n"},"summary":{"en":"Scan all parcels in the current area and confirm the area count on the PDA before moving to the next area.","zh":"将当前区域的包裹全部扫描完毕，在 PDA 确认该区域盘点完成后，再进行下一个区域。"},"plain":{"en":"Scan all parcels in the current area and confirm the area count on the PDA before moving to the next area. Important. People can count different areas at the same time, with only one person assigned to each area at a time.","zh":"将当前区域的包裹全部扫描完毕，在 PDA 确认该区域盘点完成后，再进行下一个区域。 本步注意：可以多人同时盘点不同区域，但每个区域同一时间只能由一人负责盘点。"},"operation":"PDA","review":null,"keyCheck":{"en":"","zh":""},"aliases":[]},{"id":"3-1/step-4","kind":"step","title":{"en":"Set Aside Parcels Flagged as Extra","zh":"取出 Extra 包裹"},"ordinal":"4","body":{"en":"\u003cp>If the scan shows Extra, remove the parcel from the count area and set it aside with the other Extra parcels for review and follow-up.\u003c/p>\n","zh":"\u003cp>扫描时如显示 Extra，将对应包裹取出，集中等待后续核查和处理。\u003c/p>\n"},"summary":{"en":"If the scan shows Extra, remove the parcel from the count area and set it aside with the other Extra parcels for review and follow-up.","zh":"扫描时如显示 Extra，将对应包裹取出，集中等待后续核查和处理。"},"plain":{"en":"If the scan shows Extra, remove the parcel from the count area and set it aside with the other Extra parcels for review and follow-up.","zh":"扫描时如显示 Extra，将对应包裹取出，集中等待后续核查和处理。"},"operation":null,"review":null,"keyCheck":{"en":"","zh":""},"aliases":[]},{"id":"3-1/step-5","kind":"step","title":{"en":"Confirm the Stock Count and Handle Exception Tickets","zh":"确认盘点并处理异常工单"},"ordinal":"5","body":{"en":"\u003col>\n\u003cli>Once all areas are scanned and confirmed on the PDA, confirm the plan in Puppis and review the count details.\u003c/li>\n\u003cli>Puppis → \u003ccode>Work Order System\u003c/code> → \u003ccode>Package Exception Task (Dispatch)\u003c/code>\u003c/li>\n\u003cli>In \u003ccode>WorkOrderBizType\u003c/code>, select \u003ccode>Stock Count Missing\u003c/code> or \u003ccode>Stock Count Extra\u003c/code>. Review the \u003ccode>Processing\u003c/code> tickets, check the parcels and handle each case.\u003c/li>\n\u003c/ol>\n","zh":"\u003col>\n\u003cli>各区域完成扫描和 PDA 确认后，在 Puppis 确认本次盘点计划并查看明细。\u003c/li>\n\u003cli>Puppis → \u003ccode>Work Order System\u003c/code> → \u003ccode>Package Exception Task (Dispatch)\u003c/code>\u003c/li>\n\u003cli>在 \u003ccode>WorkOrderBizType\u003c/code> 选择 \u003ccode>Stock Count Missing\u003c/code> 或 \u003ccode>Stock Count Extra\u003c/code>，查看 \u003ccode>Processing\u003c/code> 工单，核对包裹并逐单处理。\u003c/li>\n\u003c/ol>\n"},"summary":{"en":"Once all areas are scanned and confirmed on the PDA, confirm the plan in Puppis and review the count details.","zh":"各区域完成扫描和 PDA 确认后，在 Puppis 确认本次盘点计划并查看明细。"},"plain":{"en":"Once all areas are scanned and confirmed on the PDA, confirm the plan in Puppis and review the count details. Puppis → Work Order System → Package Exception Task (Dispatch) In WorkOrderBizType, select Stock Count Missing or Stock Count Extra. Review the Processing tickets, check the parcels and handle each case.","zh":"各区域完成扫描和 PDA 确认后，在 Puppis 确认本次盘点计划并查看明细。 Puppis → Work Order System → Package Exception Task (Dispatch) 在 WorkOrderBizType 选择 Stock Count Missing 或 Stock Count Extra，查看 Processing 工单，核对包裹并逐单处理。"},"operation":"Puppis","review":null,"keyCheck":{"en":"","zh":""},"aliases":["stock count missing","stock count extra","stocktake discrepancy","盘盈","盘亏"]},{"id":"3-1/notes","kind":"topic","title":{"en":"Notes","zh":"注意事项"},"ordinal":"","body":{"en":"\u003cul>\n\u003cli>After scanning, complete the confirmation steps on both the PDA and the last-mile system.\u003c/li>\n\u003cli>Investigate Missing and Extra discrepancies using physical checks and tracking history before concluding that a parcel was lost or falsely marked as delivered.\u003c/li>\n\u003cli>Detailed steps for investigating and resolving stock count exceptions will be added later.\u003c/li>\n\u003c/ul>\n","zh":"\u003cul>\n\u003cli>扫描完成后，还需要完成 PDA 和末派系统中的确认动作。\u003c/li>\n\u003cli>Missing 和 Extra 属于待核查差异，需结合实物及轨迹调查，不能直接等同于丢件或虚假签收。\u003c/li>\n\u003cli>盘点异常工单的具体调查和处理步骤，后续继续细化。\u003c/li>\n\u003c/ul>\n"},"summary":{"en":"After scanning, complete the confirmation steps on both the PDA and the last-mile system.","zh":"扫描完成后，还需要完成 PDA 和末派系统中的确认动作。"},"plain":{"en":"After scanning, complete the confirmation steps on both the PDA and the last-mile system. Investigate Missing and Extra discrepancies using physical checks and tracking history before concluding that a parcel was lost or falsely marked as delivered. Detailed steps for investigating and resolving stock count exceptions will be added later.","zh":"扫描完成后，还需要完成 PDA 和末派系统中的确认动作。 Missing 和 Extra 属于待核查差异，需结合实物及轨迹调查，不能直接等同于丢件或虚假签收。 盘点异常工单的具体调查和处理步骤，后续继续细化。"},"operation":null,"review":null,"keyCheck":{"en":"","zh":""},"aliases":[]}]},{"id":"3-2","title":{"en":"Handling Customer Complaints","zh":"客诉处理"},"part":"3","blocks":[{"id":"3-2","kind":"intro","title":{"en":"Handling Customer Complaints","zh":"客诉处理"},"ordinal":"","body":{"en":"","zh":""},"summary":{"en":"","zh":""},"plain":{"en":"","zh":""},"operation":null,"review":null,"keyCheck":{"en":"","zh":""},"aliases":["sbnr","sign but not receive","signed but not received","delivered not received","签收未收到"]},{"id":"3-2/priority-complaints","kind":"topic","title":{"en":"Priority Complaints","zh":"重点关注的客诉"},"ordinal":"","body":{"en":"\u003cp>The current priority is Signed but Not Received (SBNR) complaints, where the system shows the parcel as delivered but the customer says it did not arrive.\u003cbr />\nVerify whether the customer actually received the parcel, as these cases may lead to penalties from the shipper.\u003c/p>\n","zh":"\u003cp>当前重点跟进 Sign but Not Received（SBNR）客诉，即系统显示已签收，但顾客反馈未收到包裹。\u003cbr />\n这类问题需要核实真实收货情况，并涉及货主罚款风险。\u003c/p>\n"},"summary":{"en":"The current priority is Signed but Not Received (SBNR) complaints, where the system shows the parcel as delivered but the customer says it did not arrive.","zh":"当前重点跟进 Sign but Not Received（SBNR）客诉，即系统显示已签收，但顾客反馈未收到包裹。"},"plain":{"en":"The current priority is Signed but Not Received (SBNR) complaints, where the system shows the parcel as delivered but the customer says it did not arrive. Verify whether the customer actually received the parcel, as these cases may lead to penalties from the shipper.","zh":"当前重点跟进 Sign but Not Received（SBNR）客诉，即系统显示已签收，但顾客反馈未收到包裹。 这类问题需要核实真实收货情况，并涉及货主罚款风险。"},"operation":null,"review":null,"keyCheck":{"en":"","zh":""},"aliases":[]},{"id":"3-2/step-1","kind":"step","title":{"en":"Verify the Tracking Number","zh":"核对客诉单号"},"ordinal":"1","body":{"en":"\u003col>\n\u003cli>Puppis → \u003ccode>Work Order System\u003c/code> → \u003ccode>Complaint Task\u003c/code>\u003c/li>\n\u003cli>Select \u003ccode>Sign but not receive (ZA)\u003c/code> in \u003ccode>Category\u003c/code>.\u003c/li>\n\u003cli>Review cases in \u003ccode>Processing\u003c/code> and use the GE tracking number to identify the parcel to investigate.\u003c/li>\n\u003c/ol>\n","zh":"\u003col>\n\u003cli>Puppis → \u003ccode>Work Order System\u003c/code> → \u003ccode>Complaint Task\u003c/code>\u003c/li>\n\u003cli>在 \u003ccode>Category\u003c/code> 选择 \u003ccode>Sign but not receive (ZA)\u003c/code>。\u003c/li>\n\u003cli>查看状态为 \u003ccode>Processing\u003c/code> 的工单，用 GE 运单号核对要调查的包裹。\u003c/li>\n\u003c/ol>\n"},"summary":{"en":"Puppis → Work Order System → Complaint Task","zh":"Puppis → Work Order System → Complaint Task"},"plain":{"en":"Puppis → Work Order System → Complaint Task Select Sign but not receive (ZA) in Category. Review cases in Processing and use the GE tracking number to identify the parcel to investigate.","zh":"Puppis → Work Order System → Complaint Task 在 Category 选择 Sign but not receive (ZA)。 查看状态为 Processing 的工单，用 GE 运单号核对要调查的包裹。"},"operation":"Puppis","review":null,"keyCheck":{"en":"","zh":""},"aliases":[]},{"id":"3-2/step-2","kind":"step","title":{"en":"Contact the Customer to Verify Receipt","zh":"联系顾客核实是否收到"},"ordinal":"2","body":{"en":"\u003cp>Use the customer's contact details in the system or ask the delivery driver for them if needed.\u003cbr />\nContact the customer to verify whether they received the parcel and record the outcome.\u003c/p>\n","zh":"\u003cp>从系统获取顾客联系方式，必要时向派送司机询问。\u003cbr />\n联系顾客，核实是否实际收到该包裹，并记录结果。\u003c/p>\n"},"summary":{"en":"Use the customer's contact details in the system or ask the delivery driver for them if needed.","zh":"从系统获取顾客联系方式，必要时向派送司机询问。"},"plain":{"en":"Use the customer's contact details in the system or ask the delivery driver for them if needed. Contact the customer to verify whether they received the parcel and record the outcome.","zh":"从系统获取顾客联系方式，必要时向派送司机询问。 联系顾客，核实是否实际收到该包裹，并记录结果。"},"operation":null,"review":null,"keyCheck":{"en":"","zh":""},"aliases":[]},{"id":"3-2/step-3","kind":"step","title":{"en":"Obtain Valid Proof of Delivery (POD)","zh":"取得有效 POD"},"ordinal":"3","body":{"en":"\u003cp>If the customer confirms receipt, obtain valid proof of delivery for that tracking number.\u003c/p>\n\u003cp>A WhatsApp chat screenshot should show both of the following.\u003c/p>\n\u003cul>\n\u003cli>The matching GE tracking number.\u003c/li>\n\u003cli>A reply from the customer clearly confirming they received the parcel.\u003c/li>\n\u003c/ul>\n","zh":"\u003cp>对于顾客确认已收到的包裹，取得与该运单对应的有效收货凭证。\u003c/p>\n\u003cp>例如，WhatsApp 聊天截图中应同时出现：\u003c/p>\n\u003cul>\n\u003cli>对应的 GE 运单号。\u003c/li>\n\u003cli>顾客明确确认已收到包裹的回复。\u003c/li>\n\u003c/ul>\n"},"summary":{"en":"If the customer confirms receipt, obtain valid proof of delivery for that tracking number.","zh":"对于顾客确认已收到的包裹，取得与该运单对应的有效收货凭证。"},"plain":{"en":"If the customer confirms receipt, obtain valid proof of delivery for that tracking number. A WhatsApp chat screenshot should show both of the following. The matching GE tracking number. A reply from the customer clearly confirming they received the parcel.","zh":"对于顾客确认已收到的包裹，取得与该运单对应的有效收货凭证。 例如，WhatsApp 聊天截图中应同时出现： 对应的 GE 运单号。 顾客明确确认已收到包裹的回复。"},"operation":null,"review":null,"keyCheck":{"en":"","zh":""},"aliases":[]},{"id":"3-2/step-4","kind":"step","title":{"en":"Record the Outcome and Follow Up","zh":"记录结果并跟进处理"},"ordinal":"4","body":{"en":"\u003cp>Once the customer confirms receipt, retain valid POD for the matching GE tracking number and close the complaint case.\u003cbr />\nIf the customer confirms they did not receive it, continue tracing the parcel and follow up on the case.\u003c/p>\n","zh":"\u003cp>顾客确认收到包裹后，保留与 GE 运单号对应的有效 POD，并关闭客诉工单。\u003cbr />\n若顾客确认未收到，则继续核查包裹去向，并跟进后续处理。\u003c/p>\n"},"summary":{"en":"Once the customer confirms receipt, retain valid POD for the matching GE tracking number and close the complaint case.","zh":"顾客确认收到包裹后，保留与 GE 运单号对应的有效 POD，并关闭客诉工单。"},"plain":{"en":"Once the customer confirms receipt, retain valid POD for the matching GE tracking number and close the complaint case. If the customer confirms they did not receive it, continue tracing the parcel and follow up on the case.","zh":"顾客确认收到包裹后，保留与 GE 运单号对应的有效 POD，并关闭客诉工单。 若顾客确认未收到，则继续核查包裹去向，并跟进后续处理。"},"operation":null,"review":null,"keyCheck":{"en":"","zh":""},"aliases":[]},{"id":"3-2/notes","kind":"topic","title":{"en":"Notes","zh":"注意事项"},"ordinal":"","body":{"en":"\u003cul>\n\u003cli>The POD must be genuine and match the GE tracking number in the complaint.\u003c/li>\n\u003cli>Fabricated POD is subject to penalties, with the specific rules to be added later.\u003c/li>\n\u003cli>Verify actual receipt before treating a parcel as received by the customer, even if the system marks it as delivered.\u003c/li>\n\u003c/ul>\n","zh":"\u003cul>\n\u003cli>POD 必须真实，且与本次客诉的 GE 运单号相对应。\u003c/li>\n\u003cli>伪造 POD 也会受到处罚，具体处罚规则后续补充。\u003c/li>\n\u003cli>不能只凭系统显示已签收，就认定顾客实际收到包裹。\u003c/li>\n\u003c/ul>\n"},"summary":{"en":"The POD must be genuine and match the GE tracking number in the complaint.","zh":"POD 必须真实，且与本次客诉的 GE 运单号相对应。"},"plain":{"en":"The POD must be genuine and match the GE tracking number in the complaint. Fabricated POD is subject to penalties, with the specific rules to be added later. Verify actual receipt before treating a parcel as received by the customer, even if the system marks it as delivered.","zh":"POD 必须真实，且与本次客诉的 GE 运单号相对应。 伪造 POD 也会受到处罚，具体处罚规则后续补充。 不能只凭系统显示已签收，就认定顾客实际收到包裹。"},"operation":null,"review":null,"keyCheck":{"en":"","zh":""},"aliases":[]}]},{"id":"4-1","title":{"en":"New Driver Onboarding","zh":"新司机加入"},"part":"4","blocks":[{"id":"4-1","kind":"intro","title":{"en":"New Driver Onboarding","zh":"新司机加入"},"ordinal":"","body":{"en":"","zh":""},"summary":{"en":"","zh":""},"plain":{"en":"","zh":""},"operation":null,"review":null,"keyCheck":{"en":"","zh":""},"aliases":["driver recruiting","driver onboarding","招司机"]},{"id":"4-1/step-1","kind":"step","title":{"en":"Find and assess driver candidates","zh":"寻找及核实候选司机"},"ordinal":"1","body":{"en":"\u003cp>Find candidates through referrals from current drivers or other channels.\u003cbr />\nCheck how each candidate was referred or found, and assess their reliability, attitude towards work and suitability for the hub's delivery work.\u003c/p>\n","zh":"\u003cp>通过在岗司机推荐或其他渠道寻找候选司机。\u003cbr />\n核实候选人的来源、可靠性和工作态度，确认其适合站点的派送工作。\u003c/p>\n"},"summary":{"en":"Find candidates through referrals from current drivers or other channels.","zh":"通过在岗司机推荐或其他渠道寻找候选司机。"},"plain":{"en":"Find candidates through referrals from current drivers or other channels. Check how each candidate was referred or found, and assess their reliability, attitude towards work and suitability for the hub's delivery work.","zh":"通过在岗司机推荐或其他渠道寻找候选司机。 核实候选人的来源、可靠性和工作态度，确认其适合站点的派送工作。"},"operation":null,"review":null,"keyCheck":{"en":"","zh":""},"aliases":[]},{"id":"4-1/step-2","kind":"step","title":{"en":"Sign the SLA agreement","zh":"签署 SLA 合约"},"ordinal":"2","body":{"en":"\u003cp>Sign the SLA agreement with the driver and keep the signed document on file.\u003c/p>\n","zh":"\u003cp>与司机签署 SLA 合约，并留存已签署的文件。\u003c/p>\n"},"summary":{"en":"Sign the SLA agreement with the driver and keep the signed document on file.","zh":"与司机签署 SLA 合约，并留存已签署的文件。"},"plain":{"en":"Sign the SLA agreement with the driver and keep the signed document on file.","zh":"与司机签署 SLA 合约，并留存已签署的文件。"},"operation":null,"review":null,"keyCheck":{"en":"","zh":""},"aliases":[]},{"id":"4-1/step-3","kind":"step","title":{"en":"Create the driver account and enter bank details","zh":"创建司机账号并录入银行信息"},"ordinal":"3","body":{"en":"\u003col>\n\u003cli>\u003cp>Puppis → \u003ccode>Basic\u003c/code> → \u003ccode>Employee\u003c/code> → \u003ccode>Add\u003c/code>\u003c/p>\n\u003c/li>\n\u003cli>\u003cp>Enter the account details.\u003c/p>\n\u003cul>\n\u003cli>\u003ccode>Company\u003c/code> — Select \u003ccode>GFS ZA\u003c/code>.\u003c/li>\n\u003cli>\u003ccode>Account\u003c/code> — Use the driver's first name with a number suffix such as \u003ccode>01\u003c/code> or \u003ccode>02\u003c/code>.\u003c/li>\n\u003cli>\u003ccode>Password\u003c/code> — Set the driver's initial password.\u003c/li>\n\u003cli>\u003ccode>Name\u003c/code> — Enter the driver's full name.\u003c/li>\n\u003cli>\u003ccode>Role\u003c/code> — Select \u003ccode>Driver\u003c/code>.\u003c/li>\n\u003cli>\u003ccode>Hub\u003c/code> — Select the hub where the driver works.\u003c/li>\n\u003cli>\u003ccode>Position\u003c/code> — Select \u003ccode>Driver\u003c/code>.\u003c/li>\n\u003cli>\u003ccode>Status\u003c/code> — Use \u003ccode>On\u003c/code> while the driver is active and change it to \u003ccode>Off\u003c/code> when they stop working with us.\u003c/li>\n\u003c/ul>\n\u003c/li>\n\u003cli>\u003cp>Verify and enter \u003ccode>Bank Card Account\u003c/code>, \u003ccode>Bank Card Account ID\u003c/code> and \u003ccode>Branch Code\u003c/code>. Confirm all three fields, because incorrect bank details can affect payment to the driver.\u003c/p>\n\u003c/li>\n\u003c/ol>\n","zh":"\u003col>\n\u003cli>\u003cp>Puppis → \u003ccode>Basic\u003c/code> → \u003ccode>Employee\u003c/code> → \u003ccode>Add\u003c/code>\u003c/p>\n\u003c/li>\n\u003cli>\u003cp>填写账号资料。\u003c/p>\n\u003cul>\n\u003cli>\u003ccode>Company\u003c/code> 选择 \u003ccode>GFS ZA\u003c/code>。\u003c/li>\n\u003cli>\u003ccode>Account\u003c/code> 可用司机的 First Name 加 \u003ccode>01\u003c/code>、\u003ccode>02\u003c/code> 等数字后缀。\u003c/li>\n\u003cli>\u003ccode>Password\u003c/code> 设置司机的初始密码。\u003c/li>\n\u003cli>\u003ccode>Name\u003c/code> 填写司机全名。\u003c/li>\n\u003cli>\u003ccode>Role\u003c/code> 选择 \u003ccode>Driver\u003c/code>。\u003c/li>\n\u003cli>\u003ccode>Hub\u003c/code> 选择司机工作的 Hub。\u003c/li>\n\u003cli>\u003ccode>Position\u003c/code> 选择 \u003ccode>Driver\u003c/code>。\u003c/li>\n\u003cli>\u003ccode>Status\u003c/code> 在岗时选 \u003ccode>On\u003c/code>，停止合作后改为 \u003ccode>Off\u003c/code>。\u003c/li>\n\u003c/ul>\n\u003c/li>\n\u003cli>\u003cp>核对并填写 \u003ccode>Bank Card Account\u003c/code>、\u003ccode>Bank Card Account ID\u003c/code> 和 \u003ccode>Branch Code\u003c/code>。三项都要确认无误，银行信息填错会影响司机收款。\u003c/p>\n\u003c/li>\n\u003c/ol>\n"},"summary":{"en":"Puppis → Basic → Employee → Add","zh":"Puppis → Basic → Employee → Add"},"plain":{"en":"Puppis → Basic → Employee → Add Enter the account details. Company — Select GFS ZA. Account — Use the driver's first name with a number suffix such as 01 or 02. Password — Set the driver's initial password. Name — Enter the driver's full name. Role — Select Driver. Hub — Select the hub where the driver works. Position — Select Driver. Status — Use On while the driver is active and change it to Off when they stop working with us. Verify and enter Bank Card Account, Bank Card Account ID and Branch Code. Confirm all three fields, because incorrect bank details can affect payment to the driver.","zh":"Puppis → Basic → Employee → Add 填写账号资料。 Company 选择 GFS ZA。 Account 可用司机的 First Name 加 01、02 等数字后缀。 Password 设置司机的初始密码。 Name 填写司机全名。 Role 选择 Driver。 Hub 选择司机工作的 Hub。 Position 选择 Driver。 Status 在岗时选 On，停止合作后改为 Off。 核对并填写 Bank Card Account、Bank Card Account ID 和 Branch Code。三项都要确认无误，银行信息填错会影响司机收款。"},"operation":"Puppis","review":null,"keyCheck":{"en":"\u003cp>Verify and enter \u003ccode>Bank Card Account\u003c/code>, \u003ccode>Bank Card Account ID\u003c/code> and \u003ccode>Branch Code\u003c/code>. Confirm all three fields, because incorrect bank details can affect payment to the driver.\u003c/p>\n","zh":"\u003cp>核对并填写 \u003ccode>Bank Card Account\u003c/code>、\u003ccode>Bank Card Account ID\u003c/code> 和 \u003ccode>Branch Code\u003c/code>。三项都要确认无误，银行信息填错会影响司机收款。\u003c/p>\n"},"aliases":["driver registration","new driver account","bank card account","司机建号","银行资料"]},{"id":"4-1/step-4","kind":"step","title":{"en":"Train the driver on delivery confirmation","zh":"培训司机签收"},"ordinal":"4","body":{"en":"\u003cp>Train the new driver on delivery confirmation and proof of delivery.\u003c/p>\n","zh":"\u003cp>对新司机进行签收培训。\u003c/p>\n"},"summary":{"en":"Train the new driver on delivery confirmation and proof of delivery.","zh":"对新司机进行签收培训。"},"plain":{"en":"Train the new driver on delivery confirmation and proof of delivery.","zh":"对新司机进行签收培训。"},"operation":null,"review":null,"keyCheck":{"en":"","zh":""},"aliases":[]},{"id":"4-1/step-5","kind":"step","title":{"en":"Arrange a trial delivery run","zh":"安排试派送"},"ordinal":"5","body":{"en":"\u003cp>Arrange a trial delivery run.\u003c/p>\n","zh":"\u003cp>安排试派送。\u003c/p>\n"},"summary":{"en":"Arrange a trial delivery run.","zh":"安排试派送。"},"plain":{"en":"Arrange a trial delivery run.","zh":"安排试派送。"},"operation":null,"review":null,"keyCheck":{"en":"","zh":""},"aliases":[]}]},{"id":"4-2","title":{"en":"Driver Payments","zh":"司机发薪"},"part":"4","blocks":[{"id":"4-2","kind":"intro","title":{"en":"Driver Payments","zh":"司机发薪"},"ordinal":"","body":{"en":"","zh":""},"summary":{"en":"","zh":""},"plain":{"en":"","zh":""},"operation":null,"review":null,"keyCheck":{"en":"","zh":""},"aliases":["driver salary","driver payroll","driver wages","payday","司机结算"]},{"id":"4-2/pay-schedule","kind":"topic","title":{"en":"Pay schedule","zh":"发薪时间"},"ordinal":"","body":{"en":"\u003cp>Drivers are normally paid on Mondays.\u003cbr />\nSome bank transfers take longer, so some drivers may receive the money on Tuesday.\u003c/p>\n","zh":"\u003cp>司机通常每周一发薪。\u003cbr />\n部分银行转账处理较慢，司机可能在周二才收到款项。\u003c/p>\n"},"summary":{"en":"Drivers are normally paid on Mondays.","zh":"司机通常每周一发薪。"},"plain":{"en":"Drivers are normally paid on Mondays. Some bank transfers take longer, so some drivers may receive the money on Tuesday.","zh":"司机通常每周一发薪。 部分银行转账处理较慢，司机可能在周二才收到款项。"},"operation":null,"review":null,"keyCheck":{"en":"","zh":""},"aliases":[]},{"id":"4-2/financial","kind":"topic","title":{"en":"Confirming Financial tasks","zh":"Financial 确认"},"ordinal":"","body":{"en":"\u003cp>The system creates a Manifest each time a driver takes a batch out for delivery.\u003c/p>\n\u003col>\n\u003cli>Puppis → \u003ccode>Task\u003c/code> → \u003ccode>Financial\u003c/code>\u003c/li>\n\u003cli>Find the relevant driver and batch. Check the number of parcels collected, delivered, still awaiting delivery and marked as failed for that cycle.\u003c/li>\n\u003cli>Check that undelivered parcels have physically returned to the warehouse. Once \u003ccode>To Sign\u003c/code> is \u003ccode>0\u003c/code> and every parcel in the batch has been delivered or physically returned, promptly confirm the Manifest in \u003ccode>Financial\u003c/code>.\u003c/li>\n\u003c/ol>\n\u003cp>Under the current hub procedure, the driver cannot collect new parcels and the fees for that batch cannot be settled while \u003ccode>Financial\u003c/code> remains unconfirmed.\u003c/p>\n\u003cp>HR normally prepares driver payroll on Sunday for payment on Monday.\u003cbr />\nAim to confirm eligible Manifests before Sunday.\u003cbr />\nIf a Manifest misses the Sunday payroll run, the delivery fees for that task may be paid one weekly cycle later.\u003c/p>\n","zh":"\u003cp>司机每次领件出派，系统会生成对应的任务单（Manifest）。\u003c/p>\n\u003col>\n\u003cli>Puppis → \u003ccode>Task\u003c/code> → \u003ccode>Financial\u003c/code>\u003c/li>\n\u003cli>找到对应司机及批次，查看该周期的领件数、已签收数、待签收数和派送失败数。\u003c/li>\n\u003cli>核对未签收件是否已实际退回仓库。确认 \u003ccode>To Sign\u003c/code> 为 \u003ccode>0\u003c/code>，且本批每票包裹都已签收或实际退回仓库后，及时在 \u003ccode>Financial\u003c/code> 确认任务单。\u003c/li>\n\u003c/ol>\n\u003cp>按当前站点口径，未确认 \u003ccode>Financial\u003c/code> 时，司机无法领取新的包裹，该批次派费也无法结算。\u003c/p>\n\u003cp>HR 通常在周日汇总司机薪资，周一安排付款。\u003cbr />\n建议在周日前确认符合条件的任务单。\u003cbr />\n如果错过周日汇总，对应派费可能顺延一个发薪周期。\u003c/p>\n"},"summary":{"en":"The system creates a Manifest each time a driver takes a batch out for delivery.","zh":"司机每次领件出派，系统会生成对应的任务单（Manifest）。"},"plain":{"en":"The system creates a Manifest each time a driver takes a batch out for delivery. Puppis → Task → Financial Find the relevant driver and batch. Check the number of parcels collected, delivered, still awaiting delivery and marked as failed for that cycle. Check that undelivered parcels have physically returned to the warehouse. Once To Sign is 0 and every parcel in the batch has been delivered or physically returned, promptly confirm the Manifest in Financial. Under the current hub procedure, the driver cannot collect new parcels and the fees for that batch cannot be settled while Financial remains unconfirmed. HR normally prepares driver payroll on Sunday for payment on Monday. Aim to confirm eligible Manifests before Sunday. If a Manifest misses the Sunday payroll run, the delivery fees for that task may be paid one weekly cycle later.","zh":"司机每次领件出派，系统会生成对应的任务单（Manifest）。 Puppis → Task → Financial 找到对应司机及批次，查看该周期的领件数、已签收数、待签收数和派送失败数。 核对未签收件是否已实际退回仓库。确认 To Sign 为 0，且本批每票包裹都已签收或实际退回仓库后，及时在 Financial 确认任务单。 按当前站点口径，未确认 Financial 时，司机无法领取新的包裹，该批次派费也无法结算。 HR 通常在周日汇总司机薪资，周一安排付款。 建议在周日前确认符合条件的任务单。 如果错过周日汇总，对应派费可能顺延一个发薪周期。"},"operation":"Puppis","review":null,"keyCheck":{"en":"\u003cp>Check that undelivered parcels have physically returned to the warehouse. Once \u003ccode>To Sign\u003c/code> is \u003ccode>0\u003c/code> and every parcel in the batch has been delivered or physically returned, promptly confirm the Manifest in \u003ccode>Financial\u003c/code>.\u003c/p>\n","zh":"\u003cp>核对未签收件是否已实际退回仓库。确认 \u003ccode>To Sign\u003c/code> 为 \u003ccode>0\u003c/code>，且本批每票包裹都已签收或实际退回仓库后，及时在 \u003ccode>Financial\u003c/code> 确认任务单。\u003c/p>\n"},"aliases":["confirm financial","financial confirmation","confirm manifest","manifest confirmation","确认派费"]},{"id":"4-2/payment-issues","kind":"topic","title":{"en":"Payment issues","zh":"薪资异常"},"ordinal":"","body":{"en":"\u003cp>Drivers can check the delivery fee for each parcel in the driver app.\u003cbr />\nIf bank details are incorrect or a driver reports being underpaid, collect the details of the issue and raise it in the relevant hub's WeCom group.\u003c/p>\n","zh":"\u003cp>司机可以在司机 App 查看每票包裹的派费。\u003cbr />\n发现银行信息有误，或司机反馈少发薪资时，收集具体情况后，在所属 Hub 的 WeCom 群反馈。\u003c/p>\n"},"summary":{"en":"Drivers can check the delivery fee for each parcel in the driver app.","zh":"司机可以在司机 App 查看每票包裹的派费。"},"plain":{"en":"Drivers can check the delivery fee for each parcel in the driver app. If bank details are incorrect or a driver reports being underpaid, collect the details of the issue and raise it in the relevant hub's WeCom group.","zh":"司机可以在司机 App 查看每票包裹的派费。 发现银行信息有误，或司机反馈少发薪资时，收集具体情况后，在所属 Hub 的 WeCom 群反馈。"},"operation":null,"review":null,"keyCheck":{"en":"","zh":""},"aliases":[]}]},{"id":"4-3","title":{"en":"Driver Deductions and Top-ups","zh":"司机扣罚/津贴"},"part":"4","blocks":[{"id":"4-3","kind":"intro","title":{"en":"Driver Deductions and Top-ups","zh":"司机扣罚/津贴"},"ordinal":"","body":{"en":"","zh":""},"summary":{"en":"","zh":""},"plain":{"en":"","zh":""},"operation":null,"review":null,"keyCheck":{"en":"","zh":""},"aliases":["driver fine","penalty","top up","topup","allowance","司机补贴"]},{"id":"4-3/driver-deductions","kind":"topic","title":{"en":"Driver deductions","zh":"司机扣罚"},"ordinal":"","body":{"en":"\u003col>\n\u003cli>Puppis → \u003ccode>HR Workbench\u003c/code> → \u003ccode>Salary Detail (New)\u003c/code> → \u003ccode>Add\u003c/code>\u003c/li>\n\u003cli>Select the relevant \u003ccode>Hub\u003c/code> and \u003ccode>Employee\u003c/code>, then enter the actual reason and the tracking number.\u003c/li>\n\u003cli>Select \u003ccode>Deduction\u003c/code> and enter the deduction amount. The system records it as a negative amount automatically.\u003c/li>\n\u003cli>Before submitting, share the completed deduction details in the relevant hub's WeCom group.\u003c/li>\n\u003c/ol>\n","zh":"\u003col>\n\u003cli>Puppis → \u003ccode>HR Workbench\u003c/code> → \u003ccode>Salary Detail (New)\u003c/code> → \u003ccode>Add\u003c/code>\u003c/li>\n\u003cli>选择对应的 \u003ccode>Hub\u003c/code> 和 \u003ccode>Employee\u003c/code>，填写实际扣罚原因和具体运单号。\u003c/li>\n\u003cli>选择 \u003ccode>Deduction\u003c/code> 后直接填写扣罚金额，系统会自动按负数计算。\u003c/li>\n\u003cli>提交前，将已填写的扣罚信息发到所属 Hub 的 WeCom 群，同步本次扣罚情况。\u003c/li>\n\u003c/ol>\n"},"summary":{"en":"Puppis → HR Workbench → Salary Detail (New) → Add","zh":"Puppis → HR Workbench → Salary Detail (New) → Add"},"plain":{"en":"Puppis → HR Workbench → Salary Detail (New) → Add Select the relevant Hub and Employee, then enter the actual reason and the tracking number. Select Deduction and enter the deduction amount. The system records it as a negative amount automatically. Before submitting, share the completed deduction details in the relevant hub's WeCom group.","zh":"Puppis → HR Workbench → Salary Detail (New) → Add 选择对应的 Hub 和 Employee，填写实际扣罚原因和具体运单号。 选择 Deduction 后直接填写扣罚金额，系统会自动按负数计算。 提交前，将已填写的扣罚信息发到所属 Hub 的 WeCom 群，同步本次扣罚情况。"},"operation":"Puppis / WeCom","review":null,"keyCheck":{"en":"\u003cp>Before submitting, share the completed deduction details in the relevant hub's WeCom group.\u003c/p>\n","zh":"\u003cp>提交前，将已填写的扣罚信息发到所属 Hub 的 WeCom 群，同步本次扣罚情况。\u003c/p>\n"},"aliases":[]},{"id":"4-3/driver-top-ups","kind":"topic","title":{"en":"Driver top-ups","zh":"司机津贴"},"ordinal":"","body":{"en":"\u003cp>Additional payments for individual drivers are usually handled as parcel-level top-ups.\u003cbr />\nWhen a top-up is needed, discuss the reason in the relevant hub's WeCom group in advance and share the affected tracking numbers and top-up amounts.\u003c/p>\n\u003cp>The specific situations in which deductions and top-ups apply will be added later.\u003c/p>\n","zh":"\u003cp>个别司机的补贴一般按包裹做 Top up。\u003cbr />\n需要补贴时，提前在所属 Hub 的 WeCom 群沟通补贴原因，并发出涉及的运单号及补贴金额。\u003c/p>\n\u003cp>扣罚和补贴的具体适用场景后续补充。\u003c/p>\n"},"summary":{"en":"Additional payments for individual drivers are usually handled as parcel-level top-ups.","zh":"个别司机的补贴一般按包裹做 Top up。"},"plain":{"en":"Additional payments for individual drivers are usually handled as parcel-level top-ups. When a top-up is needed, discuss the reason in the relevant hub's WeCom group in advance and share the affected tracking numbers and top-up amounts. The specific situations in which deductions and top-ups apply will be added later.","zh":"个别司机的补贴一般按包裹做 Top up。 需要补贴时，提前在所属 Hub 的 WeCom 群沟通补贴原因，并发出涉及的运单号及补贴金额。 扣罚和补贴的具体适用场景后续补充。"},"operation":null,"review":null,"keyCheck":{"en":"","zh":""},"aliases":[]}]},{"id":"4-4","title":{"en":"Site Management","zh":"站点管理"},"part":"4","blocks":[{"id":"4-4","kind":"intro","title":{"en":"Site Management","zh":"站点管理"},"ordinal":"","body":{"en":"","zh":""},"summary":{"en":"","zh":""},"plain":{"en":"","zh":""},"operation":null,"review":null,"keyCheck":{"en":"","zh":""},"aliases":["staff schedule","shift roster","overtime","仓库排班"]},{"id":"4-4/staff-rosters","kind":"topic","title":{"en":"Staff rosters","zh":"排班"},"ordinal":"","body":{"en":"\u003cp>The hub supervisor manages the warehouse staff roster, normally scheduling each staff member for six days per week.\u003cbr />\nAvoid unnecessary overtime.\u003cbr />\nWhen overtime is needed for operations, request approval in advance through the hub's WeCom channel and schedule the overtime once it is approved.\u003c/p>\n","zh":"\u003cp>站点主管负责仓内员工排班，正常情况下按每人每周 6 天安排。\u003cbr />\n避免非必要加班。\u003cbr />\n确因运营需要加班时，提前通过所属 Hub 的 WeCom 申请，获批后再安排。\u003c/p>\n"},"summary":{"en":"The hub supervisor manages the warehouse staff roster, normally scheduling each staff member for six days per week.","zh":"站点主管负责仓内员工排班，正常情况下按每人每周 6 天安排。"},"plain":{"en":"The hub supervisor manages the warehouse staff roster, normally scheduling each staff member for six days per week. Avoid unnecessary overtime. When overtime is needed for operations, request approval in advance through the hub's WeCom channel and schedule the overtime once it is approved.","zh":"站点主管负责仓内员工排班，正常情况下按每人每周 6 天安排。 避免非必要加班。 确因运营需要加班时，提前通过所属 Hub 的 WeCom 申请，获批后再安排。"},"operation":null,"review":null,"keyCheck":{"en":"","zh":""},"aliases":[]},{"id":"4-4/overtime-records-and-requests","kind":"topic","title":{"en":"Overtime records and requests","zh":"加班工时与申请"},"ordinal":"","body":{"en":"\u003cp>Calculate operators' overtime hours using their actual clock-in and clock-out records.\u003cbr />\nSupervisors and team leaders must submit overtime requests in WeCom.\u003c/p>\n","zh":"\u003cp>Operator 的加班时长按打卡机记录的实际打卡时间核算。\u003cbr />\nSupervisor 和 Team Leader 需要在 WeCom 提交加班申请。\u003c/p>\n"},"summary":{"en":"Calculate operators' overtime hours using their actual clock-in and clock-out records.","zh":"Operator 的加班时长按打卡机记录的实际打卡时间核算。"},"plain":{"en":"Calculate operators' overtime hours using their actual clock-in and clock-out records. Supervisors and team leaders must submit overtime requests in WeCom.","zh":"Operator 的加班时长按打卡机记录的实际打卡时间核算。 Supervisor 和 Team Leader 需要在 WeCom 提交加班申请。"},"operation":null,"review":null,"keyCheck":{"en":"","zh":""},"aliases":[]}]},{"id":"5-1","title":{"en":"OFD Report (Daily)","zh":"OFD Report（每日）"},"part":"5","blocks":[{"id":"5-1","kind":"intro","title":{"en":"OFD Report (Daily)","zh":"OFD Report（每日）"},"ordinal":"","body":{"en":"\u003cp>Steps to be added.\u003c/p>\n","zh":"\u003cp>操作步骤待补。\u003c/p>\n"},"summary":{"en":"Steps to be added.","zh":"操作步骤待补。"},"plain":{"en":"Steps to be added.","zh":"操作步骤待补。"},"operation":null,"review":null,"keyCheck":{"en":"","zh":""},"aliases":[]}]},{"id":"5-2","title":{"en":"Financial Report (Daily)","zh":"Financial Report（每日）"},"part":"5","blocks":[{"id":"5-2","kind":"intro","title":{"en":"Financial Report (Daily)","zh":"Financial Report（每日）"},"ordinal":"","body":{"en":"\u003cp>Steps to be added.\u003c/p>\n","zh":"\u003cp>操作步骤待补。\u003c/p>\n"},"summary":{"en":"Steps to be added.","zh":"操作步骤待补。"},"plain":{"en":"Steps to be added.","zh":"操作步骤待补。"},"operation":null,"review":null,"keyCheck":{"en":"","zh":""},"aliases":[]}]},{"id":"5-3","title":{"en":"Drivers Performance (Daily)","zh":"Drivers Performance（每日）"},"part":"5","blocks":[{"id":"5-3","kind":"intro","title":{"en":"Drivers Performance (Daily)","zh":"Drivers Performance（每日）"},"ordinal":"","body":{"en":"\u003cp>Steps to be added.\u003c/p>\n","zh":"\u003cp>操作步骤待补。\u003c/p>\n"},"summary":{"en":"Steps to be added.","zh":"操作步骤待补。"},"plain":{"en":"Steps to be added.","zh":"操作步骤待补。"},"operation":null,"review":null,"keyCheck":{"en":"","zh":""},"aliases":[]}]},{"id":"5-4","title":{"en":"Stock Count Report (Weekly)","zh":"Stock Count Report（每周）"},"part":"5","blocks":[{"id":"5-4","kind":"intro","title":{"en":"Stock Count Report (Weekly)","zh":"Stock Count Report（每周）"},"ordinal":"","body":{"en":"\u003cp>Steps to be added.\u003c/p>\n","zh":"\u003cp>操作步骤待补。\u003c/p>\n"},"summary":{"en":"Steps to be added.","zh":"操作步骤待补。"},"plain":{"en":"Steps to be added.","zh":"操作步骤待补。"},"operation":null,"review":null,"keyCheck":{"en":"","zh":""},"aliases":[]}]}]}</script>
  <script>(() => {
  "use strict";
  const handbook = JSON.parse(document.getElementById("handbook-data").textContent);
  const byId = id => document.getElementById(id);
  const pages = new Map(handbook.pages.map(page => [page.id, page]));
  const parts = new Map(handbook.parts.map(part => [part.id, part]));
  const directory = byId("directory");
  const article = byId("document");
  const search = byId("search-dialog");
  const query = byId("query");
  const results = byId("results");
  const sheet = byId("sheet");
  const searchTrigger = byId("search-trigger");
  const labels = {
    en: {
      brand: "Hub Operations", search: "Search handbook", enter: "Open handbook",
      narrow: "Desktop preview · Open on a computer for the full layout.",
      skip: "Skip to content", contents: "Handbook contents", onPage: "On this page",
      placeholder: "Search steps, statuses or issues…", move: "Navigate", open: "Open",
      suggested: "Suggested pages", match: "matches", oneMatch: "1 match",
      noMatch: "No matching steps. Try a shorter phrase or a system term.",
      view: "View operation", viewReasons: "View reasons", viewStatuses: "View statuses", check: "To verify",
      closeSheet: "Close instructions", closeSearch: "Close search", table: "Scrollable table",
      step: "Step ", keyCheck: "Key check", next: "Next step", language: "Language", home: "GFS OPS home",
    },
    zh: {
      brand: "站点运营手册", search: "搜索手册", enter: "进入手册",
      narrow: "电脑端试读版 · 请在电脑上打开完整布局。",
      skip: "跳到正文", contents: "手册目录", onPage: "本页目录",
      placeholder: "搜索步骤、状态或现场问题…", move: "选择", open: "打开",
      suggested: "常查步骤", match: "条结果", oneMatch: "1 条结果",
      noMatch: "没有找到相关步骤。可试试较短的关键词或系统原名。",
      view: "查看操作", viewReasons: "查看原因", viewStatuses: "查看状态说明", check: "待核对",
      closeSheet: "关闭操作详情", closeSearch: "关闭搜索", table: "可滚动表格",
      step: "步骤 ", keyCheck: "操作要点", next: "下一步", language: "语言", home: "GFS OPS 首页",
    },
  };
  let lang = "en";
  try {
    if (localStorage.getItem("gfs-ops-language") === "zh") lang = "zh";
  } catch { /* Allow file URLs where browser storage is disabled. */ }

  let drawnPage = null;
  let drawnLanguage = null;
  let currentResults = [];
  let selectedResult = 0;
  let sheetOrigin = null;
  let searchOrigin = null;
  let skipRestore = false;

  const t = key => labels[lang][key];
  const esc = value => String(value).replace(/[&<>"']/g, char =>
    ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" })[char]);
  const operationName = block => lang === "zh"
    ? block.operation.replace("Driver App", "司机 App").replace("System", "系统")
    : block.operation;
  const pathFor = page => parts.get(page.part).title[lang] + " / " + page.id;
  const labelFor = block => block.ordinal
    ? t("step") + block.ordinal + " · " + block.title[lang]
    : block.title[lang];
  const chapterLink = (page, content, css = "") =>
    '<a class="' + css + '" href="#' + esc(page.id) + '">' + content + "</a>";

  function chapterNav(activePage) {
    if (drawnLanguage !== lang) {
      const openParts = new Set([...directory.querySelectorAll("details[open]")]
        .map(group => group.dataset.part));
      directory.innerHTML =
        '<p class="directory-title">' + t("contents") + "</p>" +
        handbook.parts.map(part =>
          '<details class="nav-group" data-part="' + esc(part.id) + '"' +
          (openParts.has(part.id) ? " open" : "") + '><summary class="group-title">' +
          '<span class="number">' + esc(part.id.padStart(2, "0")) +
          "</span><span>" + esc(part.title[lang]) + "</span></summary><ol>" +
          part.pages.map(id => {
            const page = pages.get(id);
            return '<li><a class="nav-link" href="#' + esc(id) + '">' +
              '<span class="number">' + esc(id) + "</span><span>" + esc(page.title[lang]) +
              "</span></a></li>";
          }).join("") + "</ol></details>"
        ).join("");
    }

    directory.querySelector('[aria-current="page"]')?.removeAttribute("aria-current");
    directory.querySelector("[data-current]")?.removeAttribute("data-current");
    const link = directory.querySelector('a[href="#' + activePage.id + '"]');
    const group = link.closest("details");
    link.setAttribute("aria-current", "page");
    group.dataset.current = "true";
    if (drawnPage !== activePage.id) group.open = true;
  }

  function alertFor(block) {
    return block.review
      ? '<p class="callout"><strong>' + t("check") + "</strong> " + esc(block.review[lang]) + "</p>"
      : "";
  }

  function blockHTML(block) {
    const title = esc(block.title[lang]);
    const full = block.body[lang];
    if (block.kind === "intro") {
      return full.trim() ? '<div class="content-block intro prose">' + full + "</div>" : "";
    }

    const ordinal = block.ordinal
      ? '<span class="step-number" aria-label="' + t("step") + esc(block.ordinal) + '">' +
        esc(block.ordinal.padStart(2, "0")) + "</span>"
      : "";
    let action = "";
    let body = '<div class="prose">' + full + "</div>";
    if (block.operation) {
      const verbs = { "1-5/real-time-query": "viewStatuses", "2-2/failure-reasons": "viewReasons" };
      const verb = t(verbs[block.id] || "view");
      const system = operationName(block);
      action = '<button class="operation" type="button" data-operation="' + esc(block.id) +
        '" aria-haspopup="dialog" aria-label="' + esc(verb + " · " + block.title[lang]) +
        '"><span>' + esc(system) + "</span><span>" + esc(verb) +
        '</span><span class="arrow" aria-hidden="true">↗</span></button>';
      body = '<p class="step-summary">' + esc(block.summary[lang]) + '</p>' +
        '<div class="prose print-detail">' + full + "</div>";
      if (block.keyCheck[lang]) {
        body += '<div class="prose key-check"><strong>' + t("keyCheck") +
          "</strong>" + block.keyCheck[lang] + "</div>";
      }
    }
    const heading = block.kind === "subtopic" ? "h3" : "h2";
    return '<section id="' + esc(block.id) + '" class="content-block ' + block.kind +
      '" tabindex="-1">' + ordinal + '<div class="block-content"><div class="block-head"><' + heading + '>' +
      title + "</" + heading + ">" + action + "</div>" + body + alertFor(block) + "</div></section>";
  }

  function presentPage(page) {
    chapterNav(page);
    const index = handbook.pages.indexOf(page);
    const adjacent = [handbook.pages[index - 1], handbook.pages[index + 1]];
    const previous = adjacent[0] ? chapterLink(adjacent[0], "← " + esc(adjacent[0].title[lang])) : "";
    const next = adjacent[1] ? chapterLink(adjacent[1], esc(adjacent[1].title[lang]) + " →") : "";
    article.innerHTML =
      '<p class="breadcrumb"><span>' + esc(parts.get(page.part).title[lang]) +
      '</span><span aria-hidden="true">/</span><span>' + esc(page.id) + "</span></p>" +
      page.blocks.map(blockHTML).join("") +
      '<nav class="pager" aria-label="' + t("contents") + '">' + previous + next + "</nav>";
    const heading = document.createElement("h1");
    heading.id = "chapter-title";
    heading.tabIndex = -1;
    heading.textContent = page.title[lang];
    article.querySelector(".breadcrumb").after(heading);
    article.querySelectorAll(".table-scroll").forEach(el => el.setAttribute("aria-label", t("table")));

    const articleBlocks = page.blocks.filter(block => block.kind !== "intro");
    byId("page-rail").hidden = articleBlocks.length === 0;
    byId("page-links").innerHTML =
      '<p class="toc-title">' + t("onPage") + "</p><ol>" +
      articleBlocks.map(block =>
        '<li><a class="toc-link' + (block.kind === "subtopic" ? ' toc-subtopic' : '') +
        '" href="#' + esc(block.id) + '">' + esc(labelFor(block)) + "</a></li>"
      ).join("") + "</ol>";
  }

  function positionPage({ focus = true, reposition = true } = {}) {
    const requested = location.hash.slice(1);
    const route = requested === "3-1/step-6" ? "3-1/step-5" : requested;
    const page = pages.get(route.split("/")[0]);
    byId("cover").hidden = Boolean(page);
    byId("manual").hidden = !page;
    document.body.dataset.view = page ? "manual" : "cover";
    if (!page) {
      document.title = "GFS OPS · " + t("brand");
      if (reposition) window.scrollTo(0, 0);
      if (focus) byId("content").focus({preventScroll: true});
      return;
    }
    if (drawnPage !== page.id || drawnLanguage !== lang) {
      presentPage(page);
      drawnPage = page.id;
      drawnLanguage = lang;
    }
    document.title = page.title[lang] + " · GFS OPS";
    const section = route.includes("/") ? byId(route) : null;
    article.querySelectorAll("[data-selected]").forEach(el => el.removeAttribute("data-selected"));
    byId("page-links").querySelectorAll(".toc-link").forEach(link => {
      if (section && link.getAttribute("href") === "#" + route) {
        link.setAttribute("aria-current", "location");
      } else {
        link.removeAttribute("aria-current");
      }
    });
    if (section) section.dataset.selected = "true";
    if (reposition) {
      if (section) section.scrollIntoView({ block: "start" });
      else window.scrollTo(0, 0);
    }
    if (focus) (section || byId("chapter-title")).focus({ preventScroll: true });
  }

  function go(route) {
    if (location.hash !== "#" + route) history.pushState(null, "", "#" + route);
    positionPage();
  }

  function applyLanguage() {
    document.documentElement.lang = lang === "zh" ? "zh-CN" : "en";
    document.querySelectorAll("[data-label]").forEach(el => { el.textContent = t(el.dataset.label); });
    document.querySelectorAll("[data-language]").forEach(button =>
      button.setAttribute("aria-pressed", String(button.dataset.language === lang)));
    document.querySelector(".wordmark").setAttribute("aria-label", t("home"));
    document.querySelector(".languages").setAttribute("aria-label", t("language"));
    directory.setAttribute("aria-label", t("contents"));
    byId("page-links").setAttribute("aria-label", t("onPage"));
    query.placeholder = t("placeholder");
    query.setAttribute("aria-label", t("search"));
    document.querySelector('[data-close="search"]').setAttribute("aria-label", t("closeSearch"));
    document.querySelector('[data-close="sheet"]').setAttribute("aria-label", t("closeSheet"));
    positionPage({ focus: false, reposition: false });
  }

  function showSheet(button) {
    const page = pages.get(button.dataset.operation.split("/")[0]);
    const block = page.blocks.find(item => item.id === button.dataset.operation);
    sheetOrigin = button;
    sheet.dataset.operation = block.id;
    byId("sheet-path").textContent = pathFor(page) + " / " + operationName(block);
    const sheetTitle = byId("sheet-title");
    sheetTitle.textContent = labelFor(block);
    sheetTitle.tabIndex = -1;
    const following = page.blocks[page.blocks.indexOf(block) + 1];
    const next = block.kind === "step" && following?.kind === "step" ? following : null;
    const nextLink = next
      ? '<a class="sheet-next" href="#' + esc(next.id) + '"><span>' + t("next") +
        '</span><strong>' + esc(next.title[lang]) + ' →</strong></a>'
      : "";
    byId("sheet-body").innerHTML = block.body[lang] + alertFor(block) + nextLink;
    byId("sheet-body").querySelectorAll(".table-scroll").forEach(el =>
      el.setAttribute("aria-label", t("table")));
    sheet.showModal();
    sheet.querySelector(".sheet-content").scrollTop = 0;
    sheetTitle.focus({ preventScroll: true });
  }

  function normalize(value) {
    return value.normalize("NFKD").toLowerCase().replace(/\p{M}/gu, "")
      .replace(/[^\p{L}\p{N}]+/gu, " ").trim();
  }

  function oneEdit(first, second) {
    if (first.length < 5 || Math.abs(first.length - second.length) > 1) return false;
    let left = 0;
    while (left < first.length && first[left] === second[left]) left++;
    if (first.length !== second.length) {
      return first.length > second.length
        ? first.slice(left + 1) === second.slice(left)
        : second.slice(left + 1) === first.slice(left);
    }
    const sameSuffix = first.slice(left + 1) === second.slice(left + 1);
    const transposed = first[left] === second[left + 1] && first[left + 1] === second[left] &&
      first.slice(left + 2) === second.slice(left + 2);
    return sameSuffix || transposed;
  }

  const searchable = handbook.pages.flatMap(page => page.blocks.map(block => {
    const titles = [block.title.en, block.title.zh, block.id].map(normalize);
    const aliases = block.aliases.map(normalize);
    const body = normalize(block.plain.en + " " + block.plain.zh);
    const terms = new Set([...titles, ...aliases, body].join(" ").split(" "));
    const codes = [...block.body.en.matchAll(/<code>([^<]+)<\/code>/g)]
      .map(match => normalize(match[1]));
    return { page, block, titles, aliases, body, terms, codes };
  }));
  const suggestions = ["2-1/step-5", "2-2/failure-reasons", "3-1/step-5", "4-2/financial"];
  const suggestedResults = suggestions.map(id => searchable.find(item => item.block.id === id)).filter(Boolean);

  function relevance(item, phrase) {
    if (item.titles.includes(phrase)) return 140;
    if (item.codes.includes(phrase) && (phrase.includes(" ") || /^[a-z0-9]{2,}$/.test(phrase))) return 122;
    if (item.aliases.includes(phrase)) return 117;
    if (item.titles.some(title => title.includes(phrase))) return 95;
    if (item.aliases.some(alias => alias.includes(phrase))) return 85;
    if (item.body.includes(phrase)) return 72;

    const tokens = phrase.split(" ");
    if (tokens.length === 1 && tokens[0].length < 5) return 0;
    let exact = 0;
    for (const token of tokens) {
      if (item.terms.has(token)) {
        exact++;
      } else if (token.length >= 5 && [...item.terms].some(term => oneEdit(token, term))) {
        continue;
      } else {
        return 0;
      }
    }
    if (tokens.length === 1 && item.aliases.some(alias => oneEdit(phrase, alias))) return 65;
    const fuzzyTitle = tokens.length === 1 &&
      [...item.titles, ...item.aliases].some(title => title.split(" ").some(term => oneEdit(phrase, term)));
    return fuzzyTitle ? 55 : 35 + exact;
  }

  function excerptFor(item, raw) {
    const text = item.block.plain[lang] || item.block.summary[lang] || "";
    const queryText = raw.trim();
    const hit = queryText ? text.toLowerCase().indexOf(queryText.toLowerCase()) : -1;
    if (!text) return "";
    if (hit < 0) return esc(text.length > 115 ? text.slice(0, 112) + "…" : text);
    const start = Math.max(0, hit - 29);
    const end = Math.min(text.length, hit + queryText.length + 73);
    return (start ? "…" : "") + esc(text.slice(start, hit)) + "<mark>" +
      esc(text.slice(hit, hit + queryText.length)) + "</mark>" +
      esc(text.slice(hit + queryText.length, end)) + (end < text.length ? "…" : "");
  }

  function pickResult(index, moveFocus) {
    if (!currentResults.length) return;
    selectedResult = Math.min(Math.max(index, 0), currentResults.length - 1);
    const links = Array.from(results.querySelectorAll(".result"));
    links.forEach((link, position) => {
      link.dataset.active = String(position === selectedResult);
    });
    if (moveFocus) {
      links[selectedResult].focus({ preventScroll: true });
      links[selectedResult].scrollIntoView({ block: "nearest" });
    }
  }

  function updateResults() {
    const phrase = normalize(query.value);
    const ranked = phrase ? searchable.map(item => ({ item, score: relevance(item, phrase) }))
      .filter(hit => hit.score > 0).sort((a, b) => b.score - a.score) : [];
    currentResults = phrase ? ranked.map(hit => hit.item) : suggestedResults;
    const count = ranked.length;
    byId("result-status").textContent = phrase
      ? (count === 1 ? t("oneMatch") : count + " " + t("match"))
      : t("suggested");
    results.innerHTML = currentResults.length
      ? currentResults.map((item, i) => {
        const chapter = pathFor(item.page) + (item.block.kind === "intro" ? "" : " / " + item.page.title[lang]);
        const excerpt = excerptFor(item, query.value);
        return '<a class="result" data-result="' + i + '" href="#' + esc(item.block.id) + '">' +
          '<span class="result-path">' + esc(chapter) + '</span><span class="result-title">' +
          esc(labelFor(item.block)) + "</span>" +
          (excerpt ? '<span class="result-excerpt">' + excerpt + "</span>" : "") + "</a>";
      }).join("")
      : '<p class="empty">' + t("noMatch") + "</p>";
    results.scrollTop = 0;
    pickResult(0, false);
  }

  function showSearch() {
    if (sheet.open) return;
    if (!search.open) {
      searchOrigin = document.activeElement;
      search.showModal();
    }
    updateResults();
    query.focus();
    query.select();
  }

  function followSearch(item) {
    if (!item) return;
    skipRestore = true;
    search.close();
    go(item.block.id);
  }

  searchTrigger.addEventListener("click", showSearch);
  query.addEventListener("input", updateResults);
  search.addEventListener("close", () => {
    if (!skipRestore) (searchOrigin?.isConnected ? searchOrigin : searchTrigger).focus({preventScroll: true});
    skipRestore = false;
  });
  sheet.addEventListener("close", () => {
    if (sheetOrigin?.isConnected) sheetOrigin.focus({ preventScroll: true });
  });
  for (const dialog of [search, sheet]) {
    dialog.addEventListener("click", event => {
      if (event.target !== dialog) return;
      const bounds = dialog.getBoundingClientRect();
      if (event.clientX < bounds.left || event.clientX > bounds.right ||
          event.clientY < bounds.top || event.clientY > bounds.bottom) dialog.close();
    });
  }
  search.addEventListener("keydown", event => {
    if (event.isComposing) return;
    if (event.key === "Escape") {
      event.preventDefault();
      search.close();
      return;
    }
    if (!currentResults.length) return;
    const result = event.target.closest("[data-result]");
    if (event.key === "ArrowDown" || event.key === "ArrowUp") {
      event.preventDefault();
      const index = result ? Number(result.dataset.result) : -1;
      if (event.key === "ArrowUp" && index <= 0) {
        query.focus();
        pickResult(0, false);
      } else {
        pickResult(index + (event.key === "ArrowDown" ? 1 : -1), true);
      }
    } else if (event.key === "Enter" && event.target === query) {
      event.preventDefault();
      followSearch(currentResults[selectedResult]);
    }
  });
  document.addEventListener("keydown", event => {
    if ((event.metaKey || event.ctrlKey) && event.key.toLowerCase() === "k" && !sheet.open) {
      event.preventDefault();
      showSearch();
    }
  });
  document.addEventListener("click", event => {
    const control = event.target.closest("a, button");
    if (!control) return;
    const { language, operation, close, result } = control.dataset;
    if (language && lang !== language) {
      lang = language;
      try { localStorage.setItem("gfs-ops-language", lang); } catch { /* Optional preference. */ }
      applyLanguage();
    } else if (operation) {
      showSheet(control);
    } else if (close) {
      (close === "sheet" ? sheet : search).close();
    } else if (result !== undefined && !event.metaKey && !event.ctrlKey && !event.shiftKey) {
      event.preventDefault();
      followSearch(currentResults[Number(result)]);
    } else if (control.id === "skip") {
      event.preventDefault();
      (byId("chapter-title")?.closest("[hidden]") ? byId("content") :
        byId("chapter-title") || byId("content")).focus();
    } else {
      const href = control.getAttribute("href");
      if (href?.startsWith("#") && !event.metaKey && !event.ctrlKey && !event.shiftKey && !event.altKey) {
        event.preventDefault();
        if (sheet.open) {
          sheetOrigin = null;
          sheet.close();
        }
        go(href.slice(1));
      }
    }
  });
  window.addEventListener("hashchange", () => positionPage());
  byId("search-key").textContent = /mac/i.test(navigator.platform) ? "⌘ K" : "Ctrl K";
  applyLanguage();
  positionPage({ focus: false });
})();
</script>
</body>
</html>
