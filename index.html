ts page and circle the Target date range and the Created count.","zh":"截取查询结果页面，圈出 Target 日期范围和 Created 数量。"},"notes":{"en":"","zh":""},"plain":{"en":"Take a screenshot of the results page and circle the Target date range and the Created count. Fill in the report text in the format below and send it with the screenshot to the reporting group.","zh":"截取查询结果页面，圈出 Target 日期范围和 Created 数量。 按下方格式填写汇报文字，连同截图发到汇报群。"},"operation":null,"review":null,"keyCheck":{"en":"","zh":""},"aliases":[]},{"id":"5-1/report-format","kind":"topic","title":{"en":"Report Format","zh":"汇报格式"},"ordinal":"","body":{"en":"\u003cdiv class=\"table-scroll\" tabindex=\"0\" role=\"region\" aria-label=\"Table\">\u003ctable>\n\u003cthead>\n\u003ctr>\n  \u003cth>Report text example\u003c/th>\n\u003c/tr>\n\u003c/thead>\n\u003ctbody>\n\u003ctr>\n  \u003ctd>\u003ccode>Bloemfontein Hub OFD Monitor Report 12 November 2026\u003c/code>\u003cbr>\u003ccode>13 Oct 26 to 12 Nov 26\u003c/code>\u003cbr>\u003ccode>Total Pending : 119\u003c/code>\u003cbr>\u003ccode>Find Out : 119\u003c/code>\u003cbr>\u003ccode>To Be Dispatched : 119\u003c/code>\u003cbr>\u003ccode>Still Searching : 00\u003c/code>\u003cbr>\u003ccode>Lost Confirmed: 00\u003c/code>\u003c/td>\n\u003c/tr>\n\u003c/tbody>\n\u003c/table>\u003c/div>\n","zh":"\u003cdiv class=\"table-scroll\" tabindex=\"0\" role=\"region\" aria-label=\"Table\">\u003ctable>\n\u003cthead>\n\u003ctr>\n  \u003cth>汇报文字示例\u003c/th>\n\u003c/tr>\n\u003c/thead>\n\u003ctbody>\n\u003ctr>\n  \u003ctd>\u003ccode>Bloemfontein Hub OFD Monitor Report 12 November 2026\u003c/code>\u003cbr>\u003ccode>13 Oct 26 to 12 Nov 26\u003c/code>\u003cbr>\u003ccode>Total Pending : 119\u003c/code>\u003cbr>\u003ccode>Find Out : 119\u003c/code>\u003cbr>\u003ccode>To Be Dispatched : 119\u003c/code>\u003cbr>\u003ccode>Still Searching : 00\u003c/code>\u003cbr>\u003ccode>Lost Confirmed: 00\u003c/code>\u003c/td>\n\u003c/tr>\n\u003c/tbody>\n\u003c/table>\u003c/div>\n"},"summary":{"en":"| Report text example |","zh":"| 汇报文字示例 |"},"notes":{"en":"","zh":""},"plain":{"en":"Report text example Bloemfontein Hub OFD Monitor Report 12 November 2026 13 Oct 26 to 12 Nov 26 Total Pending : 119 Find Out : 119 To Be Dispatched : 119 Still Searching : 00 Lost Confirmed: 00","zh":"汇报文字示例 Bloemfontein Hub OFD Monitor Report 12 November 2026 13 Oct 26 to 12 Nov 26 Total Pending : 119 Find Out : 119 To Be Dispatched : 119 Still Searching : 00 Lost Confirmed: 00"},"operation":null,"review":null,"keyCheck":{"en":"","zh":""},"aliases":[]},{"id":"5-1/notes","kind":"topic","title":{"en":"Notes","zh":"注意事项"},"ordinal":"","body":{"en":"\u003cul>\n\u003cli>The second line shows the \u003ccode>Target\u003c/code> date range and must match the screenshot.\u003c/li>\n\u003cli>Check the warehouse and the tracking history before confirming a parcel as lost. See section \u003ca href=\"#1-5\">1-5\u003c/a> for the LOST status.\u003c/li>\n\u003c/ul>\n","zh":"\u003cul>\n\u003cli>第二行写 \u003ccode>Target\u003c/code> 的日期范围，与截图一致。\u003c/li>\n\u003cli>确认丢失前需先核实实物和轨迹，LOST 状态说明见 \u003ca href=\"#1-5\">1-5\u003c/a>。\u003c/li>\n\u003c/ul>\n"},"summary":{"en":"The second line shows the Target date range and must match the screenshot.","zh":"第二行写 Target 的日期范围，与截图一致。"},"notes":{"en":"","zh":""},"plain":{"en":"The second line shows the Target date range and must match the screenshot. Check the warehouse and the tracking history before confirming a parcel as lost. See section 1-5 for the LOST status.","zh":"第二行写 Target 的日期范围，与截图一致。 确认丢失前需先核实实物和轨迹，LOST 状态说明见 1-5。"},"operation":null,"review":null,"keyCheck":{"en":"","zh":""},"aliases":[]}]},{"id":"5-2","title":{"en":"Financial Report (Daily)","zh":"Financial Report（每日）"},"part":"5","blocks":[{"id":"5-2","kind":"intro","title":{"en":"Financial Report (Daily)","zh":"Financial Report（每日）"},"ordinal":"","body":{"en":"","zh":""},"summary":{"en":"","zh":""},"notes":{"en":"","zh":""},"plain":{"en":"","zh":""},"operation":null,"review":null,"keyCheck":{"en":"","zh":""},"aliases":[]},{"id":"5-2/when-this-applies","kind":"topic","title":{"en":"When This Applies","zh":"适用情况"},"ordinal":"","body":{"en":"\u003cp>Every day, report how many \u003ccode>Financial\u003c/code> tasks are still unconfirmed and why.\u003cbr />\nFor how to confirm Financial tasks, see section \u003ca href=\"#4-2\">4-2\u003c/a>.\u003c/p>\n","zh":"\u003cp>每天汇报尚未确认的 \u003ccode>Financial\u003c/code> 任务数量及原因。\u003cbr />\nFinancial 确认的操作见 \u003ca href=\"#4-2\">4-2\u003c/a>。\u003c/p>\n"},"summary":{"en":"Every day, report how many Financial tasks are still unconfirmed and why.","zh":"每天汇报尚未确认的 Financial 任务数量及原因。"},"notes":{"en":"","zh":""},"plain":{"en":"Every day, report how many Financial tasks are still unconfirmed and why. For how to confirm Financial tasks, see section 4-2.","zh":"每天汇报尚未确认的 Financial 任务数量及原因。 Financial 确认的操作见 4-2。"},"operation":null,"review":null,"keyCheck":{"en":"","zh":""},"aliases":[]},{"id":"5-2/step-1","kind":"step","title":{"en":"Open the Financial Page","zh":"进入 Financial 页面"},"ordinal":"1","body":{"en":"\u003col>\n\u003cli>Puppis → \u003ccode>Task\u003c/code> → \u003ccode>Financial\u003c/code>\u003c/li>\n\u003c/ol>\n","zh":"\u003col>\n\u003cli>Puppis → \u003ccode>Task\u003c/code> → \u003ccode>Financial\u003c/code>\u003c/li>\n\u003c/ol>\n"},"summary":{"en":"Puppis → Task → Financial","zh":"Puppis → Task → Financial"},"notes":{"en":"","zh":""},"plain":{"en":"Puppis → Task → Financial","zh":"Puppis → Task → Financial"},"operation":null,"review":null,"keyCheck":{"en":"","zh":""},"aliases":[]},{"id":"5-2/step-2","kind":"step","title":{"en":"Set the Receive Date and Query","zh":"设置 Receive Date 并查询"},"ordinal":"2","body":{"en":"\u003col>\n\u003cli>Click the \u003ccode>Receive Date\u003c/code> box and choose the 30 days ending two days ago. For example, if today is 12 Nov, choose 12 Oct to 10 Nov.\u003c/li>\n\u003cli>Click \u003ccode>OK\u003c/code>, then click \u003ccode>Query\u003c/code>.\u003c/li>\n\u003c/ol>\n\u003cp>\u003cimg src=\"images/ch5/5-2-receive-date.webp\" alt=\"Financial: Receive Date range, then OK\" width=\"1400\" height=\"785\" loading=\"lazy\" decoding=\"async\" tabindex=\"0\" data-zoom>\u003c/p>\n","zh":"\u003col>\n\u003cli>点击 \u003ccode>Receive Date\u003c/code> 日期框，选择截至两天前的 30 天。例如今天为 12 Nov，选择 12 Oct 至 10 Nov。\u003c/li>\n\u003cli>点击 \u003ccode>OK\u003c/code>，再点击 \u003ccode>Query\u003c/code>。\u003c/li>\n\u003c/ol>\n\u003cp>\u003cimg src=\"images/ch5/5-2-receive-date.webp\" alt=\"Financial: Receive Date range, then OK\" width=\"1400\" height=\"785\" loading=\"lazy\" decoding=\"async\" tabindex=\"0\" data-zoom>\u003c/p>\n"},"summary":{"en":"Click the Receive Date box and choose the 30 days ending two days ago. For example, if today is 12 Nov, choose 12 Oct to 10 Nov.","zh":"点击 Receive Date 日期框，选择截至两天前的 30 天。例如今天为 12 Nov，选择 12 Oct 至 10 Nov。"},"notes":{"en":"","zh":""},"plain":{"en":"Click the Receive Date box and choose the 30 days ending two days ago. For example, if today is 12 Nov, choose 12 Oct to 10 Nov. Click OK, then click Query.","zh":"点击 Receive Date 日期框，选择截至两天前的 30 天。例如今天为 12 Nov，选择 12 Oct 至 10 Nov。 点击 OK，再点击 Query。"},"operation":null,"review":null,"keyCheck":{"en":"","zh":""},"aliases":[]},{"id":"5-2/step-3","kind":"step","title":{"en":"Read the Counts and Send the Report","zh":"读取数量并发送汇报"},"ordinal":"3","body":{"en":"\u003col>\n\u003cli>Check the counts on the \u003ccode>UnConfirm\u003c/code>, \u003ccode>Confirmed\u003c/code> and \u003ccode>Holding\u003c/code> tabs.\u003c/li>\n\u003cli>Find out why each task under \u003ccode>UnConfirm\u003c/code> has not been confirmed.\u003c/li>\n\u003cli>Take a screenshot of the results page, fill in the report text in the format below and send both to the reporting group.\u003c/li>\n\u003c/ol>\n\u003cp>\u003cimg src=\"images/ch5/5-2-finished-report.webp\" alt=\"Financial report text with the marked-up Financial screenshot\" width=\"1255\" height=\"957\" loading=\"lazy\" decoding=\"async\" tabindex=\"0\" data-zoom>\u003c/p>\n","zh":"\u003col>\n\u003cli>查看 \u003ccode>UnConfirm\u003c/code>、\u003ccode>Confirmed\u003c/code> 和 \u003ccode>Holding\u003c/code> 标签的数量。\u003c/li>\n\u003cli>对 \u003ccode>UnConfirm\u003c/code> 中的任务逐一查明未确认原因。\u003c/li>\n\u003cli>截取查询结果页面，按下方格式填写汇报文字，一起发到汇报群。\u003c/li>\n\u003c/ol>\n\u003cp>\u003cimg src=\"images/ch5/5-2-finished-report.webp\" alt=\"Financial report text with the marked-up Financial screenshot\" width=\"1255\" height=\"957\" loading=\"lazy\" decoding=\"async\" tabindex=\"0\" data-zoom>\u003c/p>\n"},"summary":{"en":"Check the counts on the UnConfirm, Confirmed and Holding tabs.","zh":"查看 UnConfirm、Confirmed 和 Holding 标签的数量。"},"notes":{"en":"","zh":""},"plain":{"en":"Check the counts on the UnConfirm, Confirmed and Holding tabs. Find out why each task under UnConfirm has not been confirmed. Take a screenshot of the results page, fill in the report text in the format below and send both to the reporting group.","zh":"查看 UnConfirm、Confirmed 和 Holding 标签的数量。 对 UnConfirm 中的任务逐一查明未确认原因。 截取查询结果页面，按下方格式填写汇报文字，一起发到汇报群。"},"operation":null,"review":null,"keyCheck":{"en":"","zh":""},"aliases":[]},{"id":"5-2/report-format","kind":"topic","title":{"en":"Report Format","zh":"汇报格式"},"ordinal":"","body":{"en":"\u003cdiv class=\"table-scroll\" tabindex=\"0\" role=\"region\" aria-label=\"Table\">\u003ctable>\n\u003cthead>\n\u003ctr>\n  \u003cth>Report text example\u003c/th>\n\u003c/tr>\n\u003c/thead>\n\u003ctbody>\n\u003ctr>\n  \u003ctd>\u003ccode>BLOEMFONTEIN FINANCIAL REPORT 12/11/2026\u003c/code>\u003cbr>\u003ccode>FROM 12/10/2026 TO 10/11/2026\u003c/code>\u003cbr>\u003ccode>UNCONFIRMED:04\u003c/code>\u003cbr>\u003ccode>HOLDING:00\u003c/code>\u003cbr>\u003ccode>reason of unconfirmed: &lt;reason&gt;\u003c/code>\u003c/td>\n\u003c/tr>\n\u003c/tbody>\n\u003c/table>\u003c/div>\n","zh":"\u003cdiv class=\"table-scroll\" tabindex=\"0\" role=\"region\" aria-label=\"Table\">\u003ctable>\n\u003cthead>\n\u003ctr>\n  \u003cth>汇报文字示例\u003c/th>\n\u003c/tr>\n\u003c/thead>\n\u003ctbody>\n\u003ctr>\n  \u003ctd>\u003ccode>BLOEMFONTEIN FINANCIAL REPORT 12/11/2026\u003c/code>\u003cbr>\u003ccode>FROM 12/10/2026 TO 10/11/2026\u003c/code>\u003cbr>\u003ccode>UNCONFIRMED:04\u003c/code>\u003cbr>\u003ccode>HOLDING:00\u003c/code>\u003cbr>\u003ccode>reason of unconfirmed: &lt;reason&gt;\u003c/code>\u003c/td>\n\u003c/tr>\n\u003c/tbody>\n\u003c/table>\u003c/div>\n"},"summary":{"en":"| Report text example |","zh":"| 汇报文字示例 |"},"notes":{"en":"","zh":""},"plain":{"en":"Report text example BLOEMFONTEIN FINANCIAL REPORT 12/11/2026 FROM 12/10/2026 TO 10/11/2026 UNCONFIRMED:04 HOLDING:00 reason of unconfirmed: \u003creason>","zh":"汇报文字示例 BLOEMFONTEIN FINANCIAL REPORT 12/11/2026 FROM 12/10/2026 TO 10/11/2026 UNCONFIRMED:04 HOLDING:00 reason of unconfirmed: \u003creason>"},"operation":null,"review":null,"keyCheck":{"en":"","zh":""},"aliases":[]},{"id":"5-2/notes","kind":"topic","title":{"en":"Notes","zh":"注意事项"},"ordinal":"","body":{"en":"\u003cul>\n\u003cli>Use the DD/MM/YYYY date format. The second line must match the selected \u003ccode>Receive Date\u003c/code>.\u003c/li>\n\u003cli>If \u003ccode>UNCONFIRMED\u003c/code> is not 0, always give the reason.\u003c/li>\n\u003c/ul>\n","zh":"\u003cul>\n\u003cli>日期使用 DD/MM/YYYY 格式，第二行与所选 \u003ccode>Receive Date\u003c/code> 一致。\u003c/li>\n\u003cli>\u003ccode>UNCONFIRMED\u003c/code> 不为 0 时，必须写明原因。\u003c/li>\n\u003c/ul>\n"},"summary":{"en":"Use the DD/MM/YYYY date format. The second line must match the selected Receive Date.","zh":"日期使用 DD/MM/YYYY 格式，第二行与所选 Receive Date 一致。"},"notes":{"en":"","zh":""},"plain":{"en":"Use the DD/MM/YYYY date format. The second line must match the selected Receive Date. If UNCONFIRMED is not 0, always give the reason.","zh":"日期使用 DD/MM/YYYY 格式，第二行与所选 Receive Date 一致。 UNCONFIRMED 不为 0 时，必须写明原因。"},"operation":null,"review":null,"keyCheck":{"en":"","zh":""},"aliases":[]}]},{"id":"5-3","title":{"en":"Drivers Performance (Daily)","zh":"Drivers Performance（每日）"},"part":"5","blocks":[{"id":"5-3","kind":"intro","title":{"en":"Drivers Performance (Daily)","zh":"Drivers Performance（每日）"},"ordinal":"","body":{"en":"","zh":""},"summary":{"en":"","zh":""},"notes":{"en":"","zh":""},"plain":{"en":"","zh":""},"operation":null,"review":null,"keyCheck":{"en":"","zh":""},"aliases":[]},{"id":"5-3/when-this-applies","kind":"topic","title":{"en":"When This Applies","zh":"适用情况"},"ordinal":"","body":{"en":"\u003cp>Every day, report the drivers' delivery success rate for the previous day.\u003cbr />\nExport yesterday's OFD List from Puppis, then use the offline script \u003ccode>Auto Driver Performance.html\u003c/code> to produce the report text and the Excel file.\u003c/p>\n\u003cp>\u003ca class=\"tool-link\" href=\"tools/auto-driver-performance.html\" target=\"_blank\" rel=\"noopener\">Open the script (new tab)\u003c/a> \u003ca class=\"tool-link tool-link-secondary\" href=\"tools/auto-driver-performance.html\" download=\"Auto Driver Performance.html\">Download the script\u003c/a>\u003c/p>\n\u003cp>To use it offline, click Download the script, or right-click the link and choose Save link as. Save the file to your computer, then double-click it to open it.\u003c/p>\n","zh":"\u003cp>每天汇报前一天的司机派送成功率。\u003cbr />\n先从 Puppis 导出昨天的 OFD List，再用离线脚本 \u003ccode>Auto Driver Performance.html\u003c/code> 生成汇报文字和 Excel 文件。\u003c/p>\n\u003cp>\u003ca class=\"tool-link\" href=\"tools/auto-driver-performance.html\" target=\"_blank\" rel=\"noopener\">打开脚本（新标签页）\u003c/a> \u003ca class=\"tool-link tool-link-secondary\" href=\"tools/auto-driver-performance.html\" download=\"Auto Driver Performance.html\">下载脚本\u003c/a>\u003c/p>\n\u003cp>如需离线使用，点击“下载脚本”，或右键点击链接并选择“链接另存为”，将文件保存到电脑后双击打开。\u003c/p>\n"},"summary":{"en":"Every day, report the drivers' delivery success rate for the previous day.","zh":"每天汇报前一天的司机派送成功率。"},"notes":{"en":"","zh":""},"plain":{"en":"Every day, report the drivers' delivery success rate for the previous day. Export yesterday's OFD List from Puppis, then use the offline script Auto Driver Performance.html to produce the report text and the Excel file. Open the script (new tab) Download the script To use it offline, click Download the script, or right-click the link and choose Save link as. Save the file to your computer, then double-click it to open it.","zh":"每天汇报前一天的司机派送成功率。 先从 Puppis 导出昨天的 OFD List，再用离线脚本 Auto Driver Performance.html 生成汇报文字和 Excel 文件。 打开脚本（新标签页） 下载脚本 如需离线使用，点击“下载脚本”，或右键点击链接并选择“链接另存为”，将文件保存到电脑后双击打开。"},"operation":null,"review":null,"keyCheck":{"en":"","zh":""},"aliases":[]},{"id":"5-3/step-1","kind":"step","title":{"en":"Export Yesterday's OFD List","zh":"导出昨天的 OFD List"},"ordinal":"1","body":{"en":"\u003col>\n\u003cli>Puppis → \u003ccode>Task\u003c/code> → \u003ccode>Ofd List - Hub\u003c/code>\u003c/li>\n\u003cli>Click the \u003ccode>OFD Date\u003c/code> box, double-click yesterday's date and click \u003ccode>OK\u003c/code>. Check that the time range is yesterday from 00:00:00 to 23:59:59.\u003c/li>\n\u003cli>Click \u003ccode>Query\u003c/code>, then click \u003ccode>Export\u003c/code>.\u003c/li>\n\u003cli>Enter any Mission Name and click \u003ccode>Confirm\u003c/code>.\u003c/li>\n\u003c/ol>\n\u003cp>\u003cimg src=\"images/ch5/5-3-ofd-date-yesterday.webp\" alt=\"Ofd List - Hub: double-click yesterday in OFD Date, then OK\" width=\"1400\" height=\"767\" loading=\"lazy\" decoding=\"async\" tabindex=\"0\" data-zoom>\u003c/p>\n","zh":"\u003col>\n\u003cli>Puppis → \u003ccode>Task\u003c/code> → \u003ccode>Ofd List - Hub\u003c/code>\u003c/li>\n\u003cli>点击 \u003ccode>OFD Date\u003c/code> 日期框，双击昨天的日期，点击 \u003ccode>OK\u003c/code>。确认时间为昨天 00:00:00 至 23:59:59。\u003c/li>\n\u003cli>点击 \u003ccode>Query\u003c/code>，再点击 \u003ccode>Export\u003c/code>。\u003c/li>\n\u003cli>填写任意 Mission Name，点击 \u003ccode>Confirm\u003c/code>。\u003c/li>\n\u003c/ol>\n\u003cp>\u003cimg src=\"images/ch5/5-3-ofd-date-yesterday.webp\" alt=\"Ofd List - Hub: double-click yesterday in OFD Date, then OK\" width=\"1400\" height=\"767\" loading=\"lazy\" decoding=\"async\" tabindex=\"0\" data-zoom>\u003c/p>\n"},"summary":{"en":"Puppis → Task → Ofd List - Hub","zh":"Puppis → Task → Ofd List - Hub"},"notes":{"en":"","zh":""},"plain":{"en":"Puppis → Task → Ofd List - Hub Click the OFD Date box, double-click yesterday's date and click OK. Check that the time range is yesterday from 00:00:00 to 23:59:59. Click Query, then click Export. Enter any Mission Name and click Confirm.","zh":"Puppis → Task → Ofd List - Hub 点击 OFD Date 日期框，双击昨天的日期，点击 OK。确认时间为昨天 00:00:00 至 23:59:59。 点击 Query，再点击 Export。 填写任意 Mission Name，点击 Confirm。"},"operation":null,"review":null,"keyCheck":{"en":"","zh":""},"aliases":[]},{"id":"5-3/step-2","kind":"step","title":{"en":"Download the File from Download Center","zh":"在 Download Center 下载文件"},"ordinal":"2","body":{"en":"\u003col>\n\u003cli>Puppis → \u003ccode>Basic\u003c/code> → \u003ccode>Download Center\u003c/code>\u003c/li>\n\u003cli>When the status shows the export is finished, click the file name to download it.\u003c/li>\n\u003c/ol>\n\u003cp>\u003cimg src=\"images/ch5/5-3-download-center.webp\" alt=\"Download Center: click the file name when the status shows finish\" width=\"1400\" height=\"487\" loading=\"lazy\" decoding=\"async\" tabindex=\"0\" data-zoom>\u003c/p>\n","zh":"\u003col>\n\u003cli>Puppis → \u003ccode>Basic\u003c/code> → \u003ccode>Download Center\u003c/code>\u003c/li>\n\u003cli>状态显示完成后，点击文件名下载。\u003c/li>\n\u003c/ol>\n\u003cp>\u003cimg src=\"images/ch5/5-3-download-center.webp\" alt=\"Download Center: click the file name when the status shows finish\" width=\"1400\" height=\"487\" loading=\"lazy\" decoding=\"async\" tabindex=\"0\" data-zoom>\u003c/p>\n"},"summary":{"en":"Puppis → Basic → Download Center","zh":"Puppis → Basic → Download Center"},"notes":{"en":"","zh":""},"plain":{"en":"Puppis → Basic → Download Center When the status shows the export is finished, click the file name to download it.","zh":"Puppis → Basic → Download Center 状态显示完成后，点击文件名下载。"},"operation":null,"review":null,"keyCheck":{"en":"","zh":""},"aliases":[]},{"id":"5-3/step-3","kind":"step","title":{"en":"Calculate the Success Rate with the Script","zh":"用脚本计算成功率"},"ordinal":"3","body":{"en":"\u003col>\n\u003cli>Click Open the script below, or double-click the saved \u003ccode>Auto Driver Performance.html\u003c/code> file to open it in Chrome, Edge or Safari.\u003c/li>\n\u003cli>Drag the downloaded file onto the page, or click the upload area to choose the file.\u003c/li>\n\u003cli>Check the target date (OFD date) and the hub. The target date defaults to yesterday and the hub is detected automatically. Change them if needed.\u003c/li>\n\u003cli>The First-attempt success rate shown on the page is the Success Rate used in the report.\u003c/li>\n\u003c/ol>\n\u003cp>\u003ca class=\"tool-link\" href=\"tools/auto-driver-performance.html\" target=\"_blank\" rel=\"noopener\">Open the script (new tab)\u003c/a> \u003ca class=\"tool-link tool-link-secondary\" href=\"tools/auto-driver-performance.html\" download=\"Auto Driver Performance.html\">Download the script\u003c/a>\u003c/p>\n\u003cp>\u003cimg src=\"images/ch5/5-3-script-result.webp\" alt=\"Auto Driver Performance result page (sample data)\" width=\"1355\" height=\"750\" loading=\"lazy\" decoding=\"async\" tabindex=\"0\" data-zoom>\u003c/p>\n","zh":"\u003col>\n\u003cli>点击下方“打开脚本”，或双击已保存到电脑的 \u003ccode>Auto Driver Performance.html\u003c/code>，用 Chrome、Edge 或 Safari 打开。\u003c/li>\n\u003cli>将下载的文件拖入页面，或点击上传区域选择文件。\u003c/li>\n\u003cli>核对目标日期（OFD date）和 Hub。目标日期默认为昨天，Hub 自动识别，需要时可手动更改。\u003c/li>\n\u003cli>页面显示的 First-attempt success rate 即汇报使用的 Success Rate。\u003c/li>\n\u003c/ol>\n\u003cp>\u003ca class=\"tool-link\" href=\"tools/auto-driver-performance.html\" target=\"_blank\" rel=\"noopener\">打开脚本（新标签页）\u003c/a> \u003ca class=\"tool-link tool-link-secondary\" href=\"tools/auto-driver-performance.html\" download=\"Auto Driver Performance.html\">下载脚本\u003c/a>\u003c/p>\n\u003cp>\u003cimg src=\"images/ch5/5-3-script-result.webp\" alt=\"Auto Driver Performance result page (sample data)\" width=\"1355\" height=\"750\" loading=\"lazy\" decoding=\"async\" tabindex=\"0\" data-zoom>\u003c/p>\n"},"summary":{"en":"Click Open the script below, or double-click the saved Auto Driver Performance.html file to open it in Chrome, Edge or Safari.","zh":"点击下方“打开脚本”，或双击已保存到电脑的 Auto Driver Performance.html，用 Chrome、Edge 或 Safari 打开。"},"notes":{"en":"\u003col>\n\u003cli>If the file has no data for yesterday, the script uses the latest date in the file and shows a warning. Check that you exported the right date.\u003c/li>\n\u003cli>If the file contains several hubs, choose your hub from the dropdown.\u003c/li>\n\u003c/ol>\n","zh":"\u003col>\n\u003cli>如果文件中没有昨天的数据，脚本会改用文件中最新的日期并显示提示，需核对是否导出了正确日期。\u003c/li>\n\u003cli>文件包含多个 Hub 时，在下拉框中选择所属 Hub。\u003c/li>\n\u003c/ol>\n"},"plain":{"en":"Click Open the script below, or double-click the saved Auto Driver Performance.html file to open it in Chrome, Edge or Safari. Drag the downloaded file onto the page, or click the upload area to choose the file. Check the target date (OFD date) and the hub. The target date defaults to yesterday and the hub is detected automatically. Change them if needed. The First-attempt success rate shown on the page is the Success Rate used in the report. Open the script (new tab) Download the script If the file has no data for yesterday, the script uses the latest date in the file and shows a warning. Check that you exported the right date. If the file contains several hubs, choose your hub from the dropdown.","zh":"点击下方“打开脚本”，或双击已保存到电脑的 Auto Driver Performance.html，用 Chrome、Edge 或 Safari 打开。 将下载的文件拖入页面，或点击上传区域选择文件。 核对目标日期（OFD date）和 Hub。目标日期默认为昨天，Hub 自动识别，需要时可手动更改。 页面显示的 First-attempt success rate 即汇报使用的 Success Rate。 打开脚本（新标签页） 下载脚本 如果文件中没有昨天的数据，脚本会改用文件中最新的日期并显示提示，需核对是否导出了正确日期。 文件包含多个 Hub 时，在下拉框中选择所属 Hub。"},"operation":null,"review":null,"keyCheck":{"en":"","zh":""},"aliases":[]},{"id":"5-3/step-4","kind":"step","title":{"en":"Copy the Report Text and Download the Excel File","zh":"复制汇报文字并下载 Excel"},"ordinal":"4","body":{"en":"\u003col>\n\u003cli>Click \u003ccode>Copy report text\u003c/code> to copy the report text.\u003c/li>\n\u003cli>Click \u003ccode>Download DRIVERS PERFORMANCE (.xlsx)\u003c/code> to download the Excel file.\u003c/li>\n\u003cli>Send the report text and the Excel file together to the reporting group.\u003c/li>\n\u003c/ol>\n\u003cp>\u003cimg src=\"images/ch5/5-3-sent-report.webp\" alt=\"Sent drivers performance report text with the Excel file\" width=\"1400\" height=\"709\" loading=\"lazy\" decoding=\"async\" tabindex=\"0\" data-zoom>\u003c/p>\n","zh":"\u003col>\n\u003cli>点击 \u003ccode>Copy report text\u003c/code> 复制汇报文字。\u003c/li>\n\u003cli>点击 \u003ccode>Download DRIVERS PERFORMANCE (.xlsx)\u003c/code> 下载 Excel 文件。\u003c/li>\n\u003cli>将汇报文字和 Excel 文件一起发到汇报群。\u003c/li>\n\u003c/ol>\n\u003cp>\u003cimg src=\"images/ch5/5-3-sent-report.webp\" alt=\"Sent drivers performance report text with the Excel file\" width=\"1400\" height=\"709\" loading=\"lazy\" decoding=\"async\" tabindex=\"0\" data-zoom>\u003c/p>\n"},"summary":{"en":"Click Copy report text to copy the report text.","zh":"点击 Copy report text 复制汇报文字。"},"notes":{"en":"","zh":""},"plain":{"en":"Click Copy report text to copy the report text. Click Download DRIVERS PERFORMANCE (.xlsx) to download the Excel file. Send the report text and the Excel file together to the reporting group.","zh":"点击 Copy report text 复制汇报文字。 点击 Download DRIVERS PERFORMANCE (.xlsx) 下载 Excel 文件。 将汇报文字和 Excel 文件一起发到汇报群。"},"operation":null,"review":null,"keyCheck":{"en":"","zh":""},"aliases":[]},{"id":"5-3/report-format","kind":"topic","title":{"en":"Report Format","zh":"汇报格式"},"ordinal":"","body":{"en":"\u003cdiv class=\"table-scroll\" tabindex=\"0\" role=\"region\" aria-label=\"Table\">\u003ctable>\n\u003cthead>\n\u003ctr>\n  \u003cth>Report text example\u003c/th>\n\u003c/tr>\n\u003c/thead>\n\u003ctbody>\n\u003ctr>\n  \u003ctd>\u003ccode>Bloemfontein hub drivers performance 11 nov 2026\u003c/code>\u003cbr>\u003ccode>Target Date: 11 Nov 2026\u003c/code>\u003cbr>\u003ccode>Success Rate: 68.54%\u003c/code>\u003c/td>\n\u003c/tr>\n\u003c/tbody>\n\u003c/table>\u003c/div>\n\u003cp>Attach the \u003ccode>DRIVERS PERFORMANCE &lt;HUB&gt; &lt;date&gt;.xlsx\u003c/code> file downloaded from the script.\u003c/p>\n","zh":"\u003cdiv class=\"table-scroll\" tabindex=\"0\" role=\"region\" aria-label=\"Table\">\u003ctable>\n\u003cthead>\n\u003ctr>\n  \u003cth>汇报文字示例\u003c/th>\n\u003c/tr>\n\u003c/thead>\n\u003ctbody>\n\u003ctr>\n  \u003ctd>\u003ccode>Bloemfontein hub drivers performance 11 nov 2026\u003c/code>\u003cbr>\u003ccode>Target Date: 11 Nov 2026\u003c/code>\u003cbr>\u003ccode>Success Rate: 68.54%\u003c/code>\u003c/td>\n\u003c/tr>\n\u003c/tbody>\n\u003c/table>\u003c/div>\n\u003cp>附件为脚本下载的 \u003ccode>DRIVERS PERFORMANCE &lt;HUB&gt; &lt;日期&gt;.xlsx\u003c/code>。\u003c/p>\n"},"summary":{"en":"| Report text example |","zh":"| 汇报文字示例 |"},"notes":{"en":"","zh":""},"plain":{"en":"Report text example Bloemfontein hub drivers performance 11 nov 2026 Target Date: 11 Nov 2026 Success Rate: 68.54% Attach the DRIVERS PERFORMANCE \u003cHUB> \u003cdate>.xlsx file downloaded from the script.","zh":"汇报文字示例 Bloemfontein hub drivers performance 11 nov 2026 Target Date: 11 Nov 2026 Success Rate: 68.54% 附件为脚本下载的 DRIVERS PERFORMANCE \u003cHUB> \u003c日期>.xlsx。"},"operation":null,"review":null,"keyCheck":{"en":"","zh":""},"aliases":[]},{"id":"5-3/notes","kind":"topic","title":{"en":"Notes","zh":"注意事项"},"ordinal":"","body":{"en":"\u003cul>\n\u003cli>Always open the script directly in a computer browser. Previewing it inside a chat app shows a blank page.\u003c/li>\n\u003cli>The script works offline and processes the file on your computer only. Nothing is uploaded.\u003c/li>\n\u003cli>Success Rate counts first attempts only (\u003ccode>Ofd Num\u003c/code> is 1), the same as the old DRIVERS PERFORMANCE template. All attempts on the page is for reference only.\u003c/li>\n\u003cli>The script replaces the manual template steps of deleting old data, pasting new data and refreshing the pivot table. The downloaded Excel file is already calculated, so you do not need to click \u003ccode>Refresh\u003c/code>.\u003c/li>\n\u003cli>The exported file must contain the \u003ccode>Tracking no\u003c/code>, \u003ccode>Driver\u003c/code>, \u003ccode>OFD result\u003c/code>, \u003ccode>OFD date\u003c/code> and \u003ccode>Ofd Num\u003c/code> columns. Use the original file exported from Puppis and do not rename the columns.\u003c/li>\n\u003cli>Do not edit the script file.\u003c/li>\n\u003c/ul>\n","zh":"\u003cul>\n\u003cli>必须在电脑浏览器中直接打开脚本。在聊天软件内预览时页面为空白。\u003c/li>\n\u003cli>脚本离线运行，文件只在本机处理，不会上传。\u003c/li>\n\u003cli>Success Rate 只按首次派送（\u003ccode>Ofd Num\u003c/code> 为 1）计算，与原 DRIVERS PERFORMANCE 模板口径一致。页面上的 All attempts 仅供参考。\u003c/li>\n\u003cli>脚本取代原模板中删除旧数据、粘贴新数据和刷新数据透视表的手工步骤。下载的 Excel 已计算完成，无需再点 \u003ccode>Refresh\u003c/code>。\u003c/li>\n\u003cli>导出文件需包含 \u003ccode>Tracking no\u003c/code>、\u003ccode>Driver\u003c/code>、\u003ccode>OFD result\u003c/code>、\u003ccode>OFD date\u003c/code> 和 \u003ccode>Ofd Num\u003c/code> 列。请直接使用 Puppis 导出的原文件，不要修改列名。\u003c/li>\n\u003cli>不要修改脚本文件。\u003c/li>\n\u003c/ul>\n"},"summary":{"en":"Always open the script directly in a computer browser. Previewing it inside a chat app shows a blank page.","zh":"必须在电脑浏览器中直接打开脚本。在聊天软件内预览时页面为空白。"},"notes":{"en":"","zh":""},"plain":{"en":"Always open the script directly in a computer browser. Previewing it inside a chat app shows a blank page. The script works offline and processes the file on your computer only. Nothing is uploaded. Success Rate counts first attempts only (Ofd Num is 1), the same as the old DRIVERS PERFORMANCE template. All attempts on the page is for reference only. The script replaces the manual template steps of deleting old data, pasting new data and refreshing the pivot table. The downloaded Excel file is already calculated, so you do not need to click Refresh. The exported file must contain the Tracking no, Driver, OFD result, OFD date and Ofd Num columns. Use the original file exported from Puppis and do not rename the columns. Do not edit the script file.","zh":"必须在电脑浏览器中直接打开脚本。在聊天软件内预览时页面为空白。 脚本离线运行，文件只在本机处理，不会上传。 Success Rate 只按首次派送（Ofd Num 为 1）计算，与原 DRIVERS PERFORMANCE 模板口径一致。页面上的 All attempts 仅供参考。 脚本取代原模板中删除旧数据、粘贴新数据和刷新数据透视表的手工步骤。下载的 Excel 已计算完成，无需再点 Refresh。 导出文件需包含 Tracking no、Driver、OFD result、OFD date 和 Ofd Num 列。请直接使用 Puppis 导出的原文件，不要修改列名。 不要修改脚本文件。"},"operation":null,"review":null,"keyCheck":{"en":"","zh":""},"aliases":[]}]},{"id":"5-4","title":{"en":"Stock Count Report (Weekly)","zh":"Stock Count Report（每周）"},"part":"5","blocks":[{"id":"5-4","kind":"intro","title":{"en":"Stock Count Report (Weekly)","zh":"Stock Count Report（每周）"},"ordinal":"","body":{"en":"","zh":""},"summary":{"en":"","zh":""},"notes":{"en":"","zh":""},"plain":{"en":"","zh":""},"operation":null,"review":null,"keyCheck":{"en":"","zh":""},"aliases":[]},{"id":"5-4/when-this-applies","kind":"topic","title":{"en":"When This Applies","zh":"适用情况"},"ordinal":"","body":{"en":"\u003cp>Each week, after the full warehouse stock count is complete, report the result and the number of Missing and Extra exceptions.\u003cbr />\nFor how to do the stock count, see section \u003ca href=\"#3-1\">3-1\u003c/a>. Use the weekMMDD week label, where MMDD is the date of that week's Monday.\u003c/p>\n","zh":"\u003cp>每周完成全库盘点后，汇报盘点结果及 Missing、Extra 异常数量。\u003cbr />\n盘点操作见 \u003ca href=\"#3-1\">3-1\u003c/a>。周标签使用 weekMMDD，MMDD 为本周一的日期。\u003c/p>\n"},"summary":{"en":"Each week, after the full warehouse stock count is complete, report the result and the number of Missing and Extra exceptions.","zh":"每周完成全库盘点后，汇报盘点结果及 Missing、Extra 异常数量。"},"notes":{"en":"","zh":""},"plain":{"en":"Each week, after the full warehouse stock count is complete, report the result and the number of Missing and Extra exceptions. For how to do the stock count, see section 3-1. Use the weekMMDD week label, where MMDD is the date of that week's Monday.","zh":"每周完成全库盘点后，汇报盘点结果及 Missing、Extra 异常数量。 盘点操作见 3-1。周标签使用 weekMMDD，MMDD 为本周一的日期。"},"operation":null,"review":null,"keyCheck":{"en":"","zh":""},"aliases":[]},{"id":"5-4/step-1","kind":"step","title":{"en":"Take a Screenshot of the Stock Count Plan","zh":"截图盘点计划"},"ordinal":"1","body":{"en":"\u003col>\n\u003cli>Puppis → \u003ccode>Warehouse\u003c/code> → \u003ccode>Stock Count Plan\u003c/code>\u003c/li>\n\u003cli>Take a screenshot of the latest Entire Hub Count plan (the top row) and circle its \u003ccode>Create Time\u003c/code>.\u003c/li>\n\u003c/ol>\n\u003cp>\u003cimg src=\"images/ch5/5-4-stock-count-plan.webp\" alt=\"Stock Count Plan: latest Entire Hub Count row with Create Time circled\" width=\"1400\" height=\"715\" loading=\"lazy\" decoding=\"async\" tabindex=\"0\" data-zoom>\u003c/p>\n","zh":"\u003col>\n\u003cli>Puppis → \u003ccode>Warehouse\u003c/code> → \u003ccode>Stock Count Plan\u003c/code>\u003c/li>\n\u003cli>截取最新一行 Entire Hub Count 盘点计划，圈出 \u003ccode>Create Time\u003c/code>。\u003c/li>\n\u003c/ol>\n\u003cp>\u003cimg src=\"images/ch5/5-4-stock-count-plan.webp\" alt=\"Stock Count Plan: latest Entire Hub Count row with Create Time circled\" width=\"1400\" height=\"715\" loading=\"lazy\" decoding=\"async\" tabindex=\"0\" data-zoom>\u003c/p>\n"},"summary":{"en":"Puppis → Warehouse → Stock Count Plan","zh":"Puppis → Warehouse → Stock Count Plan"},"notes":{"en":"","zh":""},"plain":{"en":"Puppis → Warehouse → Stock Count Plan Take a screenshot of the latest Entire Hub Count plan (the top row) and circle its Create Time.","zh":"Puppis → Warehouse → Stock Count Plan 截取最新一行 Entire Hub Count 盘点计划，圈出 Create Time。"},"operation":null,"review":null,"keyCheck":{"en":"","zh":""},"aliases":[]},{"id":"5-4/step-2","kind":"step","title":{"en":"Query and Handle Missing Exceptions","zh":"查询并处理 Missing 异常"},"ordinal":"2","body":{"en":"\u003col>\n\u003cli>Puppis → \u003ccode>Work Order System\u003c/code> → \u003ccode>Package Exception Task (Dispatch)\u003c/code>\u003c/li>\n\u003cli>Select your hub in \u003ccode>Hub\u003c/code>, choose \u003ccode>Stock Count Missing Exception\u003c/code> in \u003ccode>WorkOrderBizType\u003c/code> and click \u003ccode>Query\u003c/code>.\u003c/li>\n\u003cli>Investigate and handle the missing parcels first, then take a screenshot and circle the \u003ccode>Processing\u003c/code> count.\u003c/li>\n\u003c/ol>\n\u003cp>\u003cimg src=\"images/ch5/5-4-missing-processing.webp\" alt=\"Package Exception Task (Dispatch): Stock Count Missing Exception, Processing count\" width=\"1400\" height=\"715\" loading=\"lazy\" decoding=\"async\" tabindex=\"0\" data-zoom>\u003c/p>\n","zh":"\u003col>\n\u003cli>Puppis → \u003ccode>Work Order System\u003c/code> → \u003ccode>Package Exception Task (Dispatch)\u003c/code>\u003c/li>\n\u003cli>在 \u003ccode>Hub\u003c/code> 选择所属 Hub，在 \u003ccode>WorkOrderBizType\u003c/code> 选择 \u003ccode>Stock Count Missing Exception\u003c/code>，点击 \u003ccode>Query\u003c/code>。\u003c/li>\n\u003cli>先调查并处理 Missing 包裹，再截图，圈出 \u003ccode>Processing\u003c/code> 数量。\u003c/li>\n\u003c/ol>\n\u003cp>\u003cimg src=\"images/ch5/5-4-missing-processing.webp\" alt=\"Package Exception Task (Dispatch): Stock Count Missing Exception, Processing count\" width=\"1400\" height=\"715\" loading=\"lazy\" decoding=\"async\" tabindex=\"0\" data-zoom>\u003c/p>\n"},"summary":{"en":"Puppis → Work Order System → Package Exception Task (Dispatch)","zh":"Puppis → Work Order System → Package Exception Task (Dispatch)"},"notes":{"en":"","zh":""},"plain":{"en":"Puppis → Work Order System → Package Exception Task (Dispatch) Select your hub in Hub, choose Stock Count Missing Exception in WorkOrderBizType and click Query. Investigate and handle the missing parcels first, then take a screenshot and circle the Processing count.","zh":"Puppis → Work Order System → Package Exception Task (Dispatch) 在 Hub 选择所属 Hub，在 WorkOrderBizType 选择 Stock Count Missing Exception，点击 Query。 先调查并处理 Missing 包裹，再截图，圈出 Processing 数量。"},"operation":null,"review":null,"keyCheck":{"en":"","zh":""},"aliases":[]},{"id":"5-4/step-3","kind":"step","title":{"en":"Query Extra Exceptions","zh":"查询 Extra 异常"},"ordinal":"3","body":{"en":"\u003col>\n\u003cli>Change \u003ccode>WorkOrderBizType\u003c/code> to \u003ccode>Stock Count Extra Exception\u003c/code> and click \u003ccode>Query\u003c/code>.\u003c/li>\n\u003cli>Take a screenshot and circle the \u003ccode>Processing\u003c/code> count.\u003c/li>\n\u003c/ol>\n\u003cp>\u003cimg src=\"images/ch5/5-4-extra-processing.webp\" alt=\"Package Exception Task (Dispatch): Stock Count Extra Exception, Processing count\" width=\"1400\" height=\"715\" loading=\"lazy\" decoding=\"async\" tabindex=\"0\" data-zoom>\u003c/p>\n","zh":"\u003col>\n\u003cli>在 \u003ccode>WorkOrderBizType\u003c/code> 改选 \u003ccode>Stock Count Extra Exception\u003c/code>，点击 \u003ccode>Query\u003c/code>。\u003c/li>\n\u003cli>截图，圈出 \u003ccode>Processing\u003c/code> 数量。\u003c/li>\n\u003c/ol>\n\u003cp>\u003cimg src=\"images/ch5/5-4-extra-processing.webp\" alt=\"Package Exception Task (Dispatch): Stock Count Extra Exception, Processing count\" width=\"1400\" height=\"715\" loading=\"lazy\" decoding=\"async\" tabindex=\"0\" data-zoom>\u003c/p>\n"},"summary":{"en":"Change WorkOrderBizType to Stock Count Extra Exception and click Query.","zh":"在 WorkOrderBizType 改选 Stock Count Extra Exception，点击 Query。"},"notes":{"en":"","zh":""},"plain":{"en":"Change WorkOrderBizType to Stock Count Extra Exception and click Query. Take a screenshot and circle the Processing count.","zh":"在 WorkOrderBizType 改选 Stock Count Extra Exception，点击 Query。 截图，圈出 Processing 数量。"},"operation":null,"review":null,"keyCheck":{"en":"","zh":""},"aliases":[]},{"id":"5-4/step-4","kind":"step","title":{"en":"Send the Report","zh":"发送汇报"},"ordinal":"4","body":{"en":"\u003cp>Send the three screenshots and the report text together to the reporting group.\u003c/p>\n","zh":"\u003cp>将 3 张截图和汇报文字一起发到汇报群。\u003c/p>\n"},"summary":{"en":"Send the three screenshots and the report text together to the reporting group.","zh":"将 3 张截图和汇报文字一起发到汇报群。"},"notes":{"en":"","zh":""},"plain":{"en":"Send the three screenshots and the report text together to the reporting group.","zh":"将 3 张截图和汇报文字一起发到汇报群。"},"operation":null,"review":null,"keyCheck":{"en":"","zh":""},"aliases":[]},{"id":"5-4/report-format","kind":"topic","title":{"en":"Report Format","zh":"汇报格式"},"ordinal":"","body":{"en":"\u003cdiv class=\"table-scroll\" tabindex=\"0\" role=\"region\" aria-label=\"Table\">\u003ctable>\n\u003cthead>\n\u003ctr>\n  \u003cth>Report text example\u003c/th>\n\u003c/tr>\n\u003c/thead>\n\u003ctbody>\n\u003ctr>\n  \u003ctd>\u003ccode>SOWETO HUB STOCK COUNT week1116\u003c/code>\u003cbr>\u003ccode>MISSING :03 still searching\u003c/code>\u003cbr>\u003ccode>EXTRA :00\u003c/code>\u003c/td>\n\u003c/tr>\n\u003c/tbody>\n\u003c/table>\u003c/div>\n","zh":"\u003cdiv class=\"table-scroll\" tabindex=\"0\" role=\"region\" aria-label=\"Table\">\u003ctable>\n\u003cthead>\n\u003ctr>\n  \u003cth>汇报文字示例\u003c/th>\n\u003c/tr>\n\u003c/thead>\n\u003ctbody>\n\u003ctr>\n  \u003ctd>\u003ccode>SOWETO HUB STOCK COUNT week1116\u003c/code>\u003cbr>\u003ccode>MISSING :03 still searching\u003c/code>\u003cbr>\u003ccode>EXTRA :00\u003c/code>\u003c/td>\n\u003c/tr>\n\u003c/tbody>\n\u003c/table>\u003c/div>\n"},"summary":{"en":"| Report text example |","zh":"| 汇报文字示例 |"},"notes":{"en":"","zh":""},"plain":{"en":"Report text example SOWETO HUB STOCK COUNT week1116 MISSING :03 still searching EXTRA :00","zh":"汇报文字示例 SOWETO HUB STOCK COUNT week1116 MISSING :03 still searching EXTRA :00"},"operation":null,"review":null,"keyCheck":{"en":"","zh":""},"aliases":[]},{"id":"5-4/notes","kind":"topic","title":{"en":"Notes","zh":"注意事项"},"ordinal":"","body":{"en":"\u003cul>\n\u003cli>Do a full warehouse count at least once a week, ideally when parcel volume is low.\u003c/li>\n\u003cli>Write the week label using that week's Monday. For example, the week from 2026-11-16 to 11-22 is week1116.\u003c/li>\n\u003cli>If missing parcels are still being searched for, add still searching after the count. See section \u003ca href=\"#3-1\">3-1\u003c/a> for how to investigate Missing and Extra.\u003c/li>\n\u003c/ul>\n","zh":"\u003cul>\n\u003cli>每周至少完成一次全库盘点，尽量安排在包裹量较少的时段。\u003c/li>\n\u003cli>周标签按本周一日期填写。例如 2026-11-16 至 11-22 这一周写 week1116。\u003c/li>\n\u003cli>Missing 仍在查找时，在数量后注明 still searching。Missing 和 Extra 的核查原则见 \u003ca href=\"#3-1\">3-1\u003c/a>。\u003c/li>\n\u003c/ul>\n"},"summary":{"en":"Do a full warehouse count at least once a week, ideally when parcel volume is low.","zh":"每周至少完成一次全库盘点，尽量安排在包裹量较少的时段。"},"notes":{"en":"","zh":""},"plain":{"en":"Do a full warehouse count at least once a week, ideally when parcel volume is low. Write the week label using that week's Monday. For example, the week from 2026-11-16 to 11-22 is week1116. If missing parcels are still being searched for, add still searching after the count. See section 3-1 for how to investigate Missing and Extra.","zh":"每周至少完成一次全库盘点，尽量安排在包裹量较少的时段。 周标签按本周一日期填写。例如 2026-11-16 至 11-22 这一周写 week1116。 Missing 仍在查找时，在数量后注明 still searching。Missing 和 Extra 的核查原则见 3-1。"},"operation":null,"review":null,"keyCheck":{"en":"","zh":""},"aliases":[]}]}]}</script>
  <script>(() => {
  "use strict";
  const handbook = JSON.parse(document.getElementById("handbook-data").textContent);
  const byId = id => document.getElementById(id);
  const pages = new Map(handbook.pages.map(page => [page.id, page]));
  const parts = new Map(handbook.parts.map(part => [part.id, part]));
  const directory = byId("directory");
  const article = byId("document");
  const search = byId("search-dialog");
  const query = byId("query");
  const results = byId("results");
  const sheet = byId("sheet");
  const searchTrigger = byId("search-trigger");
  const lightbox = byId("lightbox");
  const lightboxImage = byId("lightbox-image");
  let lightboxOrigin = null;
  const labels = {
    en: {
      brand: "Hub Operations", search: "Search handbook", enter: "Open handbook",
      skip: "Skip to content", contents: "Handbook contents", onPage: "On this page",
      placeholder: "Search steps, statuses or issues…", move: "Navigate", open: "Open",
      suggested: "Suggested pages", match: "matches", oneMatch: "1 match",
      noMatch: "No matching steps. Try a shorter phrase or a system term.",
      view: "View operation", viewReasons: "View reasons", viewStatuses: "View statuses", check: "To verify",
      closeSheet: "Close instructions", closeSearch: "Close search", table: "Scrollable table",
      step: "Step ", keyCheck: "Key check", stepNotes: "Notes", next: "Next step", language: "Language", home: "GFS OPS home",
      tagline: "Downstream Hub Operations", chapters: "Chapters", pagesOne: " page", pagesMany: " pages",
      steps: " steps", oneStep: " step", sections: " sections", oneSection: " section", chapter: "Chapter ",
      menu: "Handbook contents", startHere: "Start here",
      quickStart: "Quick start", hubName: "Johannesburg", hubTag: "Distribution hub", mapTitle: "South Africa: routes from the Johannesburg distribution hub",
    },
    zh: {
      brand: "站点运营手册", search: "搜索手册", enter: "进入手册",
      skip: "跳到正文", contents: "手册目录", onPage: "本页目录",
      placeholder: "搜索步骤、状态或现场问题…", move: "选择", open: "打开",
      suggested: "常查步骤", match: "条结果", oneMatch: "1 条结果",
      noMatch: "没有找到相关步骤。可试试较短的关键词或系统原名。",
      view: "查看操作", viewReasons: "查看原因", viewStatuses: "查看状态说明", check: "待核对",
      closeSheet: "关闭操作详情", closeSearch: "关闭搜索", table: "可滚动表格",
      step: "步骤 ", keyCheck: "操作要点", stepNotes: "注意点", next: "下一步", language: "语言", home: "GFS OPS 首页",
      tagline: "下游站点运营全流程", chapters: "手册章节", pagesOne: " 篇", pagesMany: " 篇",
      steps: " 个步骤", oneStep: " 个步骤", sections: " 个小节", oneSection: " 个小节", chapter: "第 ",
      menu: "手册目录", startHere: "从这里开始",
      quickStart: "常用入口", hubName: "约堡", hubTag: "分拨中心", mapTitle: "南非：约堡分拨中心发出的配送线路",
    },
  };
  let lang = "en";
  try {
    if (localStorage.getItem("gfs-ops-language") === "zh") lang = "zh";
  } catch { /* Allow file URLs where browser storage is disabled. */ }

  let drawnPage = null;
  let drawnLanguage = null;
  let currentResults = [];
  let selectedResult = 0;
  let sheetOrigin = null;
  let searchOrigin = null;
  let skipRestore = false;

  const t = key => labels[lang][key];
  const ICONS = {
    phone: '<rect x="7" y="2.5" width="10" height="19" rx="2.5"/><path d="M11 18.5h2"/>',
    scanner: '<path d="M4 7V5a1 1 0 0 1 1-1h2M17 4h2a1 1 0 0 1 1 1v2M20 17v2a1 1 0 0 1-1 1h-2M7 20H5a1 1 0 0 1-1-1v-2"/><path d="M8 8v8M11 8v8M14 8v8M17 8v8"/>',
    monitor: '<rect x="3" y="4" width="18" height="12" rx="2"/><path d="M8 20h8M12 16v4"/>',
    chat: '<path d="M20 12a8 8 0 0 1-11.6 7.1L4 20l1-4A8 8 0 1 1 20 12Z"/><path d="M8.5 12h.01M12 12h.01M15.5 12h.01"/>',
    alert: '<path d="M12 3.5 2.8 19.5h18.4L12 3.5Z"/><path d="M12 10v4M12 17h.01"/>',
    check: '<circle cx="12" cy="12" r="9"/><path d="m8.5 12.3 2.4 2.4 4.8-5"/>',
    book: '<path d="M4 5.5A2.5 2.5 0 0 1 6.5 3H20v15H6.5A2.5 2.5 0 0 0 4 20.5v-15Z"/><path d="M4 20.5A2.5 2.5 0 0 0 6.5 23H20v-5M8 7.5h8M8 11h5"/>',
    truck: '<path d="M2.5 6h11v10h-11zM13.5 9.5h4l3 3.5V16h-7"/><circle cx="6.5" cy="17.5" r="1.8"/><circle cx="17" cy="17.5" r="1.8"/>',
    boxes: '<path d="M3 8.5 12 4l9 4.5-9 4.5-9-4.5Z"/><path d="M3 8.5v7L12 20l9-4.5v-7M12 13v7"/>',
    driver: '<circle cx="12" cy="7.5" r="3.5"/><path d="M5 20.5c.8-3.8 3.6-6 7-6s6.2 2.2 7 6"/>',
    chart: '<path d="M4 20V4M4 20h16"/><path d="M8 16v-4M12 16V8M16 16v-6"/>',
    menu: '<path d="M4 7h16M4 12h16M4 17h16"/>',
    arrowRight: '<path d="M5 12h14M13 6l6 6-6 6"/>',
    arrowLeft: '<path d="M19 12H5M11 6l-6 6 6 6"/>',
    layers: '<path d="m12 3 9 5-9 5-9-5 9-5Z"/><path d="m3 13 9 5 9-5"/>',
  };
  const icon = (name, css = "icon") => '<svg class="' + css + '" viewBox="0 0 24 24" fill="none" stroke="currentColor"' +
    ' stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false">' +
    ICONS[name] + "</svg>";
  const PART_ICONS = { "1": "book", "2": "truck", "3": "boxes", "4": "driver", "5": "chart" };
  const systemIcon = system => /Driver App/.test(system) ? "phone" : /^PDA/.test(system) ? "scanner"
    : /^WeCom/.test(system) ? "chat" : "monitor";
  const esc = value => String(value).replace(/[&<>"']/g, char =>
    ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" })[char]);
  const operationName = block => lang === "zh"
    ? block.operation.replace("Driver App", "司机 App").replace("System", "系统")
    : block.operation;
  const pathFor = page => parts.get(page.part).title[lang] + " / " + page.id;
  const labelFor = block => block.ordinal
    ? t("step") + block.ordinal + " · " + block.title[lang]
    : block.title[lang];

  function chapterNav(activePage) {
    if (drawnLanguage !== lang) {
      const openParts = new Set([...directory.querySelectorAll("details[open]")]
        .map(group => group.dataset.part));
      directory.innerHTML =
        '<p class="directory-title">' + t("contents") + "</p>" +
        handbook.parts.map(part =>
          '<details class="nav-group" data-part="' + esc(part.id) + '"' +
          (openParts.has(part.id) ? " open data-expanded" : "") + '><summary class="group-title">' +
          '<span class="number">' + icon(PART_ICONS[part.id] || "layers") +
          '<span class="sr-only">' + esc(part.id.padStart(2, "0")) + "</span>" +
          "</span><span>" + esc(part.title[lang]) + '</span></summary><div class="nav-panel"><ol>' +
          part.pages.map(id => {
            const page = pages.get(id);
            return '<li><a class="nav-link" href="#' + esc(id) + '">' +
              '<span class="number">' + esc(id) + "</span><span>" + esc(page.title[lang]) +
              "</span></a></li>";
          }).join("") + "</ol></div></details>"
        ).join("");
    }

    directory.querySelector('[aria-current="page"]')?.removeAttribute("aria-current");
    directory.querySelector("[data-current]")?.removeAttribute("data-current");
    const link = directory.querySelector('a[href="#' + activePage.id + '"]');
    const group = link.closest("details");
    link.setAttribute("aria-current", "page");
    group.dataset.current = "true";
    if (drawnPage !== activePage.id) setGroup(group, true);
  }

  /* ---- motion helpers (presentation only) ---- */
  const calm = () => window.matchMedia("(prefers-reduced-motion: reduce)").matches;
  const afterMotion = (el, ms, done) => {
    if (calm()) { done(); return; }
    let finished = false;
    const finish = () => { if (!finished) { finished = true; done(); } };
    setTimeout(finish, ms + 60);
    el.addEventListener("transitionend", function end(event) {
      if (event.target !== el) return;
      el.removeEventListener("transitionend", end);
      finish();
    });
  };
  function setGroup(group, open) {
    const panel = group.querySelector(".nav-panel");
    if (open) {
      if (group.open && "expanded" in group.dataset) return;
      group.open = true;
      void panel.offsetHeight;
      requestAnimationFrame(() => { group.dataset.expanded = ""; });
    } else {
      if (!group.open) return;
      delete group.dataset.expanded;
      afterMotion(panel, 250, () => { if (!("expanded" in group.dataset)) group.open = false; });
    }
  }
  directory.addEventListener("click", event => {
    const summary = event.target.closest("summary.group-title");
    if (!summary) return;
    event.preventDefault();
    const group = summary.parentElement;
    setGroup(group, !("expanded" in group.dataset));
  });
  const replay = (el, css = "is-entering") => {
    if (!el || calm()) return;
    el.classList.remove(css);
    void el.offsetWidth;
    el.classList.add(css);
  };

  function alertFor(block) {
    return block.review
      ? '<p class="callout">' + icon("alert", "icon callout-icon") + '<span class="callout-text"><strong>' +
        t("check") + "</strong> " + esc(block.review[lang]) + "</span></p>"
      : "";
  }

  function notesFor(block) {
    return block.notes[lang]
      ? '<div class="prose step-notes"><strong>' + t("stepNotes") + '</strong>' + block.notes[lang] + "</div>"
      : "";
  }

  function blockHTML(block) {
    const title = esc(block.title[lang]);
    const full = block.body[lang];
    if (block.kind === "intro") {
      return full.trim() ? '<div class="content-block intro prose">' + full + "</div>" : "";
    }

    const ordinal = block.ordinal
      ? '<span class="step-number" aria-label="' + t("step") + esc(block.ordinal) + '">' +
        esc(block.ordinal.padStart(2, "0")) + "</span>"
      : "";
    let action = "";
    let body = '<div class="prose">' + full + "</div>";
    if (block.operation) {
      const verbs = { "1-5/real-time-query": "viewStatuses", "2-2/failure-reasons": "viewReasons" };
      const verb = t(verbs[block.id] || "view");
      const system = operationName(block);
      action = '<button class="operation" type="button" data-operation="' + esc(block.id) +
        '" aria-haspopup="dialog" aria-label="' + esc(verb + " · " + block.title[lang]) +
        '"><span class="system">' + icon(systemIcon(block.operation)) + esc(system) + '</span><span class="verb">' + esc(verb) +
        '</span><span class="arrow" aria-hidden="true">' + icon("arrowRight") + "</span></button>";
      body = '<p class="step-summary">' + esc(block.summary[lang]) + '</p>' +
        '<div class="prose print-detail">' + full + "</div>";
      if (block.keyCheck[lang]) {
        body += '<div class="prose key-check"><strong>' + icon("check") + t("keyCheck") +
          "</strong>" + block.keyCheck[lang] + "</div>";
      }
    }
    const heading = block.kind === "subtopic" ? "h3" : "h2";
    return '<section id="' + esc(block.id) + '" class="content-block ' + block.kind +
      '" tabindex="-1">' + ordinal + '<div class="block-content"><div class="block-head"><' + heading + '>' +
      title + "</" + heading + ">" + "</div>" + body + notesFor(block) +
      (action ? '<div class="block-actions">' + action + "</div>" : "") + alertFor(block) + "</div></section>";
  }

  function presentPage(page) {
    chapterNav(page);
    const part = parts.get(page.part);
    const stepCount = page.blocks.filter(block => block.kind === "step").length;
    const sectionCount = page.blocks.filter(block => block.kind === "topic" || block.kind === "subtopic").length;
    const metaChips = [
      '<span class="chip chip-brand">' + icon(PART_ICONS[part.id] || "layers") + esc(t("chapter") + part.id.padStart(2, "0")) +
        (lang === "zh" ? " 章" : "") + "</span>",
      stepCount ? '<span class="chip">' + icon("layers") + stepCount + t(stepCount === 1 ? "oneStep" : "steps") + "</span>" : "",
      sectionCount ? '<span class="chip">' + icon("book") + sectionCount + t(sectionCount === 1 ? "oneSection" : "sections") + "</span>" : "",
    ].join("");
    article.innerHTML =
      '<p class="breadcrumb"><span>' + esc(parts.get(page.part).title[lang]) +
      '</span><span aria-hidden="true">/</span><span>' + esc(page.id) + "</span></p>" +
      page.blocks.map(blockHTML).join("");
    const heading = document.createElement("h1");
    heading.id = "chapter-title";
    heading.tabIndex = -1;
    heading.textContent = page.title[lang];
    article.querySelector(".breadcrumb").after(heading);
    const meta = document.createElement("div");
    meta.className = "page-meta";
    meta.innerHTML = metaChips;
    replay(article);
    replay(byId("page-links"));
    heading.after(meta);
    watchSections();
    article.querySelectorAll(".table-scroll").forEach(el => el.setAttribute("aria-label", t("table")));

    const articleBlocks = page.blocks.filter(block => block.kind !== "intro");
    byId("page-rail").hidden = articleBlocks.length === 0;
    byId("page-links").innerHTML =
      '<p class="toc-title">' + t("onPage") + "</p><ol>" +
      articleBlocks.map(block =>
        '<li><a class="toc-link' + (block.kind === "subtopic" ? ' toc-subtopic' : '') +
        '" href="#' + esc(block.id) + '">' + esc(labelFor(block)) + "</a></li>"
      ).join("") + "</ol>";
  }

  let spy = null;
  function watchSections() {
    spy?.disconnect();
    if (!("IntersectionObserver" in window)) return;
    const links = new Map([...byId("page-links").querySelectorAll(".toc-link")]
      .map(link => [link.getAttribute("href").slice(1), link]));
    spy = new IntersectionObserver(entries => {
      for (const entry of entries) {
        if (!entry.isIntersecting) continue;
        links.forEach(link => link.removeAttribute("data-spy"));
        links.get(entry.target.id)?.setAttribute("data-spy", "true");
      }
    }, { rootMargin: "-90px 0px -65% 0px" });
    article.querySelectorAll(".content-block[id]").forEach(section => spy.observe(section));
  }

  function chapterGrid() {
    const grid = byId("chapter-grid");
    if (!grid) return;
    grid.innerHTML = handbook.parts.map(part => {
      const count = part.pages.length;
      return '<div class="chapter-card"><div class="chapter-top"><span class="chapter-icon">' +
        icon(PART_ICONS[part.id] || "layers") + '</span><span class="chapter-no">' + esc(part.id.padStart(2, "0")) +
        '</span></div><h3><a class="chapter-link" href="#' + esc(part.pages[0]) + '">' + esc(part.title[lang]) +
        '</a></h3><p class="chapter-count">' + count + t(count === 1 ? "pagesOne" : "pagesMany") + "</p><ol>" +
        part.pages.map(id => '<li><a href="#' + esc(id) + '"><span class="number">' + esc(id) + "</span><span>" +
          esc(pages.get(id).title[lang]) + "</span></a></li>").join("") + "</ol></div>";
    }).join("");
  }

  const QUICK = ["2-1", "2-2", "3-1", "4-2"];
  function quickStart() {
    const grid = byId("quick-grid");
    if (!grid) return;
    grid.innerHTML = QUICK.filter(id => pages.has(id)).map(id => {
      const page = pages.get(id);
      return '<a class="quick-link" href="#' + esc(id) + '"><span class="quick-icon">' +
        icon(PART_ICONS[page.part] || "layers") + '</span><span class="quick-text"><span class="quick-path">' +
        esc(parts.get(page.part).title[lang]) + " · " + esc(id) + '</span><span class="quick-title">' +
        esc(page.title[lang]) + '</span></span><span class="quick-arrow">' + icon("arrowRight") + "</span></a>";
    }).join("");
  }

  const setNav = open => {
    document.body.classList.toggle("nav-open", open);
    byId("menu-toggle")?.setAttribute("aria-expanded", String(open));
  };

  function positionPage({ focus = true, reposition = true } = {}) {
    const requested = location.hash.slice(1);
    const route = ["3-1/step-5", "3-1/step-6"].includes(requested) ? "3-1/step-4" : requested;
    const page = pages.get(route.split("/")[0]);
    byId("cover").hidden = Boolean(page);
    byId("manual").hidden = !page;
    document.body.dataset.view = page ? "manual" : "cover";
    if (!page) {
      document.title = "GFS OPS · " + t("brand");
      if (reposition) window.scrollTo(0, 0);
      if (focus) byId("content").focus({preventScroll: true});
      return;
    }
    if (drawnPage !== page.id || drawnLanguage !== lang) {
      presentPage(page);
      drawnPage = page.id;
      drawnLanguage = lang;
    }
    document.title = page.title[lang] + " · GFS OPS";
    const section = route.includes("/") ? byId(route) : null;
    article.querySelectorAll("[data-selected]").forEach(el => el.removeAttribute("data-selected"));
    byId("page-links").querySelectorAll(".toc-link").forEach(link => {
      if (section && link.getAttribute("href") === "#" + route) {
        link.setAttribute("aria-current", "location");
      } else {
        link.removeAttribute("aria-current");
      }
    });
    if (section) section.dataset.selected = "true";
    if (reposition) {
      if (section) section.scrollIntoView({ block: "start" });
      else window.scrollTo(0, 0);
    }
    if (focus) (section || byId("chapter-title")).focus({ preventScroll: true });
  }

  function go(route) {
    if (location.hash !== "#" + route) history.pushState(null, "", "#" + route);
    positionPage();
  }

  function applyLanguage() {
    document.documentElement.lang = lang === "zh" ? "zh-CN" : "en";
    document.querySelectorAll("[data-label]").forEach(el => { el.textContent = t(el.dataset.label); });
    document.querySelectorAll("[data-language]").forEach(button =>
      button.setAttribute("aria-pressed", String(button.dataset.language === lang)));
    document.querySelector(".wordmark").setAttribute("aria-label", t("home"));
    document.querySelector(".languages").setAttribute("aria-label", t("language"));
    directory.setAttribute("aria-label", t("contents"));
    byId("page-links").setAttribute("aria-label", t("onPage"));
    query.placeholder = t("placeholder");
    byId("menu-toggle")?.setAttribute("aria-label", t("menu"));
    chapterGrid();
    quickStart();
    query.setAttribute("aria-label", t("search"));
    document.querySelector('[data-close="search"]').setAttribute("aria-label", t("closeSearch"));
    document.querySelector('[data-close="sheet"]').setAttribute("aria-label", t("closeSheet"));
    positionPage({ focus: false, reposition: false });
  }

  function showSheet(button) {
    const page = pages.get(button.dataset.operation.split("/")[0]);
    const block = page.blocks.find(item => item.id === button.dataset.operation);
    sheetOrigin = button;
    sheet.dataset.operation = block.id;
    byId("sheet-path").textContent = pathFor(page) + " / " + operationName(block);
    const sheetTitle = byId("sheet-title");
    sheetTitle.textContent = labelFor(block);
    sheetTitle.tabIndex = -1;
    const following = page.blocks[page.blocks.indexOf(block) + 1];
    const next = block.kind === "step" && following?.kind === "step" ? following : null;
    const nextLink = next
      ? '<a class="sheet-next" href="#' + esc(next.id) + '"><span>' + t("next") +
        '</span><strong>' + esc(next.title[lang]) + ' →</strong></a>'
      : "";
    byId("sheet-body").innerHTML = block.body[lang] + notesFor(block) + alertFor(block) + nextLink;
    byId("sheet-body").querySelectorAll(".table-scroll").forEach(el =>
      el.setAttribute("aria-label", t("table")));
    if ("closing" in sheet.dataset) { delete sheet.dataset.closing; nativeClose.call(sheet); }
    sheet.showModal();
    sheet.querySelector(".sheet-content").scrollTop = 0;
    sheetTitle.focus({ preventScroll: true });
  }

  function normalize(value) {
    return value.normalize("NFKD").toLowerCase().replace(/\p{M}/gu, "")
      .replace(/[^\p{L}\p{N}]+/gu, " ").trim();
  }

  function oneEdit(first, second) {
    if (first.length < 5 || Math.abs(first.length - second.length) > 1) return false;
    let left = 0;
    while (left < first.length && first[left] === second[left]) left++;
    if (first.length !== second.length) {
      return first.length > second.length
        ? first.slice(left + 1) === second.slice(left)
        : second.slice(left + 1) === first.slice(left);
    }
    const sameSuffix = first.slice(left + 1) === second.slice(left + 1);
    const transposed = first[left] === second[left + 1] && first[left + 1] === second[left] &&
      first.slice(left + 2) === second.slice(left + 2);
    return sameSuffix || transposed;
  }

  const searchable = handbook.pages.flatMap(page => page.blocks.map(block => {
    const titles = [block.title.en, block.title.zh, block.id].map(normalize);
    const aliases = block.aliases.map(normalize);
    const body = normalize(block.plain.en + " " + block.plain.zh);
    const terms = new Set([...titles, ...aliases, body].join(" ").split(" "));
    const codes = [...block.body.en.matchAll(/<code>([^<]+)<\/code>/g)]
      .map(match => normalize(match[1]));
    return { page, block, titles, aliases, body, terms, codes };
  }));
  const suggestions = ["2-1/step-5", "2-2/failure-reasons", "3-1/step-4", "4-2/financial"];
  const suggestedResults = suggestions.map(id => searchable.find(item => item.block.id === id)).filter(Boolean);

  function relevance(item, phrase) {
    if (item.titles.includes(phrase)) return 140;
    if (item.codes.includes(phrase) && (phrase.includes(" ") || /^[a-z0-9]{2,}$/.test(phrase))) return 122;
    if (item.aliases.includes(phrase)) return 117;
    if (item.titles.some(title => title.includes(phrase))) return 95;
    if (item.aliases.some(alias => alias.includes(phrase))) return 85;
    if (item.body.includes(phrase)) return 72;

    const tokens = phrase.split(" ");
    if (tokens.length === 1 && tokens[0].length < 5) return 0;
    let exact = 0;
    for (const token of tokens) {
      if (item.terms.has(token)) {
        exact++;
      } else if (token.length >= 5 && [...item.terms].some(term => oneEdit(token, term))) {
        continue;
      } else {
        return 0;
      }
    }
    if (tokens.length === 1 && item.aliases.some(alias => oneEdit(phrase, alias))) return 65;
    const fuzzyTitle = tokens.length === 1 &&
      [...item.titles, ...item.aliases].some(title => title.split(" ").some(term => oneEdit(phrase, term)));
    return fuzzyTitle ? 55 : 35 + exact;
  }

  function excerptFor(item, raw) {
    const text = item.block.plain[lang] || item.block.summary[lang] || "";
    const queryText = raw.trim();
    const hit = queryText ? text.toLowerCase().indexOf(queryText.toLowerCase()) : -1;
    if (!text) return "";
    if (hit < 0) return esc(text.length > 115 ? text.slice(0, 112) + "…" : text);
    const start = Math.max(0, hit - 29);
    const end = Math.min(text.length, hit + queryText.length + 73);
    return (start ? "…" : "") + esc(text.slice(start, hit)) + "<mark>" +
      esc(text.slice(hit, hit + queryText.length)) + "</mark>" +
      esc(text.slice(hit + queryText.length, end)) + (end < text.length ? "…" : "");
  }

  function pickResult(index, moveFocus) {
    if (!currentResults.length) return;
    selectedResult = Math.min(Math.max(index, 0), currentResults.length - 1);
    const links = Array.from(results.querySelectorAll(".result"));
    links.forEach((link, position) => {
      link.dataset.active = String(position === selectedResult);
    });
    if (moveFocus) {
      links[selectedResult].focus({ preventScroll: true });
      links[selectedResult].scrollIntoView({ block: "nearest" });
    }
  }

  function updateResults() {
    const phrase = normalize(query.value);
    const ranked = phrase ? searchable.map(item => ({ item, score: relevance(item, phrase) }))
      .filter(hit => hit.score > 0).sort((a, b) => b.score - a.score) : [];
    currentResults = phrase ? ranked.map(hit => hit.item) : suggestedResults;
    const count = ranked.length;
    byId("result-status").textContent = phrase
      ? (count === 1 ? t("oneMatch") : count + " " + t("match"))
      : t("suggested");
    results.innerHTML = currentResults.length
      ? currentResults.map((item, i) => {
        const chapter = pathFor(item.page) + (item.block.kind === "intro" ? "" : " / " + item.page.title[lang]);
        const excerpt = excerptFor(item, query.value);
        return '<a class="result" data-result="' + i + '" href="#' + esc(item.block.id) + '">' +
          '<span class="result-path">' + esc(chapter) + '</span><span class="result-title">' +
          esc(labelFor(item.block)) + "</span>" +
          (excerpt ? '<span class="result-excerpt">' + excerpt + "</span>" : "") + "</a>";
      }).join("")
      : '<p class="empty">' + t("noMatch") + "</p>";
    results.scrollTop = 0;
    pickResult(0, false);
  }

  function showSearch() {
    if (sheet.open && !("closing" in sheet.dataset)) return;
    if ("closing" in search.dataset) delete search.dataset.closing;
    if (!search.open) {
      searchOrigin = document.activeElement;
      search.showModal();
      replay(results);
    }
    updateResults();
    query.focus();
    query.select();
  }

  function followSearch(item) {
    if (!item) return;
    skipRestore = true;
    search.close();
    go(item.block.id);
  }

  searchTrigger.addEventListener("click", showSearch);
  query.addEventListener("input", updateResults);
  search.addEventListener("close", () => {
    if (!skipRestore) (searchOrigin?.isConnected ? searchOrigin : searchTrigger).focus({preventScroll: true});
    skipRestore = false;
  });
  sheet.addEventListener("close", () => {
    if (sheetOrigin?.isConnected) sheetOrigin.focus({ preventScroll: true });
  });
  function showImage(image) {
    lightboxOrigin = image;
    lightboxImage.src = image.currentSrc || image.src;
    lightboxImage.alt = image.alt;
    lightbox.setAttribute("aria-label", image.alt || (lang === "zh" ? "图片" : "Image"));
    lightbox.querySelector(".close").setAttribute("aria-label", lang === "zh" ? "关闭图片" : "Close image");
    if ("closing" in lightbox.dataset) delete lightbox.dataset.closing;
    if (!lightbox.open) lightbox.showModal();
  }
  lightbox.addEventListener("click", () => lightbox.close());
  lightbox.addEventListener("close", () => {
    if (lightboxOrigin?.isConnected) lightboxOrigin.focus({ preventScroll: true });
    lightboxOrigin = null;
  });
  article.addEventListener("keydown", event => {
    if ((event.key === "Enter" || event.key === " ") && event.target.matches("img[data-zoom]")) {
      event.preventDefault();
      showImage(event.target);
    }
  });
  const nativeClose = HTMLDialogElement.prototype.close;
  for (const dialog of [search, sheet, lightbox]) {
    dialog.close = function close(...args) {
      if (!this.open || calm()) { delete this.dataset.closing; nativeClose.apply(this, args); return; }
      if ("closing" in this.dataset) return;
      this.dataset.closing = "";
      const finish = () => {
        if (!("closing" in this.dataset)) return;
        delete this.dataset.closing;
        nativeClose.apply(this, args);
      };
      this.addEventListener("animationend", function end(event) {
        if (event.target !== dialog) return;
        dialog.removeEventListener("animationend", end);
        finish();
      });
      setTimeout(finish, 260);
    };
    dialog.addEventListener("cancel", event => { event.preventDefault(); dialog.close(); });
  }
  for (const dialog of [search, sheet]) {
    dialog.addEventListener("click", event => {
      if (event.target !== dialog) return;
      const bounds = dialog.getBoundingClientRect();
      if (event.clientX < bounds.left || event.clientX > bounds.right ||
          event.clientY < bounds.top || event.clientY > bounds.bottom) dialog.close();
    });
  }
  search.addEventListener("keydown", event => {
    if (event.isComposing) return;
    if (event.key === "Escape") {
      event.preventDefault();
      search.close();
      return;
    }
    if (!currentResults.length) return;
    const result = event.target.closest("[data-result]");
    if (event.key === "ArrowDown" || event.key === "ArrowUp") {
      event.preventDefault();
      const index = result ? Number(result.dataset.result) : -1;
      if (event.key === "ArrowUp" && index <= 0) {
        query.focus();
        pickResult(0, false);
      } else {
        pickResult(index + (event.key === "ArrowDown" ? 1 : -1), true);
      }
    } else if (event.key === "Enter" && event.target === query) {
      event.preventDefault();
      followSearch(currentResults[selectedResult]);
    }
  });
  document.addEventListener("keydown", event => {
    if (event.key === "Escape" && document.body.classList.contains("nav-open")) setNav(false);
    if ((event.metaKey || event.ctrlKey) && event.key.toLowerCase() === "k" && !sheet.open) {
      event.preventDefault();
      showSearch();
    }
  });
  document.addEventListener("click", event => {
    if (event.target.closest("[data-close-nav]")) setNav(false);
    if (event.target.matches("img[data-zoom]")) { showImage(event.target); return; }
    const control = event.target.closest("a, button");
    if (!control) return;
    if (control.id === "menu-toggle") { setNav(!document.body.classList.contains("nav-open")); return; }
    if (control.hasAttribute("data-open-search")) { showSearch(); return; }
    if (control.closest("#directory") && control.matches("a")) setNav(false);
    const { language, operation, close, result } = control.dataset;
    if (language && lang !== language) {
      lang = language;
      try { localStorage.setItem("gfs-ops-language", lang); } catch { /* Optional preference. */ }
      applyLanguage();
    } else if (operation) {
      showSheet(control);
    } else if (close) {
      ({ sheet, search, lightbox })[close]?.close();
    } else if (result !== undefined && !event.metaKey && !event.ctrlKey && !event.shiftKey) {
      event.preventDefault();
      followSearch(currentResults[Number(result)]);
    } else if (control.id === "skip") {
      event.preventDefault();
      (byId("chapter-title")?.closest("[hidden]") ? byId("content") :
        byId("chapter-title") || byId("content")).focus();
    } else {
      const href = control.getAttribute("href");
      if (href?.startsWith("#") && !event.metaKey && !event.ctrlKey && !event.shiftKey && !event.altKey) {
        event.preventDefault();
        if (sheet.open) {
          sheetOrigin = null;
          sheet.close();
        }
        go(href.slice(1));
      }
    }
  });
  window.addEventListener("hashchange", () => positionPage());
  document.querySelectorAll("#search-key, .hero-search kbd").forEach(key => {
    key.textContent = /mac/i.test(navigator.platform) ? "⌘ K" : "Ctrl K";
  });
  document.querySelectorAll(".hubs circle[data-route]").forEach(dot => {
    const path = document.querySelector(".route-" + dot.dataset.route);
    if (!path?.getPointAtLength) return;
    const point = path.getPointAtLength(path.getTotalLength() * Number(dot.dataset.at));
    dot.setAttribute("cx", point.x.toFixed(1));
    dot.setAttribute("cy", point.y.toFixed(1));
  });
  applyLanguage();
  positionPage({ focus: false });
})();
</script>
</body>
</html>
